<script>/* Kring – digitale kastickets lezen (Xtra-app: Colruyt / Collect&Go, CoMarkt).
   pdfNaarRegels(pdfjs, bytes) → tekstregels met kolomafstanden; leesTicket(regels) → winkel, datum, lijnen, totaal.
   Bedragen in cent. Werkt in de browser (window.KringTicket) en in Node (module.exports). */
(function (root) {
  "use strict";

  /* PDF → regels. Items op dezelfde hoogte vormen één regel; een grote tussenruimte wordt "   " (kolomgrens). */
  async function pdfNaarRegels(pdfjs, bytes) {
    const doc = await pdfjs.getDocument({ data: bytes, isEvalSupported: false, disableFontFace: true }).promise;
    const regels = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const tc = await (await doc.getPage(p)).getTextContent();
      const rijen = [];
      for (const it of tc.items) {
        if (!("str" in it)) continue;
        const y = it.transform[5], x = it.transform[4];
        let r = rijen.find(r => Math.abs(r.y - y) < 2.5);
        if (!r) { r = { y, items: [] }; rijen.push(r); }
        r.items.push({ x, w: it.width || 0, s: it.str });
      }
      rijen.sort((a, b) => b.y - a.y);
      for (const r of rijen) {
        r.items.sort((a, b) => a.x - b.x);
        let t = "", eind = null;
        for (const it of r.items) {
          if (eind != null && it.x - eind > 4) t += "   ";
          else if (eind != null && it.x - eind > 0.8 && !/\s$/.test(t) && !/^\s/.test(it.s)) t += " ";
          if (/^\s+$/.test(it.s)) t += it.w > 8 ? "   " : " ";
          else t += it.s;
          eind = it.x + it.w;
        }
        regels.push(t.replace(/\s+$/, ""));
      }
    }
    return regels;
  }

  const cent = s => Math.round(parseFloat(String(s).replace(/\s/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")) * 100);
  const isGetal = s => /^-?\d+(?:,\d+)?(?:kg)?$/i.test(s);

  function winkelVan(regels) {
    const tekst = regels.join("\n");
    if (/Colruyt Food Retail|www\.colruyt\.be/i.test(tekst)) {
      const vest = regels.find(r => /^\s*(CADI|COLRUYT)\s+[A-Z]/.test(r));
      return { code: "colruyt", naam: "Colruyt / Collect&Go", vestiging: vest ? vest.trim().split(/\s{3,}/)[0] : "", cg_nummers: true };
    }
    const cm = tekst.match(/CoMarkt\s+([A-Za-zÀ-ÿ-]+)/i);
    if (cm) return { code: "comarkt-" + cm[1].toLowerCase(), naam: "CoMarkt " + cm[1], vestiging: cm[1], cg_nummers: false };
    return { code: "onbekend", naam: "Onbekende winkel", vestiging: "", cg_nummers: false };
  }

  /** Lees de regels van een kasticket. */
  function leesTicket(regels) {
    const winkel = winkelVan(regels);
    let datum = null, tijd = null;
    for (const r of regels) { const m = r.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/); if (m) { datum = `${m[3]}-${m[2]}-${m[1]}`; tijd = `${m[4]}:${m[5]}`; break; } }
    const lijnen = [], betalingen = [];
    let gewicht = false, totaal = null, totZoek = false;
    for (let i = 0; i < regels.length; i++) {
      const r = regels[i].trim();
      if (!r) continue;
      if (/GEWICHTSARTIKELEN/i.test(r)) { gewicht = true; continue; }
      if (/^(B\s*$|T\s+Art|W\s*$|Artnr)/i.test(r)) { gewicht = false; continue; }              // kop op een nieuwe pagina
      // Korting op de vorige lijn
      const k = r.match(/^(Korting|TOP PROMO|Promo|Actie).*?(-\d+,\d{2})$/i);
      if (k && lijnen.length) { lijnen[lijnen.length - 1].korting += cent(k[2]); continue; }
      // Totaal: "Te betalen € 45,70" of kop "TE BETALEN" met de bedragen op de volgende regel
      if (/te betalen/i.test(r)) {
        const m = r.match(/te betalen\s+€?\s*(\d[\d.]*,\d{2})\s*$/i);
        if (m) totaal = cent(m[1]); else totZoek = true;
        continue;
      }
      if (totZoek) { const b = r.match(/(\d[\d.]*,\d{2})\s*$/); if (b) { totaal = cent(b[1]); totZoek = false; continue; } }
      const bet = r.match(/^(?:.*\s{3,})?(BANCONTACT|EMCHE EDENRED|EDENRED|SODEXO|PLUXEE|MONIZZE|VISA|MAESTRO|MASTERCARD|CASH|CONTANT)\s+€?\s*(\d[\d.]*,\d{2})$/i);
      if (bet) { betalingen.push({ wijze: bet[1].toUpperCase(), bedrag: cent(bet[2]) }); continue; }
      // Productlijn: [btw-code] artnr naam … hoev [eenheidsprijs] bedrag
      const cel = r.split(/\s{2,}/).map(s => s.trim()).filter(Boolean);
      let btw = null;
      if (/^[A-D]$/.test(cel[0])) btw = cel.shift();
      let art = null, naam = null;
      if (cel.length && /^\d{3,7}$/.test(cel[0]) && cel.length > 1 && !isGetal(cel[1])) { art = cel.shift(); naam = cel.shift(); }
      else if (cel.length) { const m = cel[0].match(/^(\d{3,7})(?:\s+|(?=[^\d\s,.]))(.*\D.*)$/); if (m) { art = m[1]; naam = m[2]; cel.shift(); } }
      if (!art) continue;
      for (let j = cel.length - 1; j >= 0; j--) { const d = cel[j].split(/\s+/); if (d.length > 1 && d.every(isGetal)) cel.splice(j, 1, ...d); }   // "0,241kg 23,90"
      const getallen = [];
      while (cel.length && isGetal(cel[cel.length - 1])) getallen.unshift(cel.pop());
      if (cel.length) naam = [naam, ...cel].join(" ");                          // restje naam (bv. "S x 1")
      if (getallen.length < 2 || !/,\d{2}$/.test(getallen[getallen.length - 1])) continue;
      const bedrag = cent(getallen.pop());
      const hoevTxt = getallen.length >= 2 ? getallen[getallen.length - 2] : getallen[0];
      const eenhTxt = getallen.length >= 2 ? getallen[getallen.length - 1] : null;
      const kg = gewicht || /kg$/i.test(hoevTxt);
      const aantal = parseFloat(hoevTxt.replace(/kg$/i, "").replace(",", "."));
      lijnen.push({ artnr: art, naam: naam.replace(/\s+/g, " ").trim(), aantal, eenheid: kg ? "kg" : "stuk",
        eenheidsprijs: eenhTxt ? cent(eenhTxt) : (aantal ? Math.round(bedrag / aantal) : null), bedrag, korting: 0, btw });
    }
    const som = lijnen.reduce((s, l) => s + l.bedrag + l.korting, 0);
    return { winkel, datum, tijd, lijnen, totaal, som, klopt: totaal != null && som === totaal, betalingen,
      sleutel: [winkel.code, datum, tijd, totaal].join("|") };
  }

  const api = { pdfNaarRegels, leesTicket, winkelVan, cent };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.KringTicket = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* Kring – Voorraad: koelkasten en rekken (de diepvries heeft een eigen module), kastickets inlezen en
   het scherm "Binnengekomen". Zelfde regels als 20261111_gezin_voorraad.sql:
   - Colruyt/Collect&Go: artikelnummer op het ticket = Collect&Go-product-ID → exacte koppeling.
   - Andere winkels (CoMarkt): de app onthoudt per winkel artikelnummer → product.
   - Per product onthoudt de app de bestemming (categorie of diepvries of niet bijhouden).
   Gebruikt de globale hulpfuncties ($, esc, S, db, run, openPaneel, toast, K, KringTicket …). */
"use strict";
const PDFJS_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
const PDFJS_WORKER_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
const VR_SOORT = [["koelkast", "Koelkast"], ["rek", "Rek"], ["kast", "Kast"], ["andere", "Andere"]];
const VR_EENH = [["stuk", "stuks"], ["kg", "kg"], ["pak", "pakken"], ["fles", "flessen"], ["blik", "blikken"]];
const vrEenh = (n, u) => u === "kg" ? "kg" : n === 1 ? ({ stuk: "stuk", pak: "pak", fles: "fles", blik: "blik" }[u] || u) : ((VR_EENH.find(x => x[0] === u) || [u, u])[1]);
const vrAantal = i => `${fmtNum(i.aantal, i.eenheid === "kg" ? 3 : 2)} ${vrEenh(Number(i.aantal), i.eenheid)}`;
const vrDagen = (ds, n) => iso(plus(new Date(ds + "T12:00:00"), n));

/* ---------- Testindeling (naar de foto's van 11/11; namen en planken aanpasbaar) ---------- */
function demoVoorraad(){
  const r = [["KK", "Koelkast keuken", "koelkast", 0], ["KB", "Koelkast berging", "koelkast", 0],
             ["R1", "Rek 1 · voeding en drank", "rek", 5], ["R2", "Rek 2 · schoonmaak en drank", "rek", 5], ["R3", "Rek 3 · huishouden", "rek", 5]]
    .map(([code, naam, soort, planken], i) => ({ id: uid(), code, naam, soort, planken, volgorde: i + 1, actief: true }));
  const rid = c => r.find(x => x.code === c).id;
  const categorieen = [
    ["Zuivel en eieren", "KK", null, 10], ["Kaas en charcuterie", "KK", null, 7], ["Vers vlees en vis", "KK", null, 3],
    ["Groenten en fruit", "KK", null, 7], ["Sauzen (open)", "KK", null, null], ["Koude drank", "KB", null, null],
    ["Water, melk en frisdrank", "R1", 2, null], ["Brood, fruit en koekjes", "R1", 3, null], ["Ontbijt, beleg en conserven", "R1", 4, null],
    ["Wijn en olie", "R1", 5, null], ["Koffie, thee en suiker", "R2", 4, null], ["Schoonmaak en was", "R2", 3, null],
    ["Bier en frisdrank (bak)", "R2", 5, null], ["Huishouden", "R3", 2, null], ["Verzorging", "R3", 2, null], ["Aardappelen en uien", "R1", 3, null]
  ].map(([naam, code, plank, dagen], i) => ({ id: uid(), naam, ruimte_id: rid(code), plank, houdbaar_dagen: dagen, volgorde: i + 1 }));
  return { ruimtes: r, categorieen, items: [], tickets: [], codes: {}, bestemming: {} };
}
/* Voorbeeldinhoud voor de testversie (geen echte voorraad) */
function vrDemoItems(v, d){
  const vd = new Date(), dag = n => iso(plus(vd, n));
  const cat = n => v.categorieen.find(c => c.naam === n);
  const p = z => d.producten.find(x => x.naam.toLowerCase().includes(z)) || null;
  const zet = (z, naam, catNaam, aantal, eenheid, binnen, eet) => { const c = cat(catNaam), pr = z && p(z);
    v.items.push({ id: uid(), product_id: pr ? pr.id : null, naam: pr ? pr.naam : naam, categorie_id: c.id, ruimte_id: c.ruimte_id, plank: c.plank, aantal, eenheid, binnen_op: dag(binnen), eet_voor: eet == null ? null : dag(eet), op_op: null }); };
  zet("culinaire room", "Culinaire room", "Zuivel en eieren", 1, "stuk", -6, 4);
  zet("yoghurt", "Yoghurt", "Zuivel en eieren", 4, "stuk", -6, 1);
  zet("gouda", "Gouda sneetjes", "Kaas en charcuterie", 1, "stuk", -6, -1);
  zet("hespenworst", "Hespenworst", "Kaas en charcuterie", 1, "stuk", -2, 5);
  zet(null, "Eieren", "Koude drank", 10, "stuk", -4, null);
  zet(null, "Ginger ale 33cl", "Koude drank", 8, "blik", -6, null);
  zet(null, "Bruisend water 1,5L", "Water, melk en frisdrank", 6, "fles", -6, null);
  zet(null, "Halfvolle melk 1L", "Water, melk en frisdrank", 4, "stuk", -6, null);
  zet("olijfolie extra", "Olijfolie extra vierge 1L", "Wijn en olie", 1, "fles", -6, null);
  zet(null, "Koffie decaf", "Koffie, thee en suiker", 3, "pak", -20, null);
  zet(null, "Suikerklontjes", "Koffie, thee en suiker", 1, "pak", -40, null);
  zet(null, "Wasverzachter", "Schoonmaak en was", 2, "fles", -6, null);
  zet(null, "Vuilniszakken 35x5L", "Huishouden", 1, "stuk", -6, null);
}

/* ---------- Opslag (testversie in de browser; echte versie via Supabase) ---------- */
window.VR_LOCAL = {
  async loadVoorraad(){
    if (!this.d.voorraad) { this.d.voorraad = demoVoorraad(); vrDemoItems(this.d.voorraad, this.d); this.save(); }
    return JSON.parse(JSON.stringify(this.d.voorraad));
  },
  async vrTicketBewaren(t){
    const v = this.d.voorraad, bestaand = v.tickets.find(x => x.sleutel === t.sleutel && x.status !== "verwijderd");
    if (bestaand && !t.toch) return { dubbel: bestaand };
    const n = { id: uid(), ...t, toch: undefined, status: "binnengekomen", ingelezen: new Date().toISOString() };
    v.tickets.push(n); this.save(); return { ticket: n };
  },
  async vrTicketVerwijderen(id){ const t = this.d.voorraad.tickets.find(x => x.id === id); if (t) t.status = "verwijderd"; this.save(); },
  /* Eén transactie in de echte versie (gezin.ticket_verwerken) */
  async vrTicketVerwerken(id, keuzes){
    const v = this.d.voorraad, t = v.tickets.find(x => x.id === id);
    if (!t || t.status !== "binnengekomen") throw new Error("dit ticket is al verwerkt");
    const kopie = JSON.stringify({ voorraad: this.d.voorraad, diepvries: this.d.diepvries, producten: this.d.producten });   // alles of niets
    try { return await this.vrVerwerkLijnen(t, keuzes); }
    catch (e) { Object.assign(this.d, JSON.parse(kopie)); this.save(); throw e; }
  },
  async vrVerwerkLijnen(t, keuzes){
    const v = this.d.voorraad;
    let nVr = 0, nDv = 0, nNieuw = 0;
    for (const k of keuzes){
      const l = t.lijnen[k.lijn];
      let pid = k.product_id;
      if (!pid){                                              // nieuw product uit het ticket
        pid = t.winkel.cg_nummers ? l.artnr : "w-" + uid();
        if (!this.d.producten.some(p => String(p.id) === String(pid))) {
          this.d.producten.push({ id: pid, naam: l.naam, afdeling: K.afdelingVoor(l.naam), inhoud: null, inhoud_eenheid: null,
            prijs: l.eenheidsprijs != null ? l.eenheidsprijs / 100 : null, prijs_per: l.eenheid === "kg" ? "kg" : "stuk", beschikbaar: true, kern: K.productKern(l.naam), winkel: t.winkel.code });
          nNieuw++;
        }
      } else if (t.winkel.cg_nummers && l.eenheidsprijs != null) {      // Colruyt-prijs = Collect&Go-prijs
        const p = this.d.producten.find(x => String(x.id) === String(pid)); if (p) p.prijs = l.eenheidsprijs / 100;
      }
      if (!t.winkel.cg_nummers) v.codes[t.winkel.code + "|" + l.artnr] = pid;
      v.bestemming[pid] = { soort: k.soort, categorie_id: k.categorie_id || null };
      if (k.soort === "voorraad"){
        const c = v.categorieen.find(x => x.id === k.categorie_id);
        const naam = (this.d.producten.find(p => String(p.id) === String(pid)) || {}).naam || l.naam;
        const eet = c && c.houdbaar_dagen ? vrDagen(t.datum, c.houdbaar_dagen) : null;
        const zelfde = v.items.find(i => !i.op_op && String(i.product_id) === String(pid) && i.categorie_id === k.categorie_id && i.eenheid === l.eenheid);
        if (zelfde){ zelfde.aantal = Math.round((zelfde.aantal + l.aantal) * 1000) / 1000; zelfde.binnen_op = t.datum; if (eet && (!zelfde.eet_voor || eet < zelfde.eet_voor)) zelfde.eet_voor = zelfde.eet_voor || eet; }
        else v.items.push({ id: uid(), product_id: pid, naam, categorie_id: k.categorie_id, ruimte_id: c ? c.ruimte_id : null, plank: c ? c.plank : null,
          aantal: l.aantal, eenheid: l.eenheid, binnen_op: t.datum, eet_voor: eet, op_op: null, ticket_id: t.id });
        nVr++;
      } else if (k.soort === "diepvries"){
        const kg = l.eenheid === "kg";
        const pnaam = (this.d.producten.find(p => String(p.id) === String(pid)) || {}).naam || l.naam;
        await this.dvInvriezen({ soort: "product", product_id: pid, naam: pnaam, categorie_id: k.categorie_id, aantal: kg ? Math.round(l.aantal * 1000) : l.aantal,
          eenheid: kg ? "g" : "stuk", ingevroren_op: t.datum });
        nDv++;
      }
    }
    t.status = "verwerkt"; t.verwerkt_op = new Date().toISOString(); this.save();
    await this.log(`las het ticket van ${t.winkel.naam} (${dvDatum(t.datum)}) in: ${nVr} op voorraad, ${nDv} in de diepvries`);
    return { nVr, nDv, nNieuw };
  },
  async vrGebruik(id, n){
    const i = this.d.voorraad.items.find(x => x.id === id); if (!i || i.op_op) throw new Error("niet meer in voorraad");
    if (n == null || n >= i.aantal) i.op_op = new Date().toISOString(); else i.aantal = Math.round((i.aantal - n) * 1000) / 1000;
    this.save(); return { rest: i.op_op ? 0 : i.aantal };
  },
  async vrBewaarItem(id, w){ Object.assign(this.d.voorraad.items.find(x => x.id === id), w); this.save(); },
  async vrToevoegen(w){ const it = { id: uid(), op_op: null, binnen_op: iso(new Date()), ...w }; this.d.voorraad.items.push(it); this.save(); await this.log(`zette '${it.naam}' in de voorraad`); return it; },
  async vrBewaarIndeling(ruimtes, cats){ this.d.voorraad.ruimtes = ruimtes; this.d.voorraad.categorieen = cats; this.save(); }
};
window.VR_SUPA = {
  async loadVoorraad(){
    const q = t => this.g.from(t).select("*").eq("huishouden_id", this.h);
    const [r, c, i, t, w, b] = await Promise.all([q("voorraad_ruimtes").order("volgorde"), q("voorraad_categorieen").order("volgorde"),
      q("voorraad_items").is("op_op", null), q("tickets").neq("status", "verwijderd").order("datum", { ascending: false }).limit(30),
      q("winkel_codes"), this.g.from("producten").select("id, bestemming, voorraad_categorie_id, diepvries_categorie_id").eq("huishouden_id", this.h).not("bestemming", "is", null)]);
    const codes = {}; for (const x of this.ok(w)) codes[x.winkel + "|" + x.artnr] = x.product_id;
    const bestemming = {}; for (const x of this.ok(b)) bestemming[x.id] = { soort: x.bestemming, categorie_id: x.bestemming === "diepvries" ? x.diepvries_categorie_id : x.voorraad_categorie_id };
    return { ruimtes: this.ok(r), categorieen: this.ok(c), items: this.ok(i).map(x => ({ ...x, aantal: Number(x.aantal) })), tickets: this.ok(t), codes, bestemming };
  },
  async vrTicketBewaren(t){
    if (!t.toch){ const { data } = await this.g.from("tickets").select("*").eq("huishouden_id", this.h).eq("sleutel", t.sleutel).neq("status", "verwijderd").limit(1); if (data && data[0]) return { dubbel: data[0] }; }
    const { data, error } = await this.g.from("tickets").insert({ huishouden_id: this.h, sleutel: t.toch ? t.sleutel + "|" + Date.now() : t.sleutel, winkel: t.winkel, datum: t.datum, tijd: t.tijd,
      totaal: t.totaal, som: t.som, lijnen: t.lijnen, betalingen: t.betalingen }).select().single();
    if (error) throw new Error(error.message); return { ticket: data };
  },
  async vrTicketVerwijderen(id){ this.ok(await this.g.from("tickets").update({ status: "verwijderd" }).eq("id", id)); },
  async vrTicketVerwerken(id, keuzes){ return this.ok(await this.g.rpc("ticket_verwerken", { p_ticket: id, p_keuzes: keuzes })); },
  async vrGebruik(id, n){ return this.ok(await this.g.rpc("voorraad_gebruik", { p_item: id, p_aantal: n == null ? null : n })); },
  async vrBewaarItem(id, w){ this.ok(await this.g.from("voorraad_items").update(w).eq("id", id)); },
  async vrToevoegen(w){ const { data, error } = await this.g.from("voorraad_items").insert({ huishouden_id: this.h, ...w }).select().single(); if (error) throw new Error(error.message); return data; },
  async vrBewaarIndeling(ruimtes, cats){
    this.ok(await this.g.from("voorraad_ruimtes").upsert(ruimtes.map(r => ({ id: r.id, huishouden_id: this.h, code: r.code, naam: r.naam, soort: r.soort, planken: r.planken || 0, volgorde: r.volgorde, actief: r.actief }))));
    this.ok(await this.g.from("voorraad_categorieen").upsert(cats.map(c => ({ id: c.id, huishouden_id: this.h, naam: c.naam, ruimte_id: c.ruimte_id || null, plank: c.plank || null, houdbaar_dagen: c.houdbaar_dagen || null, volgorde: c.volgorde }))));
  }
};
async function herlaadVoorraad(){ try { S.vr = await db.loadVoorraad(); } catch(e){ console.error(e); S.vr = { ruimtes: [], categorieen: [], items: [], tickets: [], codes: {}, bestemming: {} }; } }

/* ---------- Afgeleid ---------- */
const vrRuimtes = alle => S.vr.ruimtes.filter(r => alle || r.actief).sort((a, b) => a.volgorde - b.volgorde);
const vrRuimte = id => S.vr.ruimtes.find(r => r.id === id);
const vrCat = id => S.vr.categorieen.find(c => c.id === id);
const vrCatNaam = n => S.vr.categorieen.find(c => c.naam === n);
const vrOpen = () => S.vr.tickets.filter(t => t.status === "binnengekomen");
function vrStatus(i){ const vd = iso(new Date()); return i.eet_voor && i.eet_voor < vd ? "oud" : i.eet_voor && i.eet_voor <= vrDagen(vd, 2) ? "binnenkort" : ""; }
function vrInHuis(pid){
  if (pid == null || !S.vr) return "";
  const n = S.vr.items.filter(i => !i.op_op && String(i.product_id) === String(pid)).reduce((s, i) => s + Number(i.aantal), 0)
    + (S.dv ? S.dv.items.filter(i => String(i.product_id) === String(pid)).reduce((s, i) => s + Number(i.aantal), 0) : 0);
  return n ? `<span class="tag let" title="Al in huis volgens de voorraad">in huis ${fmtNum(n, 2)}</span>` : "";
}

/* Bestemming raden voor een product zonder geleerde keuze */
function vrRaad(naam, afdeling, btw){
  const s = norm(naam) + " " + norm(afdeling);
  const cat = n => ({ soort: "voorraad", categorie_id: (vrCatNaam(n) || {}).id || null });
  if (/draagtas|\btas\b|statiegeld/.test(s)) return { soort: "niet" };
  if (/roomijs|\bijs\b|diepvries|loempia|strudel|frieten|nuggets|kroket|pizza/.test(s)) return { soort: "diepvries", categorie_id: (S.dv.categorieen.find(c => c.naam === dvRaadCategorie(naam, "product")) || {}).id || null };
  if (btw === "C" || /schoonmaak|soupline|wasmiddel|vaatwas|bref|ontkalk|kristalzout|afwas/.test(s)) {
    if (/scheer|conditioner|shampoo|tandpasta|deo|douche|zeep|verzorging|tandenborstel/.test(s)) return cat("Verzorging");
    if (/emmer|zak|folie|papier|batterij|lamp/.test(s)) return cat("Huishouden");
    return cat("Schoonmaak en was");
  }
  if (/brood|pistolet|sandwich|bol\b|koek|wafel|speculoos|chocolade|praliné|sintjes|marsepein|chips|pringles|crac|tuc|snoep|noten|granen|haver|picos|grissini|toast/.test(s)) return cat("Brood, fruit en koekjes");
  if (/bier|pils|leffe|kriek|duvel|jupiler/.test(s)) return cat("Bier en frisdrank (bak)");
  if (/wijn|cava|prosecco|olijfolie|\bolie\b|aperol|martini/.test(s)) return cat("Wijn en olie");
  if (/water|limonade|ginger|cola|frisdrank|ice tea|sap\b|melk\b(?!.*choco)|fanta|sprite|tonic/.test(s) && !/yoghurt|room/.test(s)) return cat("Water, melk en frisdrank");
  if (/koffie|thee|suiker/.test(s)) return cat("Koffie, thee en suiker");
  if (/aardappel|uien|\bui\b|krieltjes/.test(s) && !/schijf|gaar/.test(s)) return cat("Aardappelen en uien");
  if (/yoghurt|room|boter|smeren|melk|ei\b|eieren|skyr|pudding|vlootje|bakken en braden/.test(s)) return cat("Zuivel en eieren");
  if (/kaas|ham|worst|salami|paté|pate|charcut|rolletjes|chiffonade|salade|sla\b|tonijnsla|pens/.test(s) && !/sla multicolor/.test(s)) return cat("Kaas en charcuterie");
  if (/kip|gehakt|varken|rund|steak|zalm|vis|scampi|gerookte/.test(s)) return cat("Vers vlees en vis");
  if (/groenten|fruit|tomaat|tomaatjes|komkommer|sla\b|witloof|wortel|appel|druiven|pompoen|courgette|paprika|aardappelschijf/.test(s)) return cat("Groenten en fruit");
  return cat("Ontbijt, beleg en conserven");
}

/* Lijn → product en bestemming */
function vrKoppel(l, winkel){
  let p = null, hoe = "";
  if (winkel.cg_nummers){ p = S.producten.find(x => String(x.cg_product_id != null ? x.cg_product_id : x.id) === l.artnr); if (p) hoe = "artikelnummer"; }
  if (!p){ const id = S.vr.codes[winkel.code + "|" + l.artnr]; if (id != null){ p = product(id); if (p) hoe = "eerder gekoppeld"; } }
  if (!p){ const n = norm(l.naam); p = S.producten.find(x => norm(x.naam) === n) || (n.length >= 20 ? S.producten.find(x => norm(x.naam).startsWith(n)) : null); if (p) hoe = "naam"; }
  const geleerd = p && S.vr.bestemming[p.id];
  const best = geleerd ? { ...geleerd } : vrRaad(p ? p.naam : l.naam, p ? p.afdeling : K.afdelingVoor(l.naam), l.btw);
  return { product: p, hoe, bestemming: best, geleerd: !!geleerd };
}

/* ---------- Scherm voor een koelkast of rek ---------- */
function viewRuimte(){
  const r = vrRuimte(S.vrRuimte); if (!r) { S.vrRuimte = "diepvries"; return viewDiepvries(); }
  const items = S.vr.items.filter(i => !i.op_op && i.ruimte_id === r.id).map(i => ({ ...i, status: vrStatus(i), cat: vrCat(i.categorie_id) }));
  const cats = S.vr.categorieen.filter(c => c.ruimte_id === r.id).sort((a, b) => (a.plank || 0) - (b.plank || 0) || a.volgorde - b.volgorde);
  const z = norm(S.vrZoek);
  const zicht = items.filter(i => !z || norm(i.naam).includes(z)).sort((a, b) => (a.eet_voor || "9").localeCompare(b.eet_voor || "9") || a.naam.localeCompare(b.naam, "nl"));
  const groepen = r.planken
    ? [...Array.from({ length: r.planken }, (_, k) => k + 1), null].map(pl => [pl ? `Plank ${pl}${pl === 1 ? " (boven)" : pl === r.planken ? " (onder)" : ""}` : "Zonder plank", zicht.filter(i => (i.plank || null) === pl),
        cats.filter(c => (c.plank || null) === pl).map(c => c.naam)])
    : [...cats.map(c => [c.naam, zicht.filter(i => i.categorie_id === c.id), []]), ["Andere", zicht.filter(i => !cats.some(c => c.id === i.categorie_id)), []]];
  $("#view").innerHTML = vrKop() + `
    <div class="samenvatting"><div><span class="getal">${items.length}</span> <span class="muted">in ${esc(r.naam)}</span></div>
      <div class="acties" style="margin:0"><button class="knop sec klein" data-vrnieuw>+ Toevoegen</button><button class="knop sec klein" data-vrindeling>Indeling</button></div></div>
    <input class="in" id="vr-zoek" type="search" placeholder="Zoek in ${esc(r.naam)}" value="${esc(S.vrZoek)}" aria-label="Zoek" style="margin-bottom:8px">
    ${items.length ? groepen.filter(([, l, c]) => l.length || c.length).map(([kop, l, c]) => `<div class="groep"><h3><span>${esc(kop)}${c.length ? ` <small class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">· ${esc(c.join(", "))}</small>` : ""}</span><span>${l.length}</span></h3>
      ${l.map(i => `<div class="vr-rij"><button class="vr-wat" data-vritem="${i.id}"><b>${esc(i.naam)}</b><small>${vrAantal(i)}${i.cat && r.planken ? " · " + esc(i.cat.naam) : ""} · binnen ${dvDatum(i.binnen_op)}</small></button>
        ${i.eet_voor ? `<span class="tag ${i.status}">${i.status === "oud" ? "op sinds " : "eet voor "}${dvDatum(i.eet_voor)}</span>` : "<span></span>"}
        <button class="ib vr-min" data-vrmin="${i.id}" aria-label="Eén ${esc(i.naam)} gebruikt">−1</button></div>`).join("") || `<p class="muted" style="margin:6px 0">Leeg</p>`}</div>`).join("")
      : `<div class="leegstaat">Nog niets in ${esc(r.naam)}. Lees een kasticket in, of voeg iets toe met <b>+ Toevoegen</b>.</div>`}`;
}

/* ---------- Ticket inlezen ---------- */
let vrPdf = null;
async function vrLaadPdfjs(){
  if (vrPdf) return vrPdf;
  const lib = await import(PDFJS_URL);
  if (!globalThis.pdfjsWorker) globalThis.pdfjsWorker = await import(PDFJS_WORKER_URL);   // lezen in de pagina zelf (geen aparte worker nodig)
  return (vrPdf = lib);
}
async function vrLeesBestand(f){
  const fout = m => { const e = $("#vr-fout"); if (e){ e.textContent = m; e.hidden = false; } else toast(m); };
  if (!f) return;
  if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) return fout("Kies het PDF-bestand van het kasticket (uit de Xtra-app).");
  if (f.size > 5e6) return fout("Dit bestand is te groot voor een kasticket.");
  toast("Ticket lezen…");
  let t;
  try {
    const pdfjs = await vrLaadPdfjs();
    t = KringTicket.leesTicket(await KringTicket.pdfNaarRegels(pdfjs, new Uint8Array(await f.arrayBuffer())));
  } catch (e) { console.error(e); return fout("Dit bestand kon niet gelezen worden als kasticket. Is het de PDF uit de Xtra-app?"); }
  if (!t.lijnen.length) return fout("Geen producten gevonden op dit ticket. Werkt enkel met kastickets van Colruyt/Collect&Go en CoMarkt.");
  const r = await db.vrTicketBewaren(t);
  if (r.dubbel) return vrDubbel(t, r.dubbel);
  await herlaadVoorraad(); render(); openBinnengekomen(r.ticket.id);
}
/* Kasticket gedeeld vanuit een andere app (Android, via de service worker) */
async function vrGedeeldTicket(){
  if (new URLSearchParams(location.search).get("gedeeld") !== "ticket") return;
  history.replaceState(null, "", location.pathname + "#diepvries");
  S.tab = "diepvries"; render();
  let res = null;
  try { const c = await caches.open("kring-gedeeld"); res = await c.match("gedeeld-ticket"); if (res) await c.delete("gedeeld-ticket"); } catch(e){ console.error(e); }
  if (!res) return toast("Geen PDF ontvangen. Deel het kasticket als PDF-bestand.");
  const naam = decodeURIComponent(res.headers.get("X-Bestandsnaam") || "ticket.pdf");
  const f = new File([await res.blob()], naam, { type: res.headers.get("Content-Type") || "application/pdf" });
  await vrLeesBestand(f);
}
function vrDubbel(t, oud){
  openPaneel(`<div class="paneel-kop"><h2>Ticket al ingelezen</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    <p>Het ticket van <b>${esc(t.winkel.naam)}</b> van ${dvDatum(t.datum)} ${esc(t.tijd || "")} (${eur(t.totaal / 100)}) werd al ingelezen${oud.status === "verwerkt" ? " en verwerkt" : ""}. Nog eens inlezen zet alles dubbel op voorraad.</p>
    <div class="voet"><button class="knop sec" data-sluit>Annuleren</button><button class="knop" data-vrtoch>Toch opnieuw inlezen</button></div>`);
  $("#paneel").onclick = e => { if (e.target.closest("[data-vrtoch]")) run(async () => { const r = await db.vrTicketBewaren({ ...t, toch: true }); await herlaadVoorraad(); render(); openBinnengekomen(r.ticket.id); }); };
}

/* ---------- Binnengekomen: lijnen nakijken en bevestigen ---------- */
function vrBestemmingOpties(b){
  const sel = b.soort === "voorraad" ? "v:" + b.categorie_id : b.soort === "diepvries" ? "d:" + (b.categorie_id || "") : "n";
  const ruimtes = vrRuimtes();
  return `<option value="n" ${sel === "n" ? "selected" : ""}>Niet bijhouden</option>
    <optgroup label="Diepvries">${S.dv.categorieen.slice().sort((a, c) => a.volgorde - c.volgorde).map(c => `<option value="d:${c.id}" ${sel === "d:" + c.id ? "selected" : ""}>Diepvries · ${esc(c.naam)}</option>`).join("")}</optgroup>
    ${ruimtes.map(r => `<optgroup label="${esc(r.naam)}">${S.vr.categorieen.filter(c => c.ruimte_id === r.id).map(c => `<option value="v:${c.id}" ${sel === "v:" + c.id ? "selected" : ""}>${esc(r.code)} · ${esc(c.naam)}</option>`).join("")}</optgroup>`).join("")}`;
}
const vrBestLabel = b => b.soort === "niet" ? "niet bijhouden" : b.soort === "diepvries" ? "diepvries" : (() => { const c = vrCat(b.categorie_id), r = c && vrRuimte(c.ruimte_id); return r ? r.code : "?"; })();
function openBinnengekomen(id){
  const t = S.vr.tickets.find(x => x.id === id); if (!t) return;
  const rijen = t.lijnen.map((l, k) => ({ k, l, ...vrKoppel(l, t.winkel) }));
  const nieuw = rijen.filter(r => !r.product).length, herkend = rijen.length - nieuw;
  const volg = { diepvries: 0, voorraad: 1, niet: 2 };
  rijen.sort((a, b) => volg[a.bestemming.soort] - volg[b.bestemming.soort] || vrBestLabel(a.bestemming).localeCompare(vrBestLabel(b.bestemming)) || a.k - b.k);
  openPaneel(`
    <div class="paneel-kop"><h2>${esc(t.winkel.naam)} · ${dvDatum(t.datum)}</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    <p class="muted" style="margin-top:-6px">${t.lijnen.length} lijnen · ${eur(t.totaal / 100)} · ${t.klopt ? "som klopt met het ticket" : `<span class="neg-tekst">som ${eur(t.som / 100)} wijkt af van het ticket: kijk na of alles gelezen is</span>`}<br>
      ${herkend} herkend${t.winkel.cg_nummers ? " (Collect&Go-nummer)" : ""}, ${nieuw} nieuw. Kies per lijn waar het naartoe gaat; de app onthoudt dat per product.</p>
    <div class="vr-bin">${rijen.map(r => `<div class="vr-lijn" data-lijn="${r.k}">
      <div class="vr-lijn-wat"><b>${esc(r.l.naam)}</b><small>${fmtNum(r.l.aantal, 3)} ${r.l.eenheid === "kg" ? "kg" : "×"} · ${eur((r.l.bedrag + r.l.korting) / 100)} · ${r.product ? `${esc(r.hoe === "naam" && r.product.naam !== r.l.naam ? r.product.naam : "")}${r.hoe === "naam" && r.product.naam !== r.l.naam ? " · " : ""}<span class="muted">${r.geleerd ? "zoals vorige keer" : "herkend via " + r.hoe}</span>` : `<span class="tag let">nieuw product</span>`}</small></div>
      <select class="in vr-best" aria-label="Bestemming van ${esc(r.l.naam)}" data-pid="${r.product ? esc(r.product.id) : ""}">${vrBestemmingOpties(r.bestemming)}</select></div>`).join("")}</div>
    <div class="voet"><button class="knop gevaar links" data-vrweg>Ticket weggooien</button><button class="knop sec" data-sluit>Later</button><button class="knop" data-vrok>Alles bevestigen</button></div>`);
  const p = $("#paneel");
  p.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if ("vrweg" in b.dataset){
      if (!b.classList.contains("zeker")){ b.classList.add("zeker"); b.textContent = "Zeker weggooien?"; return; }
      return run(async () => { await db.vrTicketVerwijderen(t.id); await herlaadVoorraad(); sluitPaneel(); render(); toast("Ticket weggegooid"); });
    }
    if ("vrok" in b.dataset){
      const keuzes = [...p.querySelectorAll(".vr-lijn")].map(el => {
        const v = el.querySelector("select").value, pid = el.querySelector("select").dataset.pid || null;
        return { lijn: Number(el.dataset.lijn), product_id: pid, soort: v === "n" ? "niet" : v[0] === "d" ? "diepvries" : "voorraad", categorie_id: v === "n" ? null : v.slice(2) || null };
      });
      run(async () => {
        const r = await db.vrTicketVerwerken(t.id, keuzes);
        await Promise.all([herlaadVoorraad(), herlaadDiepvries(), herlaadProducten(), herlaadGezin()]); sluitPaneel(); render();
        toast(`${r.nVr} op voorraad, ${r.nDv} in de diepvries${r.nNieuw ? `, ${r.nNieuw} nieuwe producten` : ""}`);
      });
    }
  };
}

/* ---------- Item: gebruiken, verplaatsen ---------- */

  let n = Math.min(stap, i.aantal);
  openPaneel(`
    <div class="paneel-kop"><h2>${esc(i.naam)}</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    <dl class="kv"><dt>In voorraad</dt><dd>${vrAantal(i)}</dd><dt>Binnen</dt><dd>${dvDatum(i.binnen_op)}</dd>

    if ("vrgebruik" in b.dataset || "vralles" in b.dataset) run(async () => {

      <button class="knop sec klein" data-rnieuw>+ Ruimte</button>
      <h3 style="margin-top:18px">Wat hoort waar</h3>
      <div class="vr-ind cat kop"><span>Categorie</span><span>Ruimte</span><span>Plank</span><span>Dagen</span></div>
      ${cs.map(c => `<div class="vr-ind cat" data-vrc="${c.id}"><input class="in c-naam" value="${esc(c.naam)}" maxlength="60" aria-label="Categorie">
        <select class="in c-ruimte" aria-label="Ruimte"><option value="">—</option>${rs.map(r => `<option value="${r.id}" ${r.id === c.ruimte_id ? "selected" : ""}>${esc(r.code || "?")}</option>`).join("")}</select>
        <input class="in c-plank" type="number" min="0" max="12" step="1" value="${c.plank || ""}" aria-label="Plank"><input class="in c-dagen" type="number" min="0" max="999" step="1" value="${c.houdbaar_dagen || ""}" aria-label="Houdbaar in dagen" placeholder="—"></div>`).join("")}

      <p class="muted" style="font-size:.85rem">Dagen = richtwaarde voor "eet voor" bij inlezen (leeg: geen datum).</p>
      <p class="neg-tekst" id="vri-fout" hidden></p>

    $("#paneel").onclick = klik; $("#paneel").oninput = () => { $("#vri-fout").hidden = true; };
  };
  const klik = e => {
    const b = e.target.closest("button"); if (!b) return;
    if ("rnieuw" in b.dataset){ lees(); const n = rs.filter(r => r.soort === "rek").length + 1; rs.push({ id: uid(), code: "R" + n, naam: "Rek " + n, soort: "rek", planken: 5, volgorde: rs.length + 1, actief: true }); teken(); }
    if ("cnieuw" in b.dataset){ lees(); cs.push({ id: uid(), naam: "", ruimte_id: null, plank: null, houdbaar_dagen: null, volgorde: cs.length + 1 }); teken(); $(`[data-vrc="${cs[cs.length - 1].id}"] .c-naam`).focus(); }

      if (cs.some(c => !c.naam)) return fout("Geef elke categorie een naam.");

<script>/* Kring – weekvoorstel: warme gerechten voor de planweek (standaard vrijdag t/m donderdag) op basis van
   wat in huis is, wat eerst op moet, kant-en-klare dozen in de diepvries en afwisseling.
   Zuivere functies; werkt in de browser (window.KringVoorstel) en in Node (module.exports). */
(function (root) {
  "use strict";
  const STANDAARD = { automatisch: true, dag: 3, startdag: 5, dagen: 7, weekendMoment: "avond", eters: null,
                      uitgesloten: ["Salade"], uitgeslotenWoorden: ["salade", "slaatje", "panzanella", "bruschetta", "carpaccio"], nietHerhalenWeken: 3 };
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dag = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const plus = (s, n) => { const d = dag(s); d.setDate(d.getDate() + n); return iso(d); };
  const weekdag = s => (dag(s).getDay() + 6) % 7 + 1;                  // 1 = ma … 7 = zo
  const verschil = (a, b) => Math.round((dag(b) - dag(a)) / 864e5);

  /** Eerste startdag (bv. vrijdag) ná vandaag. */
  function planStart(vandaag, startdag) { let d = plus(vandaag, 1); while (weekdag(d) !== startdag) d = plus(d, 1); return d; }
  /** Moet het voorstel vandaag automatisch klaarstaan? (vanaf de overlegdag tot de dag vóór de start) */
  function automatischNu(vandaag, inst) {
    const start = planStart(vandaag, inst.startdag), af = verschil(vandaag, start);
    const wd = weekdag(vandaag), dagenTotStart = (inst.startdag - inst.dag + 7) % 7 || 7;
    return inst.automatisch && af <= dagenTotStart && ((wd - inst.dag + 7) % 7) < dagenTotStart;
  }

  /** Dagen van de planweek met eters en uitzonderingen uit de agenda.
      afspraken = uitgerold (KringAgenda.rolUit) met maaltijd: 'niet_mee' | 'geen_thuis' en deelnemers (lid-id's). */
  function planDagen(start, inst, leden, afspraken) {
    const eters = inst.eters || leden.length || 4, out = [];
    for (let k = 0; k < inst.dagen; k++) {
      const d = plus(start, k), wd = weekdag(d);
      const ev = afspraken.filter(a => a.dag === d && a.maaltijd);
      const weg = new Set(), redenen = [];
      let vrij = null;
      for (const a of ev) {
        if (a.maaltijd === "geen_thuis") { vrij = a.titel; continue; }
        const wie = (a.deelnemers || []).filter(id => leden.some(l => l.id === id));
        wie.forEach(id => weg.add(id));
        if (wie.length) redenen.push(`${wie.map(id => (leden.find(l => l.id === id) || {}).naam).join(", ")} ${wie.length > 1 ? "eten" : "eet"} niet mee (${a.titel})`);
      }
      const n = Math.max(0, eters - weg.size);
      if (!vrij && n === 0) vrij = "niemand eet thuis";
      out.push({ datum: d, weekdag: wd, moment: wd >= 6 ? inst.weekendMoment : "avond", eters: n, vrij, redenen });
    }
    return out;
  }

  /* ---------- Wat is in huis ---------- */
  const woorden = (s, K) => String(K.productKern ? K.productKern(s) : s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w.length >= 3);
  const stam = w => w.replace(/(tjes|jes|je|en|es|s|e)$/, "");

  function maakVoorraadIndex(voorraad, diepvries, K, start) {
    const items = [];
    voorraad = voorraad.filter(i => !i.eet_voor || i.eet_voor >= start);           // vervalt vóór de planweek: telt niet mee
    diepvries = diepvries.filter(i => !i.eet_voor || i.eet_voor >= start || i.soort !== "gerecht");
    for (const i of voorraad) items.push({ bron: "voorraad", id: i.id, product_id: i.product_id, naam: i.naam, eet_voor: i.eet_voor || null, w: woorden(i.naam, K).map(stam) });
    for (const i of diepvries) if (i.soort !== "gerecht") items.push({ bron: "diepvries", id: i.id, product_id: i.product_id, naam: i.naam, eet_voor: i.eet_voor || null, w: woorden(i.naam, K).map(stam) });
    const perProduct = new Map();
    for (const it of items) if (it.product_id != null) { const k = String(it.product_id); if (!perProduct.has(k)) perProduct.set(k, []); perProduct.get(k).push(it); }
    return { items, perProduct };
  }
  /** Zoek het voorraaditem voor een ingrediënt: eerst via de koppeling (exact), dan op het hoofdwoord. */
  function zoekInHuis(ingrNaam, idx, koppeling, K) {
    const sl = K.sleutel(ingrNaam), kp = koppeling[sl];
    if (kp && kp.product_id != null) { const l = idx.perProduct.get(String(kp.product_id)); if (l) return { item: l[0], hoe: "product" }; }
    const w = woorden(sl, { productKern: x => x }).map(stam);
    if (!w.length) return null;
    const hoofd = w[w.length - 1];
    if (hoofd.length < 3) return null;
    const kand = idx.items.filter(it => it.w.includes(hoofd) && w.slice(0, -1).every(x => x.length < 4 || it.w.includes(x)));
    if (!kand.length) return null;
    kand.sort((a, b) => (a.eet_voor || "9").localeCompare(b.eet_voor || "9"));
    return { item: kand[0], hoe: "naam" };
  }

  /* Kleine deterministische spreiding per week, zodat het voorstel niet elke week identiek is */
  function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }

  /** Score per gerecht. */
  function beoordeel(o) {
    const { gerechten, koppeling, voorraad, diepvries, historiek, inst, start, K } = o;
    const einde = plus(start, inst.dagen - 1);
    const idx = maakVoorraadIndex(voorraad, diepvries, K, start);
    const woordUit = (inst.uitgeslotenWoorden || []).map(w => String(w).toLowerCase()).filter(Boolean);
    const recent = new Set(historiek.filter(h => h.gerecht_id && verschil(h.datum, start) <= inst.nietHerhalenWeken * 7 && h.datum < start).map(h => h.gerecht_id));
    const uit = new Set((inst.uitgesloten || []).map(x => String(x).toLowerCase()));
    const dozen = diepvries.filter(i => i.soort === "gerecht" && i.gerecht_id);
    const out = [];
    for (const g of gerechten) {
      if (uit.has(String(g.categorie || "").toLowerCase())) continue;
      if (woordUit.some(w => String(g.naam).toLowerCase().includes(w))) continue;     // geen warm gerecht
      const ingr = (g.ingredienten || []).filter(i => i.naam && !K.isVoorraad(i.naam));
      const gevonden = [];
      for (const i of ingr) { const m = zoekInHuis(i.naam, idx, koppeling, K); if (m) gevonden.push({ ingr: i.naam, ...m }); }
      const dekking = ingr.length ? gevonden.length / ingr.length : 0;
      const dringend = gevonden.filter(f => f.item.eet_voor && f.item.eet_voor >= start && f.item.eet_voor <= einde && f.item.bron === "voorraad" || (f.item.bron === "diepvries" && f.item.eet_voor && f.item.eet_voor <= einde));
      const eerste = dringend.reduce((m, f) => !m || f.item.eet_voor < m ? f.item.eet_voor : m, null);
      const doos = dozen.filter(d => d.gerecht_id === g.id).sort((a, b) => (a.eet_voor || "9").localeCompare(b.eet_voor || "9"))[0] || null;
      const isRecent = recent.has(g.id);
      let score = 4 * dekking + 3 * Math.min(dringend.length, 2) + (g.favoriet ? 1 : 0) + hash(start + g.id) * 0.6;
      if (doos) score += 6 + (doos.eet_voor && doos.eet_voor <= einde ? 2 : 0);
      if (!ingr.length && !doos) score -= 1.5;                       // zonder ingrediënten: weinig te zeggen
      if (isRecent) score -= 8;
      const kop = [], staart = [];
      if (doos) kop.push(`klaar in de diepvries${doos.doos ? " (" + doos.doos + ")" : ""}: ${fmt(doos.aantal)} ${doos.eenheid === "portie" ? "porties" : doos.eenheid}`);
      if (ingr.length) staart.push(`${gevonden.length} van ${ingr.length} ingrediënten in huis`);
      if (isRecent) staart.push("onlangs nog gegeten");
      const items = [...new Map(dringend.map(f => [f.item.id, f.item])).values()];
      const redenen = kop.concat(items.slice(0, 2).map(gebruiktTekst), staart);
      out.push({ gerecht: g, score, dekking, dringend: dringend.length, dringendItems: items, kop, staart, eerste, doos, recent: isRecent, redenen, gevonden: gevonden.map(f => f.ingr) });
    }
    return out.sort((a, b) => b.score - a.score);
  }
  const gebruiktTekst = it => `gebruikt ${it.naam.replace(/^(BONI|EVERYDAY|COLRUYT|BELVIVA|CARREFOUR)\s+/i, "")} (eet voor ${kort(it.eet_voor)})`;
  const fmt = n => Number(n).toLocaleString("nl-BE", { maximumFractionDigits: 2 });
  const MND = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
  const kort = ds => { const [, m, d] = ds.split("-").map(Number); return `${d} ${MND[m - 1]}`; };

  /** Voorstel maken. dagen uit planDagen; vast = {datum: {gerecht_id|vrije_tekst}} (al gepland of vastgezet);
      uitsluiten = {datum: [gerecht_id]} (eerder geweigerd via "ander voorstel"). */
  function maakVoorstel(o) {
    const lijst = beoordeel(o);
    const dagen = o.dagen.map(d => ({ ...d }));
    const gebruikt = new Set(), dozenGebruikt = new Set(), geclaimd = new Set();
    for (const d of dagen) { const v = (o.vast || {})[d.datum]; if (v) { d.vast = true; d.gerecht_id = v.gerecht_id || null; d.vrije_tekst = v.vrije_tekst || null; d.redenen = (v.redenen || ["al gepland"]).concat(d.redenen); if (v.gerecht_id) gebruikt.add(v.gerecht_id); if (v.doos_id) dozenGebruikt.add(v.doos_id); } }
    const open = () => dagen.filter(d => !d.vast && !d.vrij && !d.gerecht_id);
    const cat = g => String(g.categorie || "").toLowerCase();
    const buurCat = d => { const k = dagen.indexOf(d); return [dagen[k - 1], dagen[k + 1]].filter(x => x && x.gerecht_id).map(x => cat((o.gerechten.find(g => g.id === x.gerecht_id) || {}))).filter(Boolean); };
    const mag = (k, d) => !gebruikt.has(k.gerecht.id) && !(k.doos && dozenGebruikt.has(k.doos.id)) && !((o.uitsluiten || {})[d.datum] || []).includes(k.gerecht.id)
      && !(cat(k.gerecht) && buurCat(d).includes(cat(k.gerecht)));
    const geldig = (k, d) => k.dringendItems.filter(it => !geclaimd.has(it.id) && it.eet_voor >= d.datum);
    const eff = (k, d) => k.score - 3 * Math.min(k.dringend, 2) + 3 * Math.min(geldig(k, d).length, 2);
    const zet = (d, k) => { const g = geldig(k, d); d.gerecht_id = k.gerecht.id; d.doos_id = k.doos ? k.doos.id : null; d.score = eff(k, d);
      d.redenen = k.kop.concat(g.slice(0, 2).map(gebruiktTekst), k.staart, d.redenen);
      g.forEach(it => geclaimd.add(it.id)); gebruikt.add(k.gerecht.id); if (k.doos) dozenGebruikt.add(k.doos.id); };
    // 1. Wat dringend op moet: zo vroeg mogelijk, uiterlijk op de eet-voor-dag
    for (const k of lijst.filter(k => !k.recent && (k.dringend || (k.doos && k.doos.eet_voor))).sort((a, b) => (a.eerste || (a.doos && a.doos.eet_voor) || "9").localeCompare(b.eerste || (b.doos && b.doos.eet_voor) || "9") || b.score - a.score)) {
      const d = open().find(x => mag(k, x) && (geldig(k, x).length || (k.doos && (!k.doos.eet_voor || x.datum <= k.doos.eet_voor || k.doos.eet_voor < dagen[0].datum))));
      if (d) zet(d, k);
    }
    // 2. De rest op score, met afwisseling
    for (const d of open()) {
      const best = (f) => lijst.filter(f).sort((a, b) => eff(b, d) - eff(a, d))[0];
      const k = best(x => mag(x, d)) || best(x => !gebruikt.has(x.gerecht.id) && !((o.uitsluiten || {})[d.datum] || []).includes(x.gerecht.id));
      if (k) zet(d, k);
    }
    // Porties: klaar-in-diepvries te weinig voor het aantal eters?
    for (const d of dagen) {
      d.porties = d.eters;
      const k = d.doos_id && lijst.find(x => x.doos && x.doos.id === d.doos_id);
      if (k && k.doos.eenheid === "portie" && k.doos.aantal < d.eters) d.redenen.push(`let op: ${fmt(k.doos.aantal)} porties voor ${d.eters} eters`);
    }
    return { start: o.start, einde: plus(o.start, o.inst.dagen - 1), dagen, kandidaten: lijst.length };
  }

  const api = { STANDAARD, planStart, automatischNu, planDagen, beoordeel, maakVoorstel, weekdag, plus, maakVoorraadIndex, zoekInHuis };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.KringVoorstel = api;
})(typeof window !== "undefined" ? window : globalThis);

<script>/* Kring – bestellijst: boodschappen over de planweek (standaard vrijdag t/m donderdag) min wat in huis is.
   Zuivere functies; werkt in de browser (window.KringBestel) en in Node (module.exports).
   Wat telt als "in huis": voorraad (koelkasten, rekken) en losse producten in de diepvries, met hetzelfde
   gekoppelde product, en niet vervallen vóór de eerste dag dat het ingrediënt nodig is. Een ingrediënt zonder
   product wordt enkel op naam vergeleken en blijft op de lijst ("misschien in huis"): de hoeveelheid is dan niet te kennen. */
(function (root) {
  "use strict";
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dag = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const plus = (s, n) => { const d = dag(s); d.setDate(d.getDate() + n); return iso(d); };
  const weekdag = s => (dag(s).getDay() + 6) % 7 + 1;                  // 1 = ma … 7 = zo

  /** Start van de planweek waarin `vandaag` valt. */
  function huidigeStart(vandaag, startdag) { let d = vandaag; while (weekdag(d) !== startdag) d = plus(d, -1); return d; }

  /** Welke planweek tonen we standaard? Vanaf de overlegdag tot de dag vóór de start: de volgende (die je bestelt),
      anders de lopende. Bv. overleg wo, start vr: wo en do → volgende vrijdag; vr t/m di → de lopende week. */
  function standaardStart(vandaag, inst) {
    const h = huidigeStart(vandaag, inst.startdag);
    const totStart = (inst.startdag - inst.dag + 7) % 7 || 7;
    const inVenster = ((weekdag(vandaag) - inst.dag + 7) % 7) < totStart && weekdag(vandaag) !== inst.startdag;
    return inVenster ? plus(h, 7) : h;
  }
  /** Bestellen ten laatste de dag vóór de start (donderdag voor vrijdag afhalen). */
  const besteldag = start => plus(start, -1);

  /** Voorraadpool per product: open items uit voorraad en losse producten uit de diepvries. */
  function pool(voorraad, diepvries) {
    const m = new Map();
    const voeg = (it, bron) => {
      if (it.product_id == null || !(Number(it.aantal) > 0)) return;
      const k = String(it.product_id);
      if (!m.has(k)) m.set(k, []);
      m.get(k).push({ id: it.id, naam: it.naam, rest: Number(it.aantal), eenheid: it.eenheid || "stuk", eet_voor: it.eet_voor || null, bron, plaats: it.plaats || "" });
    };
    voorraad.filter(i => !i.op_op).forEach(i => voeg(i, "voorraad"));
    diepvries.filter(i => i.soort !== "gerecht").forEach(i => voeg(i, "diepvries"));
    for (const l of m.values()) l.sort((a, b) => (a.eet_voor || "9").localeCompare(b.eet_voor || "9"));
    return m;
  }

  /* Hoeveelheid van een voorraaditem uitgedrukt in de maat van de vraag */
  function inMaat(it, p, maat) {
    const gram = it.eenheid === "kg" ? it.rest * 1000 : it.eenheid === "g" ? it.rest : null;
    if (maat === "g") {
      if (gram != null) return gram;
      if (p.inhoud_eenheid === "g" && p.inhoud) return it.rest * p.inhoud;
      return 0;
    }
    if (gram != null) return p.inhoud_eenheid === "g" && p.inhoud ? gram / p.inhoud : 1;   // gewogen: zonder verpakkingsinhoud telt het als 1
    return it.rest;                                                                          // stuk, zak, portie …
  }
  function neem(lijst, p, maat, nodig) {
    let genomen = 0; const van = [];
    for (const it of lijst) {
      if (genomen >= nodig - 1e-9) break;
      const h = inMaat(it, p, maat); if (!(h > 0)) continue;
      const n = Math.min(h, nodig - genomen);
      genomen += n; it.rest -= it.rest * (n / h);
      van.push({ naam: it.naam, bron: it.bron, plaats: it.plaats, eet_voor: it.eet_voor });
    }
    return { genomen, van };
  }

  /**
   * Vergelijk de boodschappenlijst met wat in huis is. Vult per item aan:
   *   inHuis {aantal, maat, van[]} · bestel (verpakkingen of gram) · bestelKost · gedekt · misschien {naam, bron} · toch
   * o = { voorraad, diepvries, koppeling, K, VS, start, checks (Set) }
   */
  function vergelijk(items, o) {
    const pl = pool(o.voorraad || [], o.diepvries || []);
    const idx = o.VS && o.VS.maakVoorraadIndex ? o.VS.maakVoorraadIndex((o.voorraad || []).filter(i => !i.op_op), o.diepvries || [], o.K, o.start) : null;
    const checks = o.checks || new Set();
    const volgorde = items.filter(i => !i.voorraad && !i.extra && !i.af)
      .sort((a, b) => (a.eerst || "9").localeCompare(b.eerst || "9") || a.naam.localeCompare(b.naam, "nl"));
    for (const e of volgorde) {
      e.toch = checks.has("bestel:" + e.key);
      if (e.toch) continue;
      const p = e.product;
      if (p) {
        const lijst = (pl.get(String(p.id)) || []).filter(it => !it.eet_voor || it.eet_voor >= (e.eerst || o.start));
        if (!lijst.length) continue;
        if (p.prijs_per === "kg") {
          if (e.eenheid !== "g" || e.q == null) {                       // hoeveelheid onbekend: aanwezig = gedekt
            const r = neem(lijst, p, "stuk", 1);
            if (r.genomen > 0) { e.inHuis = { aantal: null, maat: "kg", van: r.van }; e.bestel = 0; e.bestelKost = 0; e.gedekt = true; }
            continue;
          }
          const r = neem(lijst, p, "g", e.q);
          if (!(r.genomen > 0)) continue;
          const tekort = Math.max(0, e.q - r.genomen);
          e.inHuis = { aantal: r.genomen, maat: "g", van: r.van };
          e.bestel = tekort; e.bestelKost = p.prijs != null ? (tekort / 1000) * p.prijs : null;
          e.gedekt = tekort < 1;
        } else {
          const nodig = (e.pak && e.pak.aantal) || 1;
          const r = neem(lijst, p, "stuk", nodig);
          if (!(r.genomen > 0)) continue;
          const tekort = Math.max(0, Math.ceil(nodig - r.genomen - 1e-9));
          e.inHuis = { aantal: r.genomen, maat: "stuk", van: r.van };
          e.bestel = tekort; e.bestelKost = e.pak && e.pak.kost != null ? e.pak.kost * (tekort / nodig) : null;
          e.gedekt = tekort === 0;
        }
      } else if (idx && !(e.koppeling && e.koppeling.product_id == null)) {
        const m = o.VS.zoekInHuis(e.naam, idx, o.koppeling || {}, o.K);
        if (m && (!m.item.eet_voor || m.item.eet_voor >= (e.eerst || o.start))) e.misschien = { naam: m.item.naam, bron: m.item.bron };
      }
    }
    return items;
  }

  /** Wat nog besteld moet worden (niet afgevinkt, niet volledig in huis, geen basisvoorraad). */
  const teBestellen = items => items.filter(i => !i.voorraad && !i.af && !i.gedekt);
  /** Geraamde kost van wat besteld moet worden. */
  const kost = items => teBestellen(items).reduce((s, i) => s + ((i.bestelKost != null ? i.bestelKost : i.pak && i.pak.kost) || 0), 0);

  const api = { huidigeStart, standaardStart, besteldag, vergelijk, teBestellen, kost, weekdag, plus };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.KringBestel = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* Kring – weekvoorstel in de app: instellingen (beheerder), automatisch klaarzetten op de overlegdag,
   paneel met per dag het voorgestelde warme gerecht, ander voorstel, vastzetten, overnemen in het weekmenu.
   Gebruikt KringVoorstel, KringAgenda (AG) en de globale toestand S. */
"use strict";
const VS = window.KringVoorstel;
const VS_DAGEN = ["", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag", "zondag"];
const VS_KORT = ["", "ma", "di", "wo", "do", "vr", "za", "zo"];

/* ---------- Opslag ---------- */
window.VS_LOCAL = {
  async loadVoorstelInst(){ return { ...VS.STANDAARD, ...((this.d.instellingen || {}).weekvoorstel || {}) }; },
  async bewaarVoorstelInst(w){ this.d.instellingen = { ...(this.d.instellingen || {}), weekvoorstel: w }; this.save(); },
  async loadVoorstel(start){ return JSON.parse(JSON.stringify((this.d.voorstellen || {})[start] || null)); },
  async bewaarVoorstel(v){ this.d.voorstellen = { ...(this.d.voorstellen || {}), [v.start]: v }; this.save(); },
  async loadMenuBereik(van, tot){ return this.d.menu.filter(m => m.datum >= van && m.datum <= tot).map(x => ({ ...x })); }
};
window.VS_SUPA = {
  async loadVoorstelInst(){ const { data } = await this.g.from("instellingen").select("weekvoorstel").eq("huishouden_id", this.h).maybeSingle(); return { ...VS.STANDAARD, ...((data && data.weekvoorstel) || {}) }; },
  async bewaarVoorstelInst(w){ this.ok(await this.g.rpc("bewaar_weekvoorstel_instellingen", { p_huishouden: this.h, p: w })); },
  async loadVoorstel(start){ const { data } = await this.g.from("weekvoorstellen").select("*").eq("huishouden_id", this.h).eq("start", start).maybeSingle();
    if (data && !data.einde) data.einde = (data.dagen || []).length ? data.dagen[data.dagen.length - 1].datum : plus(data.start, 6);   // einde staat niet in de tabel
    return data || null; },
  async bewaarVoorstel(v){ this.ok(await this.g.from("weekvoorstellen").upsert({ huishouden_id: this.h, start: v.start, dagen: v.dagen, uitsluiten: v.uitsluiten || {}, status: v.status, gemaakt: v.gemaakt }, { onConflict: "huishouden_id,start" })); },
  async loadMenuBereik(van, tot){ return this.ok(await this.g.from("weekmenu").select("*").eq("huishouden_id", this.h).gte("datum", van).lte("datum", tot)); }
};
async function herlaadVoorstel(){
  try {
    S.vsInst = await db.loadVoorstelInst();
    S.vsStart = VS.planStart(iso(new Date()), S.vsInst.startdag);
    S.vs = await db.loadVoorstel(S.vsStart);
  } catch(e){ console.error(e); S.vsInst = { ...VS.STANDAARD }; S.vs = null; }
}
const vsBeheerder = () => (ik().rol || "beheerder") === "beheerder";

/* ---------- Voorstel berekenen ---------- */
async function vsBereken(behoud){
  const inst = S.vsInst, start = S.vsStart, einde = VS.plus(start, inst.dagen - 1);
  const afspraken = AG.rolUit(S.afspraken.filter(a => a.maaltijd), start, einde);
  const dagen = VS.planDagen(start, inst, S.leden, afspraken);
  const historiek = await db.loadMenuBereik(VS.plus(start, -7 * inst.nietHerhalenWeken - 7), VS.plus(start, -1));
  const gepland = await db.loadMenuBereik(start, einde);
  const vast = {};
  for (const d of dagen) {
    const m = gepland.find(x => x.datum === d.datum && x.moment === d.moment);
    if (m && (m.gerecht_id || m.vrije_tekst)) vast[d.datum] = { gerecht_id: m.gerecht_id, vrije_tekst: m.vrije_tekst, redenen: ["al gepland in het weekmenu"] };
    const b = behoud && behoud.dagen.find(x => x.datum === d.datum && x.vastgezet && !x.vast);
    if (!vast[d.datum] && b) vast[d.datum] = { gerecht_id: b.gerecht_id, doos_id: b.doos_id, redenen: ["vastgezet"] };
    const hv = behoud && behoud.dagen.find(x => x.datum === d.datum && x.handVrij);
    if (!vast[d.datum] && hv) { d.vrij = hv.handVrij; d.handVrij = hv.handVrij; }   // zelf vrijgehouden (Restjes, Uit eten …)
  }
  const dozen = S.dv.items.map(i => ({ ...i, doos: (dvDoos(i.doos_id) || {}).label || "" }));
  const r = VS.maakVoorstel({ gerechten: S.gerechten, koppeling: S.koppeling, voorraad: S.vr.items.filter(i => !i.op_op), diepvries: dozen,
    historiek, dagen, vast, uitsluiten: (behoud && behoud.uitsluiten) || {}, inst, start, K });
  r.dagen.forEach(d => { if (vast[d.datum] && vast[d.datum].redenen[0] === "vastgezet") d.vastgezet = true;
    const hv = !vast[d.datum] && behoud && behoud.dagen.find(x => x.datum === d.datum && x.handVrij);
    if (hv) { d.vrij = hv.handVrij; d.handVrij = hv.handVrij; d.gerecht_id = null; } });
  return { ...r, uitsluiten: (behoud && behoud.uitsluiten) || {}, status: "voorstel", gemaakt: new Date().toISOString() };
}
async function vsMaak(behoud){ const v = await vsBereken(behoud); await db.bewaarVoorstel(v); S.vs = v; return v; }
/* Automatisch klaarzetten op de overlegdag (en de dag erna), één keer per planweek */
let vsAutoBezig = false;
async function vsAuto(){
  if (vsAutoBezig || !S.vsInst || S.vs || !VS.automatischNu(iso(new Date()), S.vsInst)) return;
  vsAutoBezig = true;
  try { await vsMaak(null); if (S.tab === "vandaag" && $("#sheet").hidden) render(); } catch(e){ console.error(e); }
  vsAutoBezig = false;
}

/* ---------- Vandaag-kaart ---------- */
const vsDagLabel = ds => { if (!ds) return "?"; const d = new Date(ds + "T12:00:00"); return `${VS_KORT[VS.weekdag(ds)]} ${d.getDate()} ${MND[d.getMonth()]}`; };
function vsVandaagKaart(kaart){
  if (!S.vs || S.vs.status !== "voorstel") return "";
  const d = S.vs.dagen;
  return kaart(`Weekvoorstel ${vsDagLabel(S.vs.start)} – ${vsDagLabel(S.vs.einde)}`,
    `<ul class="vlijst">${d.slice(0, 4).map(x => `<li><span class="muted">${VS_KORT[x.weekdag]}</span><span style="flex:1">${x.vrij ? `<i class="muted">${esc(x.vrij)}</i>` : esc(vsNaam(x))}</span></li>`).join("")}</ul>
     <button class="knop klein" data-voorstel style="margin-top:8px">Bekijken en overnemen</button>`,
    `<span class="muted" style="font-size:.85rem">voor de Eilandraad</span>`);
}
const vsNaam = x => x.gerecht_id ? ((gerecht(x.gerecht_id) || {}).naam || "?") : (x.vrije_tekst || "—");

/* ---------- Paneel ---------- */
async function openVoorstel(){
  if (!S.vs) { toast("Voorstel maken…"); await vsMaak(null); }
  const v = S.vs, inst = S.vsInst;
  const kan = vsBeheerder();
  openPaneel(`
    <div class="paneel-kop"><h2>Weekvoorstel ${vsDagLabel(v.start)} – ${vsDagLabel(v.einde)}</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    <p class="muted" style="margin-top:-6px">Warme gerechten op basis van wat in huis is en wat eerst op moet. Weekdagen: avondmaal; weekend: ${inst.weekendMoment === "middag" ? "middag" : "avond"}. Vastzetten (●) houdt een dag bij "Opnieuw"; vrijhouden (⊘) voor restjes, uit eten …${v.status === "overgenomen" ? " <b>Al overgenomen in het weekmenu.</b>" : ""}</p>
    <div class="vs-dagen">${v.dagen.map(d => `<div class="vs-dag ${d.vrij ? "vrij" : ""}" data-vsdag="${d.datum}">
      <div class="vs-wanneer"><b>${VS_KORT[d.weekdag]}</b><span>${new Date(d.datum + "T12:00:00").getDate()} ${MND[new Date(d.datum + "T12:00:00").getMonth()]}</span></div>
      <div class="vs-wat">${d.handVrij ? `<b><i>${esc(d.handVrij)}</i></b><small>vrijgehouden · geen boodschappen</small>`
        : d.vrij ? `<b class="muted">Geen warme maaltijd thuis</b><small>${esc(d.vrij)}</small>`
        : `<b>${esc(vsNaam(d))}</b><small>${d.eters} ${d.eters === 1 ? "eter" : "eters"}${d.redenen.length ? " · " + d.redenen.map(esc).join(" · ") : ""}</small>`}</div>
      <div class="vs-knoppen">${d.handVrij ? `<button class="ib" data-vsterug aria-label="Toch een gerecht" title="Toch een gerecht">↺</button>`
        : d.vrij || d.vast ? (d.vast ? `<span class="tag">gepland</span>` : "") : `
        <button class="ib ${d.vastgezet ? "aan" : ""}" data-vsvast aria-pressed="${!!d.vastgezet}" aria-label="Vastzetten" title="Vastzetten">●</button>
        <button class="ib" data-vsander aria-label="Ander voorstel" title="Ander voorstel">↻</button>
        <button class="ib ${S.vsVrijOpen === d.datum ? "aan" : ""}" data-vsvrij aria-label="Vrijhouden" title="Vrijhouden">⊘</button>`}</div>
      ${S.vsVrijOpen === d.datum ? `<div class="chips vs-snel">${SNELKEUZES.map(x => `<button class="chip" data-vssnel="${esc(x)}">${esc(x)}</button>`).join("")}</div>` : ""}</div>`).join("")}</div>
    <p class="muted" style="font-size:.85rem">${v.kandidaten} gerechten bekeken. Uitzonderingen komen uit de agenda (afspraak → Avondmaal).</p>
    <div class="voet"><button class="knop sec links" data-vsopnieuw>Opnieuw</button><button class="knop sec" data-sluit>Sluiten</button>
      <button class="knop" data-vsover>${v.status === "overgenomen" ? "Opnieuw overnemen" : "Overnemen in weekmenu"}</button></div>`);
  const p = $("#paneel");
  p.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const rij = b.closest("[data-vsdag]"), d = rij && S.vs.dagen.find(x => x.datum === rij.dataset.vsdag);
    if ("vsvast" in b.dataset){ d.vastgezet = !d.vastgezet; run(async () => { await db.bewaarVoorstel(S.vs); openVoorstel(); }); }
    if ("vsvrij" in b.dataset){ S.vsVrijOpen = S.vsVrijOpen === d.datum ? null : d.datum; openVoorstel(); }
    if (b.dataset.vssnel){ S.vsVrijOpen = null; d.vrij = d.handVrij = b.dataset.vssnel; d.gerecht_id = null; d.doos_id = null; d.vastgezet = false; d.redenen = [];
      run(async () => { await db.bewaarVoorstel(S.vs); openVoorstel(); }); }
    if ("vsterug" in b.dataset) run(async () => {
      delete d.handVrij; d.vrij = null;
      const oud = JSON.parse(JSON.stringify(S.vs));
      oud.dagen.forEach(x => { if (x.datum !== d.datum && !x.vrij && !x.vast) x.vastgezet = true; });
      const nieuw = await vsBereken(oud);
      nieuw.dagen.forEach(x => { const o = S.vs.dagen.find(y => y.datum === x.datum); x.vastgezet = !!(o && o.vastgezet); if (o && x.datum !== d.datum && !x.vrij && !x.vast) x.redenen = o.redenen; });
      S.vs = { ...nieuw, uitsluiten: S.vs.uitsluiten || {} }; await db.bewaarVoorstel(S.vs); openVoorstel();
    });
    if ("vsander" in b.dataset) run(async () => {
      const u = S.vs.uitsluiten || (S.vs.uitsluiten = {});
      (u[d.datum] = u[d.datum] || []).push(d.gerecht_id);
      const oud = JSON.parse(JSON.stringify(S.vs));
      oud.dagen.forEach(x => { if (x.datum !== d.datum && !x.vrij && !x.vast) x.vastgezet = true; });   // enkel deze dag wijzigt
      const nieuw = await vsBereken(oud);
      nieuw.dagen.forEach(x => { const o = S.vs.dagen.find(y => y.datum === x.datum); x.vastgezet = !!(o && o.vastgezet); if (o && x.datum !== d.datum && !x.vrij && !x.vast) x.redenen = o.redenen; });
      S.vs = { ...nieuw, uitsluiten: u }; await db.bewaarVoorstel(S.vs); openVoorstel();
    });
    if ("vsopnieuw" in b.dataset) run(async () => { await vsMaak({ ...S.vs, uitsluiten: {} }); openVoorstel(); toast("Nieuw voorstel"); });
    if ("vsover" in b.dataset) run(async () => {
      let n = 0;
      for (const x of S.vs.dagen) {
        if (x.handVrij && !x.vast) await db.setSlot(x.datum, x.moment, { vrije_tekst: x.handVrij, porties: null });
        else if (!x.vrij && !x.vast && x.gerecht_id) { await db.setSlot(x.datum, x.moment, { gerecht_id: x.gerecht_id, porties: x.porties || null }); n++; }
      }
      S.vs.status = "overgenomen"; await db.bewaarVoorstel(S.vs); S.pweek = datumVan(S.vs.start);
      await db.log(`nam het weekvoorstel ${vsDagLabel(S.vs.start)} – ${vsDagLabel(S.vs.einde)} over (${n} gerechten)`);
      await Promise.all([herlaadWeek(), herlaadGezin()]); sluitPaneel(); render(); toast(`${n} gerechten in het weekmenu gezet`);
    });
  };
  if (!kan) p.querySelectorAll("[data-vsover]").forEach(x => x.title = "");
}

/* ---------- Instellingen (beheerder) ---------- */
function vsInstHtml(){

      <div class="rij"><div class="veld"><label for="vs-herhaal">Niet herhalen binnen</label><select class="in" id="vs-herhaal">${[1, 2, 3, 4, 6, 8].map(n => `<option value="${n}" ${n === i.nietHerhalenWeken ? "selected" : ""}>${n} ${n === 1 ? "week" : "weken"}</option>`).join("")}</select></div>

      ${kan ? `<div><button class="knop sec klein" data-vsinstbewaar>Weekvoorstel bewaren</button></div>` : ""}

}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if ("voorstel" in b.dataset) { run(() => openVoorstel()); return; }
  if (!("vsinstbewaar" in b.dataset)) return;
  const dagv = +$("#vs-dag").value, startv = +$("#vs-start").value, eters = +$("#vs-eters").value;
  const fout = m => { const f = $("#vs-fout"); f.textContent = m; f.hidden = false; };
  if (dagv === startv) return fout("De dag van de Eilandraad moet vóór de eerste plandag liggen.");

});

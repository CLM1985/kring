    Object.assign(m, {gerecht_id: v.gerecht_id || null, vrije_tekst: v.vrije_tekst || null, porties: v.porties || null}); this.save();
  }
  async clearSlot(datum, moment){ this.d.menu = this.d.menu.filter(x => !(x.datum === datum && x.moment === moment)); this.save(); }
  async addExtra(week, it){ this.d.extra.push({id: uid(), week_start: week, afgevinkt: false, ...it}); this.save(); }
  async toggleExtra(id, val){ const e = this.d.extra.find(x => x.id === id); if (e) e.afgevinkt = val; this.save(); }
  async deleteExtra(id){ this.d.extra = this.d.extra.filter(x => x.id !== id); this.save(); }
  async setCheck(week, key, val){ const s = new Set(this.d.checks[week] || []); val ? s.add(key) : s.delete(key); this.d.checks[week] = [...s]; this.save(); }
  async loadProducten(){ return {producten: this.d.producten, koppeling: {...this.d.koppeling}}; }
  async setKoppeling(sleutel, product_id){ this.d.koppeling[sleutel] = {product_id, bevestigd: true}; this.save(); }
  async nieuwProduct(p){ const id = "eigen-" + Date.now(); this.d.producten.push({ id, beschikbaar: true, inhoud: null, inhoud_eenheid: null, ...p }); this.save(); return id; }
  async receptVanWebsite(){ throw new Error("In de testversie kan de app geen andere websites lezen. Plak de ingrediënten hieronder."); }
  async reset(){ this.d = demoData(await laadSeed()); bwMigratie(this.d); Object.assign(this.d, demoAgenda()); Object.assign(this.d, demoGezin(this.d.leden)); this.d.diepvries = demoDiepvries(this.d); this.d.voorraad = demoVoorraad(); vrDemoItems(this.d.voorraad, this.d); await r5DemoMig(this.d); this.d.r5Mig1 = true; this.save(); }
}

/* ================= Opslag: Supabase ================= */
class SupaStore {
  constructor(cfg){ this.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey); this.g = this.sb.schema("gezin"); this.h = null; this.demo = false; this.label = ""; }
  ok({data, error}){ if (error) throw new Error(error.message); return data; }
  async init(){
    const {data: {session}} = await this.sb.auth.getSession();
    this.session = session;
    this.sb.auth.onAuthStateChange(ev => {
      if ((ev === "SIGNED_IN" && !this.session) || ev === "SIGNED_OUT") location.replace(location.pathname);
    });
    if (!session){ toonLogin(this); return false; }
    const hs = this.ok(await this.g.from("huishoudens").select("id,naam,uitnodigcode").limit(1));
    if (!hs.length){ toonStart(this); return false; }
    this.huis = hs[0]; this.h = hs[0].id; this.label = hs[0].naam;
    this.live();
    return true;
  }
  live(){   // partner ziet afvinken en planning meteen
    this.sb.channel("kring-" + this.h)
      .on("postgres_changes", {event: "*", schema: "gezin", table: "weekmenu", filter: `huishouden_id=eq.${this.h}`}, () => herlaadWeek().then(render))
      .on("postgres_changes", {event: "*", schema: "gezin", table: "boodschappen_afgevinkt", filter: `huishouden_id=eq.${this.h}`}, () => herlaadWeek().then(render))
      .on("postgres_changes", {event: "*", schema: "gezin", table: "boodschappen_extra", filter: `huishouden_id=eq.${this.h}`}, () => herlaadWeek().then(render))
      .on("postgres_changes", {event: "*", schema: "gezin", table: "afval_status", filter: `huishouden_id=eq.${this.h}`}, () => herlaadAfval().then(() => { if ($("#sheet").hidden) render(); }))
      .on("postgres_changes", {event: "*", schema: "gezin", table: "afval_verantwoordelijke", filter: `huishouden_id=eq.${this.h}`}, () => herlaadAfval().then(() => { if ($("#sheet").hidden) render(); }))
      .on("postgres_changes", {event: "*", schema: "gezin", table: "diepvries_items", filter: `huishouden_id=eq.${this.h}`}, () => herlaadDiepvries().then(() => { if ($("#sheet").hidden) render(); }))
      .subscribe();
  }
  async loadGerechten(){
    const rows = this.ok(await this.g.from("gerechten").select("*, ingredienten(*)").eq("huishouden_id", this.h).order("naam"));
    rows.forEach(r => r.ingredienten.sort((a, b) => a.volgorde - b.volgorde));
    return rows;
  }
  async saveGerecht(g){ return this.ok(await this.g.rpc("bewaar_gerecht", {p: {...g, huishouden_id: this.h}})); }
  async deleteGerecht(id){ this.ok(await this.g.from("gerechten").delete().eq("id", id)); }
  async loadWeek(van, tot, lijst){   // lijst = start van de planweek (extra's en vinkjes)
    const [m, e, c] = await Promise.all([
      this.g.from("weekmenu").select("*").eq("huishouden_id", this.h).gte("datum", van).lte("datum", tot),
      this.g.from("boodschappen_extra").select("*").eq("huishouden_id", this.h).eq("week_start", lijst).order("aangemaakt"),
      this.g.from("boodschappen_afgevinkt").select("sleutel").eq("huishouden_id", this.h).eq("week_start", lijst)]);
    return {menu: this.ok(m), extra: this.ok(e), checks: new Set(this.ok(c).map(x => x.sleutel))};
  }
  async setSlot(datum, moment, v){
    this.ok(await this.g.from("weekmenu").upsert({huishouden_id: this.h, datum, moment, gerecht_id: v.gerecht_id || null, vrije_tekst: v.vrije_tekst || null, porties: v.porties || null}, {onConflict: "huishouden_id,datum,moment"}));
  }
  async clearSlot(datum, moment){ this.ok(await this.g.from("weekmenu").delete().eq("huishouden_id", this.h).eq("datum", datum).eq("moment", moment)); }
  async addExtra(week, it){ this.ok(await this.g.from("boodschappen_extra").insert({huishouden_id: this.h, week_start: week, ...it})); }
  async toggleExtra(id, val){ this.ok(await this.g.from("boodschappen_extra").update({afgevinkt: val}).eq("id", id)); }
  async deleteExtra(id){ this.ok(await this.g.from("boodschappen_extra").delete().eq("id", id)); }
  async setCheck(week, key, val){
    const t = this.g.from("boodschappen_afgevinkt");
    if (val) this.ok(await t.upsert({huishouden_id: this.h, week_start: week, sleutel: key}, {onConflict: "huishouden_id,week_start,sleutel"}));
    else this.ok(await t.delete().eq("huishouden_id", this.h).eq("week_start", week).eq("sleutel", key));
  }
  async loadProducten(){
    const [p, k] = await Promise.all([this.g.from("producten").select("*").eq("huishouden_id", this.h), this.g.from("ingredient_product").select("*").eq("huishouden_id", this.h)]);
    const producten = this.ok(p).map(x => ({...x, id: x.id, kern: K.productKern(x.naam)}));
    const koppeling = {}; this.ok(k).forEach(x => koppeling[x.sleutel] = {product_id: x.product_id, bevestigd: true});
    return {producten, koppeling};
  }
  async nieuwProduct(p){
    return this.ok(await this.g.from("producten").insert({ huishouden_id: this.h, naam: p.naam, afdeling: p.afdeling, prijs: p.prijs, prijs_per: p.prijs_per }).select("id").single()).id;
  }
  async setKoppeling(sleutel, product_id){
    this.ok(await this.g.from("ingredient_product").upsert({huishouden_id: this.h, sleutel, product_id, geen_product: !product_id}, {onConflict: "huishouden_id,sleutel"}));

/* ================= Boodschappenlijst berekenen ================= */
function lijstItems(){
  const map = new Map(), van = iso(S.pweek), tot = iso(plus(S.pweek, 6));
  for (const m of S.menu){
    if (m.datum < van || m.datum > tot) continue;
    const g = gerecht(m.gerecht_id); if (!g) continue;
    const f = (m.porties || g.porties || 1) / (g.porties || 1);
    for (const i of g.ingredienten || []){
      if (!norm(i.naam)) continue;
      const [q, u] = K.basis(num(i.hoeveelheid), i.eenheid || "");
      const sl = K.sleutel(i.naam), key = sl + "|" + u;
      let e = map.get(key);
      if (!e){ e = {key, sleutel: sl, naam: i.naam.trim(), eenheid: u, q: null, afdeling: i.afdeling || K.afdelingVoor(i.naam), voor: new Set(), extra: false, voorraad: K.isVoorraad(i.naam), eerst: m.datum}; map.set(key, e); }
      if (m.datum < e.eerst) e.eerst = m.datum;
      if (q != null) e.q = (e.q || 0) + q * f;
      e.voor.add(g.naam);
    }
  }
  const out = [...map.values()].map(e => ({...e, af: S.checks.has(e.key)}));
  for (const x of S.extra) out.push({key: "x:" + x.id, id: x.id, sleutel: K.sleutel(x.naam), naam: x.naam, eenheid: x.eenheid || "", q: num(x.hoeveelheid), afdeling: x.afdeling || "Andere", voor: new Set(), extra: true, af: !!x.afgevinkt, voorraad: false});
  for (const e of out){
    const k = S.koppeling[e.sleutel];
    e.koppeling = k || null;
    e.product = k ? product(k.product_id) : null;
    if (e.product){ e.afdeling = e.product.afdeling || e.afdeling; e.pak = K.verpakkingen(e.q, e.eenheid, e.product); }
  }
  const voorraad = S.vr ? S.vr.items.map(i => ({ ...i, plaats: (vrRuimte(i.ruimte_id) || {}).naam || "" })) : [];
  const diepvries = S.dv ? S.dv.items.map(i => ({ ...i, plaats: "Diepvries" })) : [];
  return BL.vergelijk(out, { voorraad, diepvries, koppeling: S.koppeling, K, VS, start: van, checks: S.checks });
}

function slotHtml(ds, mo, lbl){
  const m = slot(ds, mo), g = m && gerecht(m.gerecht_id), l = lbl ? `<span class="moment">${lbl}</span>` : "";
  const attr = `data-slot="${ds}|${mo}"`;
  const weg = naam => `<button class="slot-x" data-slotweg="${ds}|${mo}" aria-label="${esc(naam)} verwijderen" title="Verwijderen">✕</button>`;
  if (g) return `<div class="slotwrap"><button class="slot vol" ${attr} draggable="true" title="Recept bekijken">${l}<span class="titel">${esc(g.naam)}</span><span class="meta">${m.porties || g.porties} pers.${zonderIngr(g) ? " · geen ingrediënten" : ""}</span></button>${weg(g.naam)}</div>`;
  if (m && m.vrije_tekst) return `<div class="slotwrap"><button class="slot vrij" ${attr} draggable="true">${l}<span class="titel">${esc(m.vrije_tekst)}</span><span class="meta">geen boodschappen</span></button>${weg(m.vrije_tekst)}</div>`;
  return `<button class="slot leeg" ${attr}>${l}<span>+ Gerecht kiezen</span></button>`;
}

function viewGerechten(){
  const nZonder = S.gerechten.filter(zonderIngr).length;
  $("#view").innerHTML = demoBanner() + `
    <div class="zoekbalk"><input class="in" id="zoek" type="search" placeholder="Zoek een gerecht of ingrediënt" value="${esc(S.zoek)}" aria-label="Zoek">
      <button class="knop" data-nieuw>+ Nieuw</button></div>
    <div class="chips">${["", ...CAT].map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${S.cat === c && !S.onvolledig}">${c || "Alle"}</button>`).join("")}
      ${nZonder ? `<button class="chip let" data-onvolledig aria-pressed="${S.onvolledig}">Zonder ingrediënten (${nZonder})</button>` : ""}</div>
    <div class="telling" id="telling"></div>
    <div id="glijst"></div>`;
  lijstGerechten();
}
function lijstGerechten(){
  const z = norm(S.zoek);
  const inWeek = new Set(S.menu.map(m => m.gerecht_id));
  const rows = S.gerechten.filter(g => (S.onvolledig ? zonderIngr(g) : (!S.cat || g.categorie === S.cat)) &&
    (!z || norm(g.naam).includes(z) || (g.ingredienten || []).some(i => norm(i.naam).includes(z))))
    .sort((a, b) => a.naam.localeCompare(b.naam, "nl"));
  $("#telling").textContent = `${rows.length} gerechten`;
  $("#glijst").innerHTML = rows.length ? `<div class="kaarten">${rows.map(g => `
    <button class="kaart" data-open="${g.id}">
      <span class="titel">${esc(g.naam)}</span>
      <span class="meta">${g.porties} pers.${g.bereidingstijd_min ? " · " + g.bereidingstijd_min + " min" : ""}${g.categorie ? " · " + esc(g.categorie) : ""}</span>
      <span class="onder">${zonderIngr(g) ? `<span class="tag let">Geen ingrediënten</span>` : `<span class="tag">${g.ingredienten.length} ingrediënten</span>`}
        ${inWeek.has(g.id) ? `<span class="gepland">Deze week gepland</span>` : ""}</span>
    </button>`).join("")}</div>`
    : `<div class="leegstaat">${S.gerechten.length ? "Geen gerechten gevonden." : "Nog geen gerechten. Voeg jullie eerste gerecht toe met <b>+ Nieuw</b>."}</div>`;
}

  const gekoppeld = open.filter(i => i.product);

  const nOngekoppeld = open.filter(i => !i.koppeling).length + open.filter(i => i.koppeling && !i.koppeling.bevestigd).length;
  const zichtbaar = l => l.filter(i => !(S.verberg && i.af));
  const groepen = [...AFD, ...new Set(kopen.map(i => i.afdeling).filter(a => !AFD.includes(a)))]
    .map(a => [a, zichtbaar(kopen.filter(i => i.afdeling === a)).sort((x, y) => x.naam.localeCompare(y.naam, "nl"))]).filter(([, l]) => l.length);
  $("#view").innerHTML = demoBanner() + `
    <div class="samenvatting">

      <div class="muted">Bestellen ${vsDagLabel(BL.besteldag(start))} · afhalen ${vsDagLabel(start)} · geraamd <span class="kost">${eur(kost)}</span> · ${gekoppeld.length}/${open.length} met product</div>
    </div>
    <div class="acties">
      ${nOngekoppeld ? `<button class="knop" data-koppelalles>Producten koppelen (${nOngekoppeld})</button>` : ""}
      <button class="knop sec" data-kopieer>Kopieer lijst</button>
      <label class="toggle"><input type="checkbox" id="verberg" ${S.verberg ? "checked" : ""}> Afgevinkte verbergen</label>
    </div>
    ${groepen.length ? groepen.map(([a, l]) => `<div class="groep"><h3><span>${esc(a)}</span></h3>${l.map(itemHtml).join("")}</div>`).join("")
      : `<div class="leegstaat">${kopen.length ? "Alles afgevinkt." : inHuis.length ? "Alles wat het weekmenu nodig heeft, is in huis." : "Nog niets op de lijst. Plan gerechten in het weekmenu of voeg hieronder iets toe."}</div>`}
    ${inHuis.length ? `<details class="groep inhuis" ${S.inhuisOpen ? "open" : ""}><summary><h3><span>Al in huis (${inHuis.length})</span></h3></summary><p class="muted klein-uitleg">Volgens de voorraad en de diepvries, niet vervallen vóór de dag dat het nodig is. Klopt het niet? Tik op <b>Toch bestellen</b>.</p>${inHuis.sort((x, y) => x.naam.localeCompare(y.naam, "nl")).map(itemHtml).join("")}</details>` : ""}
    ${voorraad.length ? `<details class="groep voorraad"><summary><h3><span>Voorraadkast nakijken (${voorraad.length})</span></h3></summary>${zichtbaar(voorraad).sort((x, y) => x.naam.localeCompare(y.naam, "nl")).map(itemHtml).join("")}</details>` : ""}
    <div class="groep"><h3><span>Iets extra toevoegen</span></h3>
      <form class="extra-form" id="extra-form">
        <div class="met-mic"><input class="in" id="x-naam" placeholder="bv. wc-papier, 6 flessen water" aria-label="Wat" required autocomplete="off">${micKnop("x-naam")}</div>
        <select class="in" id="x-afd" aria-label="Afdeling">${AFD.map(a => `<option ${a === "Andere" ? "selected" : ""}>${a}</option>`).join("")}</select>

/* Wat er in huis is voor een lijn van de lijst */
function inHuisTag(i){
  if (i.toch) return `<span class="tag">toch bestellen</span>`;
  if (i.misschien) return `<span class="tag" title="Enkel op naam herkend; hoeveelheid onbekend">misschien in huis: ${esc(i.misschien.naam)}</span>`;
  if (!i.inHuis) return "";
  const waar = [...new Set(i.inHuis.van.map(v => v.plaats).filter(Boolean))].join(", ");
  const eet = i.inHuis.van.map(v => v.eet_voor).filter(Boolean).sort()[0];
  const hoeveel = i.inHuis.aantal == null ? "" : i.inHuis.maat === "g" ? fmtQty(i.inHuis.aantal, "g") + " " : fmtNum(i.inHuis.aantal, 2) + " ";
  return `<span class="tag let">${hoeveel}in huis${waar ? " · " + esc(waar) : ""}${eet ? " · eet voor " + esc(vsDagLabel(eet)) : ""}</span>`;
}
function itemHtml(i){
  const voor = i.voor.size ? `<span class="voor">voor ${esc([...i.voor].join(", "))}</span>` : "";
  let prod = "", knop = "";
  if (i.product){
    const deel = i.inHuis && !i.gedekt && i.bestel != null;
    const n = deel ? (i.inHuis.maat === "g" ? fmtQty(i.bestel, "g") + " " : i.bestel + "× ") : i.pak && i.pak.aantal ? i.pak.aantal + "× " : "";
    const k = deel && i.bestelKost != null ? i.bestelKost : i.pak && i.pak.kost;
    prod = `<span class="prod"><span class="pn">${i.gedekt ? "" : n}${esc(i.product.naam)}</span>${inHuisTag(i)}${!i.gedekt && k != null ? `<span class="pr">${eur(k)}${i.pak && i.pak.aantal == null && i.pak.label && !deel ? " · " + esc(i.pak.label) : ""}</span>` : ""}${i.gedekt ? "" : `<a href="${K.zoekLink(i.product.naam)}" target="_blank" rel="noopener">C&amp;G</a>`}</span>`;
    knop = i.gedekt ? "" : `<button class="kp ${i.koppeling.bevestigd ? "" : "voorstel"}" data-koppel="${esc(i.sleutel)}">${i.koppeling.bevestigd ? "Wijzig" : "Klopt?"}</button>`;
  } else if (!i.voorraad){
    prod = inHuisTag(i) ? `<span class="prod">${inHuisTag(i)}</span>` : "";
    knop = i.koppeling ? `<button class="kp" data-koppel="${esc(i.sleutel)}">Geen product</button>` : `<button class="kp voorstel" data-koppel="${esc(i.sleutel)}">Koppel</button>`;
  }
  if (i.gedekt) knop = `<button class="kp" data-toch="${esc(i.key)}">Toch bestellen</button>`;
  else if (i.toch) knop += `<button class="kp" data-toch="${esc(i.key)}">Niet nodig</button>`;
  return `<div class="item ${i.af ? "af" : ""}"><label>
      <input type="checkbox" data-check="${esc(i.key)}" ${i.af ? "checked" : ""}>
      <span class="qty">${fmtQty(i.q, i.eenheid)}</span>
      <span class="wat">${esc(i.naam)}${i.extra ? ` <span class="tag">extra</span>` : ""}${voor}${prod}</span>
    </label><div class="rechts">${knop}${i.extra ? `<button class="del" data-delextra="${i.id}" aria-label="Verwijder ${esc(i.naam)}">×</button>` : ""}</div></div>`;
}

/* ================= Panelen ================= */
function openPaneel(html, init){ $("#paneel").innerHTML = html; $("#sheet").hidden = false; document.body.style.overflow = "hidden"; $("#paneel").scrollTop = 0; if (init) init(); const f = $("#paneel [autofocus]"); if (f) f.focus(); }
function sluitPaneel(){ $("#sheet").hidden = true; $("#paneel").innerHTML = ""; $("#paneel").onclick = $("#paneel").oninput = $("#paneel").onchange = $("#paneel").onsubmit = null; document.body.style.overflow = ""; }

function openKiezer(ds, mo){
  const m = slot(ds, mo), d = new Date(ds + "T12:00:00"), dag = DAGEN[(d.getDay() + 6) % 7];
  const molbl = (MOMENTEN.find(x => x[0] === mo) || [, mo])[1].toLowerCase();
  let porties = (m && m.porties) || S.porties, zoek = "";
  const lijst = () => {
    const z = norm(zoek);
    const rows = S.gerechten.filter(g => !z || norm(g.naam).includes(z)).sort((a, b) => a.naam.localeCompare(b.naam, "nl"));
    $("#k-lijst").innerHTML = rows.map(g => `<button class="keuze ${m && m.gerecht_id === g.id ? "sel" : ""}" data-kies="${g.id}"><span>${esc(g.naam)}${zonderIngr(g) ? "<small>geen ingrediënten: komt niet op de lijst</small>" : ""}</span><span>recept ${g.porties} p.</span></button>`).join("")
      || `<div class="leegstaat">Geen gerecht gevonden. Maak het aan via Gerechten.</div>`;
  };
  openPaneel(`
    <div class="paneel-kop"><h2>${dag} ${d.getDate()} ${MND[d.getMonth()]} · ${molbl}</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    ${dagAgendaKort(ds) ? `<div class="kiezer-agenda"><span class="lbl-klein">Die dag</span>${dagAgendaKort(ds)}</div>` : ""}
    <div class="stack">
      <div class="veld"><label>Aantal personen</label>
        <div class="stepper"><button class="ib" data-p="-1" aria-label="Minder">−</button><output id="k-p">${porties}</output><button class="ib" data-p="1" aria-label="Meer">+</button></div></div>
      <div class="chips snelkeuze" aria-label="Snelkeuze zonder recept">${SNELKEUZES.map(x => `<button class="chip" data-snelvrij="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <input class="in" id="k-zoek" type="search" placeholder="Zoek gerecht" aria-label="Zoek gerecht" autofocus>
    </div>
    <div class="keuzes" id="k-lijst"></div>
    <div class="veld" style="margin-top:14px"><label for="k-vrij">Of vrije tekst (geen boodschappen)</label>
      <div class="zoekbalk"><input class="in" id="k-vrij" placeholder="Restjes, uit eten …" value="${esc(m && !m.gerecht_id ? m.vrije_tekst : "")}"><button class="knop sec" data-vrij>Bewaar</button></div></div>
    <div class="voet">${m ? `<button class="knop gevaar links" data-leeg>Leegmaken</button>` : ""}<button class="knop sec" data-sluit>Sluiten</button></div>`, lijst);

  const p = $("#paneel");
  p.oninput = e => { if (e.target.id === "k-zoek"){ zoek = e.target.value; lijst(); } };
  p.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.p){ porties = Math.max(1, Math.min(40, porties + +t.dataset.p)); $("#k-p").textContent = porties; if (m) run(async () => { await db.setSlot(ds, mo, {...m, porties}); await herlaadWeek(); render(); }); }
    else if (t.dataset.kies) run(async () => { await db.setSlot(ds, mo, {gerecht_id: t.dataset.kies, porties}); S.porties = porties; pref.set("porties", porties); await herlaadWeek(); sluitPaneel(); render(); toast("Ingepland"); });
    else if ("vrij" in t.dataset){ const v = $("#k-vrij").value.trim(); if (!v) return toast("Vul eerst een tekst in");
      run(async () => { await db.setSlot(ds, mo, {vrije_tekst: v, porties}); await herlaadWeek(); sluitPaneel(); render(); }); }
    else if ("leeg" in t.dataset) run(async () => { await db.clearSlot(ds, mo); await herlaadWeek(); sluitPaneel(); render(); toast("Leeggemaakt"); });
    else if (t.dataset.snelvrij) run(async () => { await db.setSlot(ds, mo, {vrije_tekst: t.dataset.snelvrij, porties}); await herlaadWeek(); sluitPaneel(); render(); toast(t.dataset.snelvrij); });
  };
}

/* Recept bekijken */
function openRecept(id, vanSlot){
  const g = gerecht(id); if (!g) return;
  const dagen = [0,1,2,3,4,5,6].map(i => plus(S.pweek, i));
  openPaneel(`
    <div class="paneel-kop"><h2>${esc(g.naam)}</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    <p class="muted" style="margin:-6px 0 12px">${g.porties} personen${g.bereidingstijd_min ? " · " + g.bereidingstijd_min + " min" : ""}${g.categorie ? " · " + esc(g.categorie) : ""}${g.bron_url ? ` · <a href="${esc(g.bron_url)}" target="_blank" rel="noopener">bron</a>` : ""}</p>
    ${g.omschrijving ? `<p class="omschr">${esc(g.omschrijving)}</p>` : ""}
    ${zonderIngr(g) ? `<div class="banner">Dit recept heeft nog geen ingrediënten en komt dus niet op de boodschappenlijst. ${g.bron_url ? "Open de bron en plak de ingrediënten via <b>Bewerken</b>." : "Vul ze aan via <b>Bewerken</b>."}</div>`
      : `<h3 style="font-size:1rem;margin-bottom:4px">Ingrediënten</h3><ul class="ilijst">${g.ingredienten.map(i => `<li><span class="q">${esc(fmtQty(num(i.hoeveelheid), i.eenheid))}</span><span class="n">${esc(i.naam)}${i.notitie ? ` <small>${esc(i.notitie)}</small>` : ""}</span></li>`).join("")}</ul>`}
    ${g.bereiding ? `<h3 style="font-size:1rem;margin:14px 0 4px">Bereiding</h3><p class="omschr" style="color:var(--fg)">${esc(g.bereiding)}</p>` : ""}
    <h3 style="font-size:1rem;margin:16px 0 6px">Inplannen ${pwLabel()} (avond, ${S.porties} p.)</h3>
    <div class="daglijst">${dagen.map(d => { const ds = iso(d), b = slot(ds, "avond"); return `<button class="keuze" data-plan="${ds}"><span>${DAGEN[(d.getDay() + 6) % 7].slice(0, 2)} ${d.getDate()}/${d.getMonth() + 1}</span><span>${b ? "bezet" : ""}</span></button>`; }).join("")}</div>
    <div class="voet">${vanSlot ? `<button class="knop sec links" data-wissel>Ander gerecht</button>` : ""}<button class="knop sec" data-sluit>Sluiten</button><button class="knop" data-bewerk="${g.id}">Bewerken</button></div>`);
  $("#paneel").onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if ("wissel" in t.dataset) return openKiezer(vanSlot.ds, vanSlot.mo);
    if (t.dataset.plan) run(async () => { await db.setSlot(t.dataset.plan, "avond", {gerecht_id: g.id, porties: S.porties}); await herlaadWeek(); sluitPaneel(); render(); toast("Ingepland"); });
    else if (t.dataset.bewerk) openEditor(t.dataset.bewerk);
  };
}

const opties = (lijst, sel) => lijst.map(x => `<option value="${esc(x)}" ${x === (sel || "") ? "selected" : ""}>${esc(x || "–")}</option>`).join("");
function irowHtml(i = {}){
  const eenh = EENH.includes(i.eenheid || "") ? EENH : [...EENH, i.eenheid];
  return `<div class="irow">
    <input class="in i-qty" inputmode="decimal" placeholder="Hoev." aria-label="Hoeveelheid" value="${esc(i.hoeveelheid == null ? "" : fmtNum(i.hoeveelheid, 3))}">
    <select class="in i-eenh" aria-label="Eenheid">${opties(eenh, i.eenheid)}</select>
    <input class="in i-naam" list="ingr-namen" placeholder="Ingrediënt, eventueel notitie" aria-label="Ingrediënt" value="${esc(i.naam ? naamMetNotitie(i) : "")}">
    <select class="in i-afd" aria-label="Afdeling">${opties(AFD, i.afdeling || "Andere")}</select>
    <button type="button" class="del" data-delrow aria-label="Ingrediënt verwijderen">×</button></div>`;
}

  const bekend = new Map(); S.gerechten.forEach(x => (x.ingredienten || []).forEach(i => { const k = norm(i.naam); if (k && !bekend.has(k)) bekend.set(k, i); }));
  let zeker = false;

    <form id="g-form" novalidate>

      <div class="veld"><label for="g-cat">Categorie</label><select class="in" id="g-cat">${opties(["", ...CAT], g.categorie)}</select></div>

      <div style="display:flex;gap:8px"><button type="button" class="knop klein" data-verwerk>Toevoegen aan de lijst</button><button type="button" class="knop sec klein" data-plak>Annuleren</button></div>

  p.onchange = e => {
    if (!e.target.classList.contains("i-naam")) return;
    const r = e.target.closest(".irow"), k = bekend.get(norm(splitNotitie(e.target.value)[0]));
    if (r.querySelector(".i-afd").value === "Andere") r.querySelector(".i-afd").value = k ? (k.afdeling || "Andere") : K.afdelingVoor(e.target.value);
    if (k && !r.querySelector(".i-eenh").value) r.querySelector(".i-eenh").value = k.eenheid || "";
  };
  p.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if ("addrow" in t.dataset){ $("#irows").insertAdjacentHTML("beforeend", irowHtml()); $("#irows .irow:last-child .i-qty").focus(); }
    else if ("delrow" in t.dataset) t.closest(".irow").remove();
    else if ("plak" in t.dataset){ $("#plakvak").hidden = !$("#plakvak").hidden; if (!$("#plakvak").hidden) $("#plaktekst").focus(); }
    else if ("verwerk" in t.dataset){
      const l = K.leesLijst($("#plaktekst").value.split(/\n/).map(s => s.trim()).filter(Boolean));
      if (!l.length) return toast("Geen ingrediënten herkend");
      voegToe(l); $("#plaktekst").value = ""; $("#plakvak").hidden = true; toast(`${l.length} ingrediënten toegevoegd, kijk ze even na`);
    }
    else if ("web" in t.dataset){
      const url = $("#g-url").value.trim(); if (!/^https?:\/\//.test(url)) return toast("Vul eerst een link in");
      run(async () => {
        t.disabled = true; t.textContent = "Bezig…";
        try {
          const r = await db.receptVanWebsite(url);
          if (r.naam && !$("#g-naam").value.trim()) $("#g-naam").value = r.naam;
          if (r.porties) $("#g-porties").value = r.porties;
          if (r.bereidingstijd_min) $("#g-tijd").value = r.bereidingstijd_min;
          if (r.bereiding && !$("#g-bereiding").value.trim()) $("#g-bereiding").value = r.bereiding;
          if (r.omschrijving && !$("#g-omschr").value.trim()) $("#g-omschr").value = r.omschrijving;
          voegToe(K.leesLijst(r.ingredienten || [])); toast("Recept opgehaald, kijk het even na");
        } catch(err){ $("#plakvak").hidden = false; throw err; }
        finally { t.disabled = false; t.textContent = "Ophalen"; }
      });
    }
    else if ("wis" in t.dataset){
      if (!zeker){ zeker = true; t.textContent = "Zeker? Tik nogmaals"; t.classList.add("zeker"); return; }
      run(async () => { await db.deleteGerecht(id); await herlaadAlles(); sluitPaneel(); render(); toast("Gerecht verwijderd"); });
    }
  };
  p.onsubmit = e => {
    e.preventDefault();
    const naam = $("#g-naam").value.trim();
    if (!naam){ $("#g-naam").focus(); return toast("Geef het gerecht een naam"); }
    const ingredienten = [...p.querySelectorAll(".irow")].map(r => {
      const [n, notitie] = splitNotitie(r.querySelector(".i-naam").value);
      return { naam: n, notitie, hoeveelheid: num(r.querySelector(".i-qty").value), eenheid: r.querySelector(".i-eenh").value, afdeling: r.querySelector(".i-afd").value };
    }).filter(i => i.naam);
    const nieuw = {...g, naam, categorie: $("#g-cat").value, porties: Math.max(1, Math.min(40, parseInt($("#g-porties").value) || 4)),
      bereidingstijd_min: num($("#g-tijd").value), omschrijving: $("#g-omschr").value.trim(), bereiding: $("#g-bereiding").value.trim(), bron_url: $("#g-url").value.trim(), ingredienten};
    run(async () => { await db.saveGerecht(nieuw); await herlaadAlles(); sluitPaneel(); render(); toast("Bewaard"); });
  };
}

/* Product koppelen: één ingrediënt of alle open items na elkaar */
function openKoppel(sleutels, start = 0){
  const sl = sleutels[start];
  if (sl == null){ sluitPaneel(); render(); return toast("Klaar met koppelen"); }
  const it = lijstItems().find(i => i.sleutel === sl) || {naam: sl, q: null, eenheid: ""};
  const huidig = S.koppeling[sl];
  const voorstel = K.stelVoor(it.naam, S.producten, 4);
  let zoek = "";
  const regel = p => { const v = K.verpakkingen(it.q, it.eenheid, p);
    return `<button class="keuze ${huidig && String(huidig.product_id) === String(p.id) ? "sel" : ""}" data-pid="${p.id}"><span>${esc(p.naam)}${!p.beschikbaar ? "<small>tijdelijk onbeschikbaar</small>" : ""}</span><span>${v && v.aantal ? v.aantal + "× · " : ""}${p.prijs != null ? eur(p.prijs) + (p.prijs_per === "kg" ? "/kg" : "") : ""}</span></button>`; };
  const zoeklijst = () => {
    const z = norm(zoek);
    $("#kp-zoek-lijst").innerHTML = z.length < 2 ? "" : S.producten.filter(p => norm(p.naam).includes(z)).slice(0, 20).map(regel).join("") || `<div class="muted">Niets gevonden in jullie eerder gekochte producten.</div>`;
  };
  openPaneel(`
    <div class="paneel-kop"><h2>${esc(it.naam)} <span class="muted" style="font-family:var(--font-body);font-weight:400;font-size:.9rem">${esc(fmtQty(it.q, it.eenheid))}</span></h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    ${sleutels.length > 1 ? `<p class="muted" style="margin:-8px 0 10px">${start + 1} van ${sleutels.length} · geldt voor alle recepten met dit ingrediënt</p>` : `<p class="muted" style="margin:-8px 0 10px">Geldt voor alle recepten met dit ingrediënt</p>`}
    <div class="lbl-klein">Voorstel uit jullie eerdere aankopen</div>
    <div class="keuzes">${voorstel.map(regel).join("") || `<div class="muted">Geen voorstel gevonden.</div>`}</div>
    <div class="veld" style="margin-top:14px"><label for="kp-zoek">Zelf zoeken</label><input class="in" id="kp-zoek" type="search" placeholder="bv. gehakt, room, passata"></div>
    <div class="keuzes" id="kp-zoek-lijst"></div>
    <p class="muted" style="font-size:.85rem">Staat het product er niet tussen? <a href="${K.zoekLink(it.naam)}" target="_blank" rel="noopener">Zoek in Collect&amp;Go</a>. </p>
    <details class="nieuw-prod"><summary class="link">+ Nieuw product</summary>
      <div class="stack" style="margin-top:8px">
        <div class="veld"><label for="np-naam">Naam</label><input class="in" id="np-naam" value="${esc(it.naam)}" maxlength="120"></div>
        <div class="veld"><label for="np-afd">Afdeling</label><select class="in" id="np-afd">${opties(AFD, K.afdelingVoor ? K.afdelingVoor(it.naam) : "Andere")}</select></div>
        <div class="veld"><label for="np-prijs">Prijs (optioneel)</label><div class="zoekbalk"><input class="in" id="np-prijs" inputmode="decimal" placeholder="bv. 2,49">
          <select class="in" id="np-per" aria-label="Prijs per" style="max-width:9rem"><option value="stuk">per stuk</option><option value="kg">per kg</option></select></div></div>
        <div><button class="knop" data-nieuwprod>Toevoegen en koppelen</button></div>
      </div></details>
    <div class="voet"><button class="knop sec links" data-geen>Geen product</button>${sleutels.length > 1 ? `<button class="knop sec" data-over>Overslaan</button>` : `<button class="knop sec" data-sluit>Sluiten</button>`}</div>`);
  const p = $("#paneel");
  p.oninput = e => { if (e.target.id === "kp-zoek"){ zoek = e.target.value; zoeklijst(); } };
  p.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.pid || "geen" in t.dataset) run(async () => { await db.setKoppeling(sl, t.dataset.pid || null); await herlaadProducten(); if (sleutels.length > 1) openKoppel(sleutels, start + 1); else { sluitPaneel(); render(); toast("Gekoppeld"); } });
    else if ("over" in t.dataset) openKoppel(sleutels, start + 1);
    else if ("nieuwprod" in t.dataset){
      const naam = $("#np-naam").value.trim(); if (!naam){ $("#np-naam").focus(); return toast("Vul een naam in"); }
      const pr = $("#np-prijs").value.trim().replace(",", "."), prijs = pr === "" ? null : Number(pr);
      if (prijs != null && !(prijs >= 0 && prijs < 10000)) return toast("Prijs klopt niet");
      run(async () => { const id = await db.nieuwProduct({ naam, afdeling: $("#np-afd").value, prijs, prijs_per: $("#np-per").value });
        await db.setKoppeling(sl, id); await herlaadProducten(); toast("Product toegevoegd en gekoppeld");
        if (sleutels.length > 1) openKoppel(sleutels, start + 1); else { sluitPaneel(); render(); } });
    }
  };
}

  const delen = splitsBoodschappen($("#x-naam").value); if (!delen.length) return;
  const afd = $("#x-afd").value;
  run(async () => { for (const naam of delen) await db.addExtra(iso(S.pweek), {naam, afdeling: afd === "Andere" ? K.afdelingVoor(naam) : afd});
    await herlaadWeek(); render(); if (delen.length > 1) toast(`${delen.length} items toegevoegd`); $("#x-naam").focus(); });
});
// Slepen: recept uit zijpaneel → dag, of dag → andere dag (verplaatsen)
document.addEventListener("dragstart", e => {
  const s = e.target.closest("[data-sleep],[data-slot]"); if (!s) return;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", s.dataset.sleep ? "g:" + s.dataset.sleep : "s:" + s.dataset.slot);
});
document.addEventListener("dragover", e => { const s = e.target.closest(".slot"); if (s){ e.preventDefault(); s.classList.add("over"); } });
document.addEventListener("dragleave", e => { const s = e.target.closest(".slot"); if (s && !s.contains(e.relatedTarget)) s.classList.remove("over"); });
document.addEventListener("drop", e => {
  const s = e.target.closest(".slot"); if (!s) return;
  e.preventDefault(); s.classList.remove("over");
  const v = e.dataTransfer.getData("text/plain"), [ds, mo] = s.dataset.slot.split("|");
  run(async () => {
    if (v.startsWith("g:")) await db.setSlot(ds, mo, {gerecht_id: v.slice(2), porties: S.porties});
    else if (v.startsWith("s:")){
      const [vd, vm] = v.slice(2).split("|"); if (vd === ds && vm === mo) return;
      const van = slot(vd, vm), naar = slot(ds, mo);
      await db.setSlot(ds, mo, van);
      if (naar) await db.setSlot(vd, vm, naar); else await db.clearSlot(vd, vm);
    }
    await herlaadWeek(); render();
  });
});
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") sluitPaneel(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) sluitPaneel(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1).split("/")[0]; if (["vandaag","agenda","menu","gerechten","lijst","lijsten","budget","diepvries","energie"].includes(h) && h !== S.tab){ S.tab = h; render(); } dvOpenUitHash(); });
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (S.tab === "diepvries" && (window.innerWidth >= 1000) === document.body.classList.contains("breed")) return; if (db && ["menu", "budget", "vandaag", "agenda", "diepvries", "energie"].includes(S.tab) && $("#sheet").hidden) render(); }, 200); });

async function kopieer(){
  const items = BL.teBestellen(lijstItems()), start = iso(S.pweek);
  const n = i => i.inHuis && i.bestel != null ? (i.inHuis.maat === "g" ? fmtQty(i.bestel, "g") + " " : i.bestel + "× ") : i.pak && i.pak.aantal ? i.pak.aantal + "× " : "";
  const afd = [...AFD, ...new Set(items.map(i => i.afdeling).filter(a => !AFD.includes(a)))];
  const txt = `Bestelling ${pwLabel()} (bestellen ${vsDagLabel(BL.besteldag(start))})\n` + afd.map(a => {
    const l = items.filter(i => i.afdeling === a); if (!l.length) return "";
    return `\n${a}\n` + l.map(i => `- ${fmtQty(i.q, i.eenheid) ? fmtQty(i.q, i.eenheid) + " " : ""}${i.naam}${i.product ? ` → ${n(i)}${i.product.naam}` : ""}${i.inHuis ? " (deels in huis)" : i.misschien ? " (misschien in huis)" : ""}`).join("\n");
  }).join("") + "\n";
  try { await navigator.clipboard.writeText(txt); toast("Lijst gekopieerd"); }
  catch(e){ openPaneel(`<div class="paneel-kop"><h2>Lijst</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div><textarea class="in" id="kopie" style="min-height:300px">${esc(txt)}</textarea>`, () => $("#kopie").select()); }
}

/* ================= Start ================= */
function laadScript(src){ return new Promise((ok, nok) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => nok(new Error("Kon " + src + " niet laden")); document.head.appendChild(s); }); }
(async function start(){
  const cfg = window.KRING_CONFIG || {};
  const h = location.hash.slice(1).split("/")[0]; if (["vandaag","agenda","menu","gerechten","lijst","lijsten","budget","diepvries","energie"].includes(h)) S.tab = h;
  try {
    if (cfg.supabaseUrl && cfg.supabaseKey){
      await laadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js");
      db = new SupaStore(cfg);
    } else db = new LocalStore();
    if (!(await db.init())) return;
    await herlaadAlles();
    render();
    dvOpenUitHash();
    beAuto();
    vsAuto();
    await r5Init();
    run(vrGedeeldTicket);
    snelInspreken();
  } catch(e){ console.error(e); $("#view").innerHTML = `<div class="leegstaat">De app kon niet starten: ${esc(e.message)}</div>`; }
})();
</script>



<div id="app-installeer" hidden style="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;background:#24493f;color:#f3f5f2;border-radius:14px;padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.25);font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:520px;margin:0 auto">
  <div style="font-weight:600;font-size:15px;margin-bottom:4px">Zet Kring op je beginscherm</div>
  <div id="app-uitleg"></div>
  <div style="display:flex;gap:8px;margin-top:10px"><button id="app-knop" hidden style="flex:1;border:0;border-radius:10px;padding:10px;background:#c48a1f;color:#fff;font:inherit;font-weight:600">Installeren</button><button id="app-later" style="border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:10px 14px;background:transparent;color:inherit;font:inherit">Niet nu</button></div>
</div>
<script>
(function () {
  const $i = (id) => document.getElementById(id);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  let later = 0; try { later = +localStorage.getItem("kring-app-later") || 0; } catch (e) {}
  if (standalone || Date.now() - later < 30 * 864e5) return;
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const safari = ios && !/CriOS|FxiOS|EdgiOS/.test(ua);
  let prompt = null;
  const toon = () => { $i("app-installeer").hidden = false; };
  if (ios) {
    $i("app-uitleg").innerHTML = safari
      ? "1. Tik onderaan op <b>Deel</b> (vierkant met pijl omhoog).<br>2. Kies <b>Zet op beginscherm</b>.<br>3. Open Kring vanaf je beginscherm en meld één keer aan met de code."
      : "Open deze pagina in <b>Safari</b> en kies daar <b>Deel → Zet op beginscherm</b>.";
    toon();
  } else {
    $i("app-uitleg").innerHTML = "Of via het menu van je browser: <b>App installeren</b>.";
    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); prompt = e; $i("app-knop").hidden = false; toon(); });
    if (/Android/.test(ua)) toon();
  }
  $i("app-knop").addEventListener("click", async () => {
    if (!prompt) return; prompt.prompt();
    const keuze = await prompt.userChoice; prompt = null;
    if (keuze.outcome === "accepted") $i("app-installeer").hidden = true;
  });
  $i("app-later").addEventListener("click", () => { try { localStorage.setItem("kring-app-later", String(Date.now())); } catch (e) {} $i("app-installeer").hidden = true; });
  addEventListener("appinstalled", () => { $i("app-installeer").hidden = true; });
})();
</script>

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#24493f">
<script src="config.js"></script>
</head>
<body>
<!--APP-START-->
<title>Kring Weekmenu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: één kolom, sticky kop met weekwissel, vaste tabbalk onderaan (gsm-eerst); op brede schermen weekmenu + receptenpaneel naast elkaar */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e8ece7; --fg:#18231f; --muted:#5b6a64; --line:#d5ddd8;
  --primary:#24493f; --primary-fg:#ffffff; --accent:#c48a1f; --accent-soft:#f6ead2; --danger:#a8382c; --drop:#dcebe4; --c-in:#2f6fb5; --c-uit:#c4661f;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a2320; --sunk:#222d29; --fg:#e6ece9; --muted:#9aaba4; --line:#2e3b36;
  --primary:#8cc2b0; --primary-fg:#0f1a16; --accent:#e2ab4b; --accent-soft:#3a2f1a; --danger:#e67c6e; --drop:#24403a; --c-in:#4f8ed6; --c-uit:#d0783a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a2320; --sunk:#222d29; --fg:#e6ece9; --muted:#9aaba4; --line:#2e3b36;
  --primary:#8cc2b0; --primary-fg:#0f1a16; --accent:#e2ab4b; --accent-soft:#3a2f1a; --danger:#e67c6e; --drop:#24403a; --c-in:#4f8ed6; --c-uit:#d0783a; color-scheme:dark }

[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.breed .wrap{max-width:1180px}

/* Kop */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.merk{font-family:var(--font-display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;color:var(--primary)}
.merk small{font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--muted);margin-left:6px;letter-spacing:0}
.weeknav{display:flex;align-items:center;gap:4px;margin-left:auto}
.weeknav .lbl{font-variant-numeric:tabular-nums;font-size:.92rem;text-align:center;padding:0 4px}
.weeknav .lbl b{font-family:var(--font-display)}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;height:36px;padding:0 8px}
.ib:hover{border-color:var(--primary)}
.weeknav[hidden] + #meer{margin-left:auto}

main{padding-block:16px 110px}

/* Tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px}
.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--primary);border-top-color:var(--accent);font-weight:700}

/* Algemeen */
.knop{border:0;border-radius:8px;padding:10px 16px;background:var(--primary);color:var(--primary-fg);font-weight:700}
.knop.sec{background:var(--sunk);color:var(--fg)}
.knop.klein{padding:6px 10px;font-size:.88rem}
.knop.gevaar{background:none;color:var(--danger);border:1px solid var(--danger)}
.knop.gevaar.zeker{background:var(--danger);color:#fff}
.link{border:0;background:none;color:var(--primary);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.veld{display:flex;flex-direction:column;gap:4px;min-width:0}
.veld label,.lbl-klein{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
textarea.in{min-height:110px;resize:vertical}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:.9rem;margin-bottom:14px}
.tag{font-size:.7rem;background:var(--sunk);border-radius:4px;padding:1px 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;white-space:nowrap}
.tag.let{background:var(--accent-soft);color:var(--fg)}

/* Weekmenu */
.menu-grid{display:grid;grid-template-columns:1fr;gap:20px}
body.breed .menu-grid{grid-template-columns:minmax(0,1fr) 340px}
.samenvatting{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.samenvatting .getal{font-family:var(--font-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.dagen{display:flex;flex-direction:column;gap:10px}
.dag{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:start}
.dagkop{padding-top:10px;display:flex;flex-direction:column;gap:2px}
.dagnaam{font-family:var(--font-display);font-weight:700}
.datum{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dag.is-vandaag .dagnaam{color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;min-width:0}
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;border-radius:var(--r);padding:10px 12px;border:1px solid var(--line);background:var(--surface);min-width:0;box-sizing:border-box}
.slot .moment{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.slot .titel{font-weight:700;overflow-wrap:anywhere}
.slot .meta{font-size:.85rem;color:var(--muted)}
.slot.leeg{border-style:dashed;background:transparent;color:var(--muted)}
.slot.vrij .titel{font-style:italic;font-weight:400}
.slot:hover{border-color:var(--primary)}
.slot.over{background:var(--drop);border-color:var(--primary);border-style:solid}
.slot[draggable="true"]{cursor:grab}

.zijpaneel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 200px);display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px}
.zijpaneel h2{font-size:1rem}
.zijlijst{overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.sleep{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);cursor:grab;font-size:.92rem;display:flex;justify-content:space-between;gap:8px}
.sleep:active{cursor:grabbing}
.sleep span:last-child{color:var(--muted);font-size:.8rem;white-space:nowrap}

/* Gerechten */
.zoekbalk{display:flex;gap:8px;margin-bottom:10px}
.zoekbalk .in{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.chip.let[aria-pressed="false"]{border-color:var(--accent)}
.kaarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kaart{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kaart:hover{border-color:var(--primary)}
.kaart .titel{font-family:var(--font-display);font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.kaart .meta{font-size:.85rem;color:var(--muted)}
.kaart .onder{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.kaart .gepland{font-size:.8rem;color:var(--accent);font-weight:700}
.leegstaat{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}
.telling{font-size:.85rem;color:var(--muted);margin:-6px 0 10px}

/* Boodschappen */
.acties{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toggle{display:flex;align-items:center;gap:6px;font-size:.92rem}
.groep{margin-bottom:16px}
.groep h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--font-body);font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.item{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.item label{display:grid;grid-template-columns:24px 78px 1fr;align-items:baseline;gap:8px;padding:10px 0;flex:1;min-width:0;cursor:pointer}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);align-self:center}
.item .qty{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.item .wat{min-width:0;overflow-wrap:anywhere}
.item .voor{display:block;font-size:.8rem;color:var(--muted)}
.item .prod{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:.84rem;margin-top:2px}
.item .prod .pn{color:var(--fg)}
.item .prod .pr{font-variant-numeric:tabular-nums;color:var(--muted)}
.item.af .wat,.item.af .qty{text-decoration:line-through;color:var(--muted)}
.item .rechts{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .del{border:0;background:none;color:var(--muted);font-size:1.2rem;width:32px;height:32px}
.item .kp{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:.78rem;padding:3px 7px;white-space:nowrap}
.item .kp.voorstel{border-color:var(--accent)}
.extra-form{display:grid;grid-template-columns:1fr 180px auto;gap:8px;margin-top:8px}
.kost{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}
details.voorraad summary{cursor:pointer;list-style:none}
details.voorraad summary::-webkit-details-marker{display:none}
details.voorraad summary h3::after{content:"tonen";font-weight:400;text-transform:none;letter-spacing:0;color:var(--primary)}
details.voorraad[open] summary h3::after{content:"verbergen"}

/* Paneel (sheet) */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,20,16,.45);display:flex;align-items:flex-end;justify-content:center}
.paneel{background:var(--bg);width:100%;max-width:700px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
@media (min-width:700px){.sheet{align-items:center}.paneel{border-radius:16px}}
.paneel-kop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.paneel-kop h2{font-size:1.25rem;flex:1;min-width:0}
.rij{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rij.drie{grid-template-columns:2fr 1fr 1fr}
.stack{display:flex;flex-direction:column;gap:10px}
.voet{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.voet .links{margin-right:auto}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:2.2em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.keuzes{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.keuze{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.keuze.sel{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.keuze span:last-child{color:var(--muted);font-size:.85rem;white-space:nowrap}
.keuze small{display:block;color:var(--muted)}

.irows{display:flex;flex-direction:column;gap:8px}
.irow{display:grid;grid-template-columns:72px 96px 1fr 150px 32px;gap:6px;align-items:center}
.irow .del{border:0;background:none;color:var(--muted);font-size:1.2rem}
.ikop{display:grid;grid-template-columns:72px 96px 1fr 150px 32px;gap:6px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ilijst{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.ilijst li{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ilijst .q{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.ilijst .n small{color:var(--muted)}
.omschr{white-space:pre-wrap;color:var(--muted);margin:0 0 12px;max-width:65ch}
.daglijst{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
@media (max-width:620px){
  .irow{grid-template-columns:64px 88px 1fr 32px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .irow .i-naam{grid-column:1 / 4;grid-row:1}
  .irow .del{grid-column:4;grid-row:1}
  .irow .i-qty{grid-row:2}
  .irow .i-eenh{grid-row:2}
  .irow .i-afd{grid-column:3 / 5;grid-row:2}
  .ikop{display:none}
  .rij.drie{grid-template-columns:1fr 1fr}
  .rij.drie .veld:first-child{grid-column:1 / 3}
  .extra-form{grid-template-columns:1fr auto}
  .extra-form select{grid-column:1 / 3;grid-row:2}
  .dag{grid-template-columns:1fr;gap:4px}
  .dagkop{flex-direction:row;gap:8px;align-items:baseline;padding-top:0}
}

/* Agenda */
.ag-kop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);font-weight:700}
.ag-chips .chip{display:inline-flex;align-items:center;gap:6px}
.ag-chips .chip[aria-pressed="true"]{background:var(--surface);color:var(--fg);border-color:var(--k)}
.ag-chips .chip[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.dot{width:10px;height:10px;border-radius:50%;background:var(--k);display:inline-block;flex:none}
.ag-aandacht{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;padding:10px;border-radius:var(--r);background:var(--accent-soft)}
.ag-lijst{display:flex;flex-direction:column;gap:4px;min-width:0}
.ag-item{display:flex;align-items:center;gap:8px;border-left:4px solid var(--k);background:var(--surface);border-radius:0 8px 8px 0;min-width:0}
.ag-item.heledag{background:color-mix(in srgb, var(--k) 14%, var(--surface))}
.ag-item.klaar .ag-titel{text-decoration:line-through;color:var(--muted)}
.ag-item .ag-vink{width:20px;height:20px;margin-left:8px;accent-color:var(--primary);flex:none}
.ag-knop{border:0;background:none;text-align:left;padding:8px 10px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;flex:1;min-width:0}
.ag-knop:disabled{cursor:default;color:inherit}
.ag-tijd{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;min-width:3.2em}
.ag-titel{overflow-wrap:anywhere}
.ag-meta{flex-basis:100%;font-size:.82rem;color:var(--muted)}
.ag-dag .dagkop{position:relative}
.ag-plus{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:28px;height:28px;margin-top:4px}
.ag-leeg{border:1px dashed var(--line);background:none;border-radius:8px;padding:8px 10px;color:var(--muted);text-align:left}
.ag-kort{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--muted);margin-top:6px}
.ag-kort span{border-left:3px solid var(--k);padding-left:5px}
.ag-kort .klaar{text-decoration:line-through}
.maand{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mkop,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mkop span{padding:6px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.mcel{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;min-height:92px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.mcel:nth-child(7n){border-right:0}
.mcel.buiten{background:var(--bg);color:var(--muted)}
.mcel.vandaag .mnr{background:var(--accent);color:#fff;border-radius:99px;padding:0 6px}
.mnr{font-size:.85rem;font-weight:700;align-self:flex-start}
.mitems{display:flex;flex-direction:column;gap:2px;min-width:0}
.mi{font-size:.72rem;border-left:3px solid var(--k);padding-left:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.hd{background:color-mix(in srgb, var(--k) 16%, transparent)}
.mmeer{font-size:.7rem;color:var(--muted)}
.mdots{display:none;gap:3px;flex-wrap:wrap}
.mdots i{width:7px;height:7px;border-radius:50%;background:var(--k)}
@media (max-width:620px){ .mcel{min-height:58px} .mitems{display:none} .mdots{display:flex} }
.instrij{display:flex;align-items:center;gap:8px}
.instform{display:grid;grid-template-columns:1fr 130px auto;gap:6px}
.chip.toggle{display:inline-flex;align-items:center;gap:6px;border-color:var(--k, var(--line))}
.kiezer-agenda{font-size:.88rem;margin:-6px 0 12px}
/* Vandaag, lijsten, snel toevoegen */
.groet{font-size:1.6rem}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
.vk{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;min-width:0}
.vk-kop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.vk-kop h2{font-size:1.05rem}
.vk-groot{font-family:var(--font-display);font-weight:700;font-size:1.2rem;border:0;background:none;padding:0;text-align:left;margin:0}
.vk .getal{font-family:var(--font-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.neg,.neg-tekst{color:var(--danger)}
.vlijst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vlijst li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.vlijst li:last-child{border-bottom:0}
.vlijst label{display:flex;gap:8px;align-items:center}
.lrij{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px}
.lnaam{flex:1;min-width:0;font-weight:700}
.lnaam small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.lteller{font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:99px;padding:1px 9px;font-size:.88rem}
.licoon{width:30px;height:30px;border-radius:8px;background:var(--sunk);flex:none;position:relative}
.licoon::after{content:"";position:absolute;inset:9px;border:2px solid var(--primary);border-radius:3px}
.licoon.todo::after{border-radius:50%}
.licoon.boodschap{background:var(--accent-soft)}
.lform{grid-template-columns:1fr auto;margin-bottom:12px}

<script>
"use strict";
/* ================= Constanten en hulpfuncties ================= */
const K = window.KringIngr;
const AFD = ["Groenten & fruit","Brood & bakkerij","Vlees & vis","Zuivel & eieren","Kaas & charcuterie","Droge voeding","Conserven & sauzen","Kruiden & specerijen","Diepvries","Dranken","Huishouden","Andere"];
const EENH = ["", "g","kg","ml","cl","dl","l","stuk","el","tl","teentje","blik","pak","zakje","blokje","bos","sneetje","stengel","bol","potje","fles"];
const CAT = ["Pasta","Vlees","Vis","Ovenschotel","Soep","Salade","Snel","BBQ","Vegetarisch","Feest","Andere"];
const MOMENTEN = [["ontbijt","Ontbijt"],["middag","Middag"],["snack","Snack"],["avond","Avond"]];
const DAGEN = ["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag","Zondag"];
const MND = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "id" + Math.random().toString(36).slice(2) + Date.now().toString(36);
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const plus = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const maandag = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const norm = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
function weeknr(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const w = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - w); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }
const num = v => { if (v === null || v === undefined || v === "") return null; const n = K.getal(String(v)); return n != null && isFinite(n) ? n : null; };
const fmtNum = (n, max = 2) => n == null ? "" : Number(n).toLocaleString("nl-BE", {maximumFractionDigits: max});
const eur = n => n == null ? "" : "€ " + Number(n).toLocaleString("nl-BE", {minimumFractionDigits: 2, maximumFractionDigits: 2});

function fmtQty(q, u){
  if (q == null) return "";
  let n = q, unit = u;
  if (u === "g" && q >= 1000){ n = q / 1000; unit = "kg"; }
  if (u === "ml" && q >= 1000){ n = q / 1000; unit = "l"; }
  if (K.TEL.has(unit)) n = Math.ceil(n - 1e-9);
  const dec = (unit === "kg" || unit === "l") ? 2 : (unit === "el" || unit === "tl") ? 1 : 0;
  const s = fmtNum(n, dec);
  return (unit === "stuk" || unit === "") ? s : `${s} ${unit}`;
}
const pref = {
  get(k, d){ try { const v = localStorage.getItem("kring-pref-" + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem("kring-pref-" + k, JSON.stringify(v)); } catch(e){} }
};
const naamMetNotitie = i => i.notitie ? `${i.naam}, ${i.notitie}` : i.naam;
function splitNotitie(s){ const m = String(s).match(/^(.*?),\s*(.+)$/); return m && !/^\d/.test(m[2]) ? [m[1].trim(), m[2].trim()] : [String(s).trim(), ""]; }

/* ================= Seed (FamilyWall-recepten + Collect&Go-producten) ================= */
async function laadSeed(){
  // Persoonlijke data staat niet op de publieke site: enkel in de lokale testversie (ingebakken) of via een gekozen bestand
  return window.KRING_SEED || {recepten: [], producten: [], koppeling: {}};
}
function kiesSeedBestand(){
  return new Promise((ok, nok) => {
    const f = document.createElement("input"); f.type = "file"; f.accept = ".json,application/json";
    f.onchange = () => { const b = f.files[0]; if (!b) return nok(new Error("geen bestand gekozen")); const r = new FileReader();
      r.onload = () => { try { const d = JSON.parse(r.result); if (d.soort !== "kring-seed") throw new Error("dit is geen Kring-importbestand"); ok(d); } catch(e){ nok(e); } };
      r.readAsText(b); };
    f.click();
  });
}

/* ================= Opslag: demo (lokaal) ================= */
function demoData(seed){
  const gs = seed.recepten.map(r => ({ id: uid(), fw_id: r.fw_id, naam: r.naam, categorie: r.categorie || "", porties: r.porties || 4,
    bereidingstijd_min: r.bereidingstijd_min, omschrijving: r.omschrijving || "", bron_url: r.bron_url || "", favoriet: false,
    ingredienten: r.ingredienten.map(i => ({...i, id: uid()})) }));
  const w = maandag(new Date());
  const zoek = n => (gs.find(g => g.naam.startsWith(n)) || {}).id;
  const plan = [["Spaghetti bolognaise",0],["Griekse gehaktballetjes",1],["Gegratineerde kabeljauw",2],["Hutsepot van spruitjes",3],[null,4,"Frietjes van de frituur"],["Stoofvlees-friet",5],["Kip-preipie",6]];
  const menu = plan.map(([n, d, vrij]) => ({id: uid(), datum: iso(plus(w, d)), moment: "avond", gerecht_id: n ? zoek(n) : null, vrije_tekst: vrij || null, porties: 4}))
                   .filter(m => m.gerecht_id || m.vrije_tekst);
  const producten = seed.producten.map(p => ({...p}));
  const koppeling = {};   // sleutel → {product_id|null, bevestigd}
  for (const [k, v] of Object.entries(seed.koppeling || {})) koppeling[k] = {product_id: v.voorstel[0], bevestigd: false};
  return {gerechten: gs, menu, extra: [{id: uid(), week_start: iso(w), naam: "wc-papier", hoeveelheid: null, eenheid: "", afdeling: "Huishouden", afgevinkt: false}], checks: {}, producten, koppeling};
}

class LocalStore {
  constructor(){ this.key = "kring-demo-v3"; this.d = null; this.demo = true; this.label = "testversie"; }
  async init(){
    try { const s = localStorage.getItem(this.key) || localStorage.getItem("kring-demo-v2"); if (s) this.d = JSON.parse(s); } catch(e){}
    if (!this.d) this.d = demoData(await laadSeed());
    if (!this.d.leden) Object.assign(this.d, demoAgenda());   // R1-testdata behouden, agenda toevoegen
    if (!this.d.lijsten) Object.assign(this.d, demoGezin(this.d.leden));
    this.save();
    return true;
  }
  /* --- R3 lijsten + activiteit --- */
  async loadGezin(){ return JSON.parse(JSON.stringify({lijsten: this.d.lijsten, activiteit: this.d.activiteit.slice().sort((a, b) => b.op.localeCompare(a.op))})); }
  async log(wat){ this.d.activiteit.unshift({id: uid(), wie: ik().naam, wat, op: new Date().toISOString()}); this.d.activiteit = this.d.activiteit.slice(0, 200); this.save(); }
  async bewaarLijst(l){ const c = {items: [], ...l}; return this._bewaar("lijsten", c); }
  async verwijderLijst(id){ this.d.lijsten = this.d.lijsten.filter(x => x.id !== id); this.save(); }
  async bewaarItem(lijstId, i){ const l = this.d.lijsten.find(x => x.id === lijstId); const c = {...i}; if (!c.id){ c.id = uid(); l.items.push(c); } else { const k = l.items.findIndex(x => x.id === c.id); l.items[k] = c; } this.save(); return c.id; }
  async verwijderItem(lijstId, id){ const l = this.d.lijsten.find(x => x.id === lijstId); l.items = l.items.filter(x => x.id !== id); this.save(); }
  async vinkItem(lijstId, id, val){ const l = this.d.lijsten.find(x => x.id === lijstId), i = l.items.find(x => x.id === id); i.klaar = val; this.save(); if (val) await this.log(`vinkte '${i.tekst}' af op ${l.naam}`); }
  /* --- R4 budget (testdata, elke keer opnieuw berekend) --- */
  async loadBudget(){ return KringBudget.testdata(iso(new Date())); }
  /* --- agenda --- */
  async loadAgenda(){ const {leden, kalenders, afspraken, taken, verjaardagen} = JSON.parse(JSON.stringify(this.d)); return {leden, kalenders, afspraken, taken, verjaardagen}; }
  _bewaar(lijst, o){ const c = JSON.parse(JSON.stringify(o)); if (!c.id){ c.id = uid(); this.d[lijst].push(c); } else { const k = this.d[lijst].findIndex(x => x.id === c.id); if (k < 0) this.d[lijst].push(c); else this.d[lijst][k] = c; } this.save(); return c.id; }
  async bewaarAfspraak(a){ return this._bewaar("afspraken", a); }
  async verwijderAfspraak(id){ this.d.afspraken = this.d.afspraken.filter(x => x.id !== id); this.save(); }
  async schrapVoorkomen(id, d){ const a = this.d.afspraken.find(x => x.id === id); (a.uitzonderingen = a.uitzonderingen || []).push(d); this.save(); }
  async bewaarTaak(t){ return this._bewaar("taken", t); }
  async verwijderTaak(id){ this.d.taken = this.d.taken.filter(x => x.id !== id); this.save(); }
  async schrapTaakVoorkomen(id, d){ const t = this.d.taken.find(x => x.id === id); (t.uitzonderingen = t.uitzonderingen || []).push(d); this.save(); }
  async vinkTaak(id, d, val){ const t = this.d.taken.find(x => x.id === id); const s = new Set(t.klaar || []); val ? s.add(d) : s.delete(d); t.klaar = [...s]; this.save(); }
  async bewaarVerjaardag(v){ return this._bewaar("verjaardagen", v); }
  async verwijderVerjaardag(id){ this.d.verjaardagen = this.d.verjaardagen.filter(x => x.id !== id); this.save(); }
  async bewaarLid(l){ return this._bewaar("leden", l); }
  async bewaarKalender(k){ return this._bewaar("kalenders", k); }
  async verwijderKalender(id){ this.d.kalenders = this.d.kalenders.filter(x => x.id !== id); this.d.afspraken = this.d.afspraken.filter(a => a.kalender_id !== id); this.save(); }
  async importeerICS(naam, kleur, ev){
    const kid = this._bewaar("kalenders", {naam, kleur, soort: "ics"});
    ev.forEach(e => this.d.afspraken.push({...e, id: uid(), kalender_id: kid, deelnemers: [], ics: true, uitzonderingen: e.uitzonderingen || []}));
    this.save(); return ev.length;
  }
  async abonneerICS(){ throw new Error("abonneren op een link werkt pas in de echte versie. Download het .ics-bestand en importeer het."); }
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.d)); } catch(e){} }
  async loadGerechten(){ return JSON.parse(JSON.stringify(this.d.gerechten)); }
  async saveGerecht(g){
    const c = JSON.parse(JSON.stringify(g));
    c.ingredienten = (c.ingredienten || []).filter(i => norm(i.naam)).map((i, n) => ({...i, id: i.id || uid(), volgorde: n + 1}));
    if (!c.id){ c.id = uid(); this.d.gerechten.push(c); }
    else { const k = this.d.gerechten.findIndex(x => x.id === c.id); if (k < 0) throw new Error("Gerecht niet gevonden"); this.d.gerechten[k] = c; }
    this.save(); return c.id;
  }
  async deleteGerecht(id){
    const g = this.d.gerechten.find(x => x.id === id);
    this.d.menu.forEach(m => { if (m.gerecht_id === id){ m.vrije_tekst = m.vrije_tekst || (g && g.naam); m.gerecht_id = null; } });
    this.d.gerechten = this.d.gerechten.filter(x => x.id !== id); this.save();
  }
  async loadWeek(start){
    const a = iso(start), b = iso(plus(start, 6));
    return { menu: this.d.menu.filter(m => m.datum >= a && m.datum <= b).map(x => ({...x})),
             extra: this.d.extra.filter(e => e.week_start === a).map(x => ({...x})),
             checks: new Set(this.d.checks[a] || []) };
  }
  async setSlot(datum, moment, v){
    let m = this.d.menu.find(x => x.datum === datum && x.moment === moment);
    if (!m){ m = {id: uid(), datum, moment}; this.d.menu.push(m); }
    Object.assign(m, {gerecht_id: v.gerecht_id || null, vrije_tekst: v.vrije_tekst || null, porties: v.porties || null}); this.save();
  }
  async clearSlot(datum, moment){ this.d.menu = this.d.menu.filter(x => !(x.datum === datum && x.moment === moment)); this.save(); }
  async addExtra(week, it){ this.d.extra.push({id: uid(), week_start: week, afgevinkt: false, ...it}); this.save(); }
  async toggleExtra(id, val){ const e = this.d.extra.find(x => x.id === id); if (e) e.afgevinkt = val; this.save(); }
  async deleteExtra(id){ this.d.extra = this.d.extra.filter(x => x.id !== id); this.save(); }
  async setCheck(week, key, val){ const s = new Set(this.d.checks[week] || []); val ? s.add(key) : s.delete(key); this.d.checks[week] = [...s]; this.save(); }
  async loadProducten(){ return {producten: this.d.producten, koppeling: {...this.d.koppeling}}; }
  async setKoppeling(sleutel, product_id){ this.d.koppeling[sleutel] = {product_id, bevestigd: true}; this.save(); }
  async receptVanWebsite(){ throw new Error("In de testversie kan de app geen andere websites lezen. Plak de ingrediënten hieronder."); }

/* ================= Opslag: Supabase ================= */
class SupaStore {
  constructor(cfg){ this.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey); this.g = this.sb.schema("gezin"); this.h = null; this.demo = false; this.label = ""; }
  ok({data, error}){ if (error) throw new Error(error.message); return data; }
  async init(){
    const {data: {session}} = await this.sb.auth.getSession();
    this.session = session;
    this.sb.auth.onAuthStateChange(ev => {
      if ((ev === "SIGNED_IN" && !this.session) || ev === "SIGNED_OUT") location.replace(location.pathname);
    });
    if (!session){ toonLogin(this); return false; }
    const hs = this.ok(await this.g.from("huishoudens").select("id,naam,uitnodigcode").limit(1));
    if (!hs.length){ toonStart(this); return false; }
    this.huis = hs[0]; this.h = hs[0].id; this.label = hs[0].naam;
    this.live();
    return true;
  }
  live(){   // partner ziet afvinken en planning meteen
    this.sb.channel("kring-" + this.h)
      .on("postgres_changes", {event: "*", schema: "gezin", table: "weekmenu", filter: `huishouden_id=eq.${this.h}`}, () => herlaadWeek().then(render))
      .on("postgres_changes", {event: "*", schema: "gezin", table: "boodschappen_afgevinkt", filter: `huishouden_id=eq.${this.h}`}, () => herlaadWeek().then(render))
      .on("postgres_changes", {event: "*", schema: "gezin", table: "boodschappen_extra", filter: `huishouden_id=eq.${this.h}`}, () => herlaadWeek().then(render))
      .subscribe();
  }
  async loadGerechten(){
    const rows = this.ok(await this.g.from("gerechten").select("*, ingredienten(*)").eq("huishouden_id", this.h).order("naam"));
    rows.forEach(r => r.ingredienten.sort((a, b) => a.volgorde - b.volgorde));
    return rows;
  }
  async saveGerecht(g){ return this.ok(await this.g.rpc("bewaar_gerecht", {p: {...g, huishouden_id: this.h}})); }
  async deleteGerecht(id){ this.ok(await this.g.from("gerechten").delete().eq("id", id)); }
  async loadWeek(start){
    const a = iso(start), b = iso(plus(start, 6));
    const [m, e, c] = await Promise.all([
      this.g.from("weekmenu").select("*").eq("huishouden_id", this.h).gte("datum", a).lte("datum", b),
      this.g.from("boodschappen_extra").select("*").eq("huishouden_id", this.h).eq("week_start", a).order("aangemaakt"),
      this.g.from("boodschappen_afgevinkt").select("sleutel").eq("huishouden_id", this.h).eq("week_start", a)]);
    return {menu: this.ok(m), extra: this.ok(e), checks: new Set(this.ok(c).map(x => x.sleutel))};
  }
  async setSlot(datum, moment, v){
    this.ok(await this.g.from("weekmenu").upsert({huishouden_id: this.h, datum, moment, gerecht_id: v.gerecht_id || null, vrije_tekst: v.vrije_tekst || null, porties: v.porties || null}, {onConflict: "huishouden_id,datum,moment"}));
  }
  async clearSlot(datum, moment){ this.ok(await this.g.from("weekmenu").delete().eq("huishouden_id", this.h).eq("datum", datum).eq("moment", moment)); }
  async addExtra(week, it){ this.ok(await this.g.from("boodschappen_extra").insert({huishouden_id: this.h, week_start: week, ...it})); }
  async toggleExtra(id, val){ this.ok(await this.g.from("boodschappen_extra").update({afgevinkt: val}).eq("id", id)); }
  async deleteExtra(id){ this.ok(await this.g.from("boodschappen_extra").delete().eq("id", id)); }
  async setCheck(week, key, val){
    const t = this.g.from("boodschappen_afgevinkt");
    if (val) this.ok(await t.upsert({huishouden_id: this.h, week_start: week, sleutel: key}, {onConflict: "huishouden_id,week_start,sleutel"}));
    else this.ok(await t.delete().eq("huishouden_id", this.h).eq("week_start", week).eq("sleutel", key));
  }
  async loadProducten(){
    const [p, k] = await Promise.all([this.g.from("producten").select("*").eq("huishouden_id", this.h), this.g.from("ingredient_product").select("*").eq("huishouden_id", this.h)]);
    const producten = this.ok(p).map(x => ({...x, id: x.id, kern: K.productKern(x.naam)}));
    const koppeling = {}; this.ok(k).forEach(x => koppeling[x.sleutel] = {product_id: x.product_id, bevestigd: true});
    return {producten, koppeling};
  }
  async setKoppeling(sleutel, product_id){
    this.ok(await this.g.from("ingredient_product").upsert({huishouden_id: this.h, sleutel, product_id, geen_product: !product_id}, {onConflict: "huishouden_id,sleutel"}));
  }
  async receptVanWebsite(url){
    const {data, error} = await this.sb.functions.invoke("recept-import", {body: {url}});
    if (error) throw new Error(error.message); if (data.fout) throw new Error(data.fout); return data;
  }
  async importeerFamilyWall(){
    const seed = await kiesSeedBestand();
    const n = this.ok(await this.g.rpc("importeer_recepten", {p_huishouden: this.h, p: seed.recepten}));
    this.ok(await this.g.rpc("importeer_producten", {p_huishouden: this.h, p: seed.producten.map(x => ({cg_product_id: x.id, naam: x.naam, afdeling: x.afdeling, inhoud: x.inhoud, inhoud_eenheid: x.inhoud_eenheid, prijs: x.prijs, prijs_per: x.prijs_per, beschikbaar: x.beschikbaar}))}));
    return n;
  }
  /* --- agenda --- */
  async loadAgenda(){
    const q = t => this.g.from(t).select("*").eq("huishouden_id", this.h);
    const [l, k, a, t, tk, v] = await Promise.all([q("leden"), q("kalenders"), q("afspraken"), q("taken"), q("taak_klaar"), q("verjaardagen")]);
    const herh = r => r.herh_freq ? {freq: r.herh_freq, interval: r.herh_interval || 1, dagen: r.herh_dagen || [], tot: r.herh_tot} : null;
    const klaar = {}; this.ok(tk).forEach(x => (klaar[x.taak_id] = klaar[x.taak_id] || []).push(x.datum));
    return {
      leden: this.ok(l).map(x => ({id: x.id, naam: x.naam, kleur: x.kleur || "#5b6a64", heeft_account: !!x.user_id})),
      kalenders: this.ok(k).map(x => ({id: x.id, naam: x.naam, kleur: x.kleur, soort: x.soort})),
      afspraken: this.ok(a).map(x => ({...x, start_tijd: x.start_tijd && x.start_tijd.slice(0, 5), eind_tijd: x.eind_tijd && x.eind_tijd.slice(0, 5), herhaling: herh(x), uitzonderingen: x.uitzonderingen || [], deelnemers: x.deelnemers || [], ics: !!x.ics_uid})),
      taken: this.ok(t).map(x => ({...x, tijd: x.tijd && x.tijd.slice(0, 5), herhaling: herh(x), uitzonderingen: x.uitzonderingen || [], klaar: klaar[x.id] || []})),
      verjaardagen: this.ok(v)
    };
  }
  _herh(h){ return {herh_freq: h ? h.freq : null, herh_interval: h ? h.interval : null, herh_dagen: h && h.dagen && h.dagen.length ? h.dagen : null, herh_tot: h ? h.tot : null}; }
  async bewaarAfspraak(a){
    const r = {huishouden_id: this.h, kalender_id: a.kalender_id, titel: a.titel, hele_dag: a.hele_dag, datum: a.datum, datum_tot: a.datum_tot, start_tijd: a.start_tijd, eind_tijd: a.eind_tijd,
      plaats: a.plaats || null, notitie: a.notitie || null, herinnering_min: a.herinnering_min, deelnemers: a.deelnemers, uitzonderingen: a.uitzonderingen || [], ...this._herh(a.herhaling)};
    if (a.id) this.ok(await this.g.from("afspraken").update(r).eq("id", a.id)); else this.ok(await this.g.from("afspraken").insert(r));
  }
  async verwijderAfspraak(id){ this.ok(await this.g.from("afspraken").delete().eq("id", id)); }
  async schrapVoorkomen(id, d){ this.ok(await this.g.rpc("schrap_voorkomen", {p_tabel: "afspraken", p_id: id, p_datum: d})); }
  async bewaarTaak(t){

    if (t.id) this.ok(await this.g.from("taken").update(r).eq("id", t.id)); else this.ok(await this.g.from("taken").insert(r));

    if (v.id) this.ok(await this.g.from("verjaardagen").update(r).eq("id", v.id)); else this.ok(await this.g.from("verjaardagen").insert(r)); }
  async verwijderVerjaardag(id){ this.ok(await this.g.from("verjaardagen").delete().eq("id", id)); }
  async bewaarLid(l){ this.ok(await this.g.rpc("voeg_lid_toe", {p_huishouden: this.h, p_naam: l.naam, p_kleur: l.kleur})); }
  async bewaarKalender(k){ this.ok(await this.g.from("kalenders").insert({huishouden_id: this.h, naam: k.naam, kleur: k.kleur, soort: k.soort || "eigen", ics_url: k.ics_url || null})); }

    const rijen = ev.map(e => ({huishouden_id: this.h, kalender_id: kal.id, titel: e.titel, hele_dag: e.hele_dag, datum: e.datum, datum_tot: e.datum_tot, start_tijd: e.start_tijd, eind_tijd: e.eind_tijd,
      plaats: e.plaats || null, notitie: e.notitie || null, ics_uid: e.ics_uid || "x", uitzonderingen: e.uitzonderingen || [], deelnemers: [], ...this._herh(e.herhaling)}));
    for (let i = 0; i < rijen.length; i += 500) this.ok(await this.g.from("afspraken").insert(rijen.slice(i, i + 500)));

/* ================= Toestand ================= */
const S = { tab: "vandaag", budgetView: pref.get("budgetView", "plan"), bmaand: null, bfilter: "alle", bcat: null, brek: null, bzoek: "", budget: null,
            lijsten: [], activiteit: [], lijstOpen: null, ik: pref.get("ik", null), agendaView: pref.get("agendaView", "week"), maand: new Date(), verborgen: pref.get("verborgen", []),
            leden: [], kalenders: [], afspraken: [], taken: [], verjaardagen: [], week: maandag(new Date()), gerechten: [], menu: [], extra: [], checks: new Set(), producten: [], koppeling: {},
            zoek: "", cat: "", onvolledig: false, zijzoek: "", verberg: pref.get("verberg", false),
            momenten: pref.get("momenten", ["avond"]), porties: pref.get("porties", 4) };
let db;

async function herlaadWeek(){ const w = await db.loadWeek(S.week); S.menu = w.menu; S.extra = w.extra; S.checks = w.checks; }
async function herlaadProducten(){ const p = await db.loadProducten(); S.producten = p.producten; S.koppeling = p.koppeling; S.prodIdx = new Map(S.producten.map(x => [String(x.id), x])); }
async function herlaadAgenda(){ const a = await db.loadAgenda(); Object.assign(S, a); if (!S.leden.some(l => l.id === S.ik)) S.ik = db.mijnLid || (S.leden[0] || {}).id || null; }
async function herlaadGezin(){ const g = await db.loadGezin(); S.lijsten = g.lijsten; S.activiteit = g.activiteit; }
async function herlaadBudget(){ try { S.budget = await db.loadBudget(); if (S.budget && !S.bmaand) S.bmaand = S.budget.huidig; } catch(e){ console.error(e); S.budget = null; } }
async function herlaadAlles(){ S.gerechten = await db.loadGerechten(); await Promise.all([herlaadWeek(), herlaadProducten(), herlaadAgenda(), herlaadGezin(), herlaadBudget()]); }
const gerecht = id => S.gerechten.find(g => g.id === id);
const slot = (d, m) => S.menu.find(x => x.datum === d && x.moment === m);
const product = id => id == null ? null : S.prodIdx.get(String(id));
const zonderIngr = g => !(g.ingredienten || []).length;

function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
async function run(fn){ try { await fn(); } catch(e){ console.error(e); toast("Niet gelukt: " + (e.message || e)); } }

/* ================= Boodschappenlijst berekenen ================= */
function lijstItems(){
  const map = new Map();
  for (const m of S.menu){
    const g = gerecht(m.gerecht_id); if (!g) continue;
    const f = (m.porties || g.porties || 1) / (g.porties || 1);
    for (const i of g.ingredienten || []){
      if (!norm(i.naam)) continue;
      const [q, u] = K.basis(num(i.hoeveelheid), i.eenheid || "");
      const sl = K.sleutel(i.naam), key = sl + "|" + u;
      let e = map.get(key);
      if (!e){ e = {key, sleutel: sl, naam: i.naam.trim(), eenheid: u, q: null, afdeling: i.afdeling || K.afdelingVoor(i.naam), voor: new Set(), extra: false, voorraad: K.isVoorraad(i.naam)}; map.set(key, e); }
      if (q != null) e.q = (e.q || 0) + q * f;
      e.voor.add(g.naam);
    }
  }
  const out = [...map.values()].map(e => ({...e, af: S.checks.has(e.key)}));
  for (const x of S.extra) out.push({key: "x:" + x.id, id: x.id, sleutel: K.sleutel(x.naam), naam: x.naam, eenheid: x.eenheid || "", q: num(x.hoeveelheid), afdeling: x.afdeling || "Andere", voor: new Set(), extra: true, af: !!x.afgevinkt, voorraad: false});
  for (const e of out){
    const k = S.koppeling[e.sleutel];
    e.koppeling = k || null;
    e.product = k ? product(k.product_id) : null;
    if (e.product){ e.afdeling = e.product.afdeling || e.afdeling; e.pak = K.verpakkingen(e.q, e.eenheid, e.product); }
  }
  return out;
}

/* ================= Weergave ================= */
function render(){
  const eten = ["menu", "gerechten", "lijst"].includes(S.tab);
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", (b.dataset.tab === S.tab || ("eten" in b.dataset && eten)) ? "page" : "false"));
  $("#weeknav").hidden = ["gerechten", "vandaag", "lijsten"].includes(S.tab) || (S.tab === "budget" && S.budgetView === "rekeningen");
  document.body.classList.toggle("breed", window.innerWidth >= 1000 && (S.tab === "menu" || S.tab === "budget" || S.tab === "vandaag" || (S.tab === "agenda" && S.agendaView === "maand")));
  const z = plus(S.week, 6);
  $("#w-lbl").innerHTML = S.tab === "budget" && S.bmaand ? `<b>${MAANDNAAM(S.bmaand)}</b>` : S.tab === "agenda" && S.agendaView === "maand" ? `<b>${MAANDEN[S.maand.getMonth()]} ${S.maand.getFullYear()}</b>`
    : `<b>Week ${weeknr(S.week)}</b> · ${S.week.getDate()} ${MND[S.week.getMonth()]} – ${z.getDate()} ${MND[z.getMonth()]}`;
  $("#modus").textContent = db && db.label ? db.label : "";
  ({vandaag: viewVandaag, agenda: viewAgenda, menu: viewMenu, gerechten: viewGerechten, lijst: viewLijst, lijsten: viewLijsten, budget: viewBudget})[S.tab]();
  if (eten) $("#view").insertAdjacentHTML("afterbegin", `<div class="seg eten-seg" role="group" aria-label="Eten">${[["menu", "Weekmenu"], ["gerechten", "Gerechten"], ["lijst", "Boodschappen"]].map(([k, l]) => `<button data-tab="${k}" aria-pressed="${S.tab === k}">${l}</button>`).join("")}</div>`);
}

function demoBanner(){
  return db.demo ? `<div class="banner"><b>Testversie</b> met jullie ${S.gerechten.length} recepten uit FamilyWall en 198 Collect&Go-producten. Wijzigingen blijven enkel in deze browser. Live meekijken en offline afvinken werken pas in de echte versie.</div>` : "";
}

function viewMenu(){
  const momenten = MOMENTEN.filter(([k]) => S.momenten.includes(k));
  const gepland = S.menu.filter(m => m.moment === "avond").length;
  const items = lijstItems().filter(i => !i.voorraad);
  const open = items.filter(i => !i.af).length;
  const vandaag = iso(new Date());
  const breed = document.body.classList.contains("breed");
  $("#view").innerHTML = demoBanner() + `<div class="menu-grid"><div>
    <div class="samenvatting">
      <div><span class="getal">${gepland}/7</span> <span class="muted">avonden gepland</span></div>
      <button class="link" data-goto="lijst">${open} boodschappen open →</button>
    </div>
    <div class="dagen">${[0,1,2,3,4,5,6].map(i => {
      const d = plus(S.week, i), ds = iso(d);
      return `<section class="dag ${ds === vandaag ? "is-vandaag" : ""}">
        <div class="dagkop"><span class="dagnaam">${DAGEN[i]}</span><span class="datum">${d.getDate()} ${MND[d.getMonth()]}</span></div>
        <div><div class="slots">${momenten.map(([mo, lbl]) => slotHtml(ds, mo, momenten.length > 1 ? lbl : "")).join("")}</div>${dagAgendaKort(ds)}</div></section>`;
    }).join("")}</div></div>
    ${breed ? `<aside class="zijpaneel" aria-label="Recepten om te slepen"><h2>Recepten</h2>
      <input class="in" id="zijzoek" type="search" placeholder="Zoek en sleep naar een dag" value="${esc(S.zijzoek)}" aria-label="Zoek recept">
      <div class="zijlijst" id="zijlijst"></div></aside>` : ""}</div>`;
  if (breed) zijlijst();
}
function zijlijst(){
  const z = norm(S.zijzoek);
  const rows = S.gerechten.filter(g => !z || norm(g.naam).includes(z)).sort((a, b) => a.naam.localeCompare(b.naam, "nl")).slice(0, 80);
  $("#zijlijst").innerHTML = rows.map(g => `<div class="sleep" draggable="true" data-sleep="${g.id}"><span>${esc(g.naam)}</span><span>${zonderIngr(g) ? "geen ingr." : g.porties + " p."}</span></div>`).join("");
}
function slotHtml(ds, mo, lbl){
  const m = slot(ds, mo), g = m && gerecht(m.gerecht_id), l = lbl ? `<span class="moment">${lbl}</span>` : "";

  if (m && m.vrije_tekst) return `<button class="slot vrij" ${attr} draggable="true">${l}<span class="titel">${esc(m.vrije_tekst)}</span><span class="meta">geen boodschappen</span></button>`;

function viewGerechten(){

  $("#view").innerHTML = demoBanner() + `
    <div class="zoekbalk"><input class="in" id="zoek" type="search" placeholder="Zoek een gerecht of ingrediënt" value="${esc(S.zoek)}" aria-label="Zoek">

function lijstGerechten(){

  const rows = S.gerechten.filter(g => (S.onvolledig ? zonderIngr(g) : (!S.cat || g.categorie === S.cat)) &&
    (!z || norm(g.naam).includes(z) || (g.ingredienten || []).some(i => norm(i.naam).includes(z))))
    .sort((a, b) => a.naam.localeCompare(b.naam, "nl"));

      <span class="onder">${zonderIngr(g) ? `<span class="tag let">Geen ingrediënten</span>` : `<span class="tag">${g.ingredienten.length} ingrediënten</span>`}

    : `<div class="leegstaat">${S.gerechten.length ? "Geen gerechten gevonden." : "Nog geen gerechten. Voeg jullie eerste gerecht toe met <b>+ Nieuw</b>."}</div>`;
}

function viewLijst(){

  const zichtbaar = l => l.filter(i => !(S.verberg && i.af));
  const groepen = [...AFD, ...new Set(kopen.map(i => i.afdeling).filter(a => !AFD.includes(a)))]
    .map(a => [a, zichtbaar(kopen.filter(i => i.afdeling === a)).sort((x, y) => x.naam.localeCompare(y.naam, "nl"))]).filter(([, l]) => l.length);
  $("#view").innerHTML = demoBanner() + `

      <div><span class="getal">${open.length}</span> <span class="muted">van ${kopen.length} nog te kopen</span></div>

    </div>
    ${groepen.length ? groepen.map(([a, l]) => `<div class="groep"><h3><span>${esc(a)}</span></h3>${l.map(itemHtml).join("")}</div>`).join("")

    ${voorraad.length ? `<details class="groep voorraad"><summary><h3><span>Voorraadkast nakijken (${voorraad.length})</span></h3></summary>${zichtbaar(voorraad).sort((x, y) => x.naam.localeCompare(y.naam, "nl")).map(itemHtml).join("")}</details>` : ""}
    <div class="groep"><h3><span>Iets extra toevoegen</span></h3>
      <form class="extra-form" id="extra-form">
        <input class="in" id="x-naam" placeholder="bv. wc-papier, 6 flessen water" aria-label="Wat" required>
        <select class="in" id="x-afd" aria-label="Afdeling">${AFD.map(a => `<option ${a === "Andere" ? "selected" : ""}>${a}</option>`).join("")}</select>

}
function itemHtml(i){
  const voor = i.voor.size ? `<span class="voor">voor ${esc([...i.voor].join(", "))}</span>` : "";
  let prod = "", knop = "";
  if (i.product){
    prod = `<span class="prod"><span class="pn">${i.pak && i.pak.aantal ? i.pak.aantal + "× " : ""}${esc(i.product.naam)}</span>${i.pak && i.pak.kost != null ? `<span class="pr">${eur(i.pak.kost)}${i.pak.aantal == null && i.pak.label ? " · " + esc(i.pak.label) : ""}</span>` : ""}<a href="${K.zoekLink(i.product.naam)}" target="_blank" rel="noopener">C&amp;G</a></span>`;
    knop = `<button class="kp ${i.koppeling.bevestigd ? "" : "voorstel"}" data-koppel="${esc(i.sleutel)}">${i.koppeling.bevestigd ? "Wijzig" : "Klopt?"}</button>`;
  } else if (!i.voorraad){
    knop = i.koppeling ? `<button class="kp" data-koppel="${esc(i.sleutel)}">Geen product</button>` : `<button class="kp voorstel" data-koppel="${esc(i.sleutel)}">Koppel</button>`;
  }
  return `<div class="item ${i.af ? "af" : ""}"><label>
      <input type="checkbox" data-check="${esc(i.key)}" ${i.af ? "checked" : ""}>
      <span class="qty">${fmtQty(i.q, i.eenheid)}</span>
      <span class="wat">${esc(i.naam)}${i.extra ? ` <span class="tag">extra</span>` : ""}${voor}${prod}</span>
    </label><div class="rechts">${knop}${i.extra ? `<button class="del" data-delextra="${i.id}" aria-label="Verwijder ${esc(i.naam)}">×</button>` : ""}</div></div>`;
}

/* ================= Panelen ================= */
function openPaneel(html, init){ $("#paneel").innerHTML = html; $("#sheet").hidden = false; document.body.style.overflow = "hidden"; $("#paneel").scrollTop = 0; if (init) init(); const f = $("#paneel [autofocus]"); if (f) f.focus(); }
function sluitPaneel(){ $("#sheet").hidden = true; $("#paneel").innerHTML = ""; $("#paneel").onclick = $("#paneel").oninput = $("#paneel").onchange = $("#paneel").onsubmit = null; document.body.style.overflow = ""; }

function openKiezer(ds, mo){
  const m = slot(ds, mo), d = new Date(ds + "T12:00:00"), dag = DAGEN[(d.getDay() + 6) % 7];
  const molbl = (MOMENTEN.find(x => x[0] === mo) || [, mo])[1].toLowerCase();
  let porties = (m && m.porties) || S.porties, zoek = "";
  const lijst = () => {
    const z = norm(zoek);
    const rows = S.gerechten.filter(g => !z || norm(g.naam).includes(z)).sort((a, b) => a.naam.localeCompare(b.naam, "nl"));
    $("#k-lijst").innerHTML = rows.map(g => `<button class="keuze ${m && m.gerecht_id === g.id ? "sel" : ""}" data-kies="${g.id}"><span>${esc(g.naam)}${zonderIngr(g) ? "<small>geen ingrediënten: komt niet op de lijst</small>" : ""}</span><span>recept ${g.porties} p.</span></button>`).join("")
      || `<div class="leegstaat">Geen gerecht gevonden. Maak het aan via Gerechten.</div>`;
  };
  openPaneel(`
    <div class="paneel-kop"><h2>${dag} ${d.getDate()} ${MND[d.getMonth()]} · ${molbl}</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    ${dagAgendaKort(ds) ? `<div class="kiezer-agenda"><span class="lbl-klein">Die dag</span>${dagAgendaKort(ds)}</div>` : ""}
    <div class="stack">
      <div class="veld"><label>Aantal personen</label>
        <div class="stepper"><button class="ib" data-p="-1" aria-label="Minder">−</button><output id="k-p">${porties}</output><button class="ib" data-p="1" aria-label="Meer">+</button></div></div>
      <input class="in" id="k-zoek" type="search" placeholder="Zoek gerecht" aria-label="Zoek gerecht" autofocus>
    </div>
    <div class="keuzes" id="k-lijst"></div>
    <div class="veld" style="margin-top:14px"><label for="k-vrij">Of vrije tekst (geen boodschappen)</label>
      <div class="zoekbalk"><input class="in" id="k-vrij" placeholder="Restjes, uit eten …" value="${esc(m && !m.gerecht_id ? m.vrije_tekst : "")}"><button class="knop sec" data-vrij>Bewaar</button></div></div>
    <div class="voet">${m ? `<button class="knop gevaar links" data-leeg>Leegmaken</button>` : ""}<button class="knop sec" data-sluit>Sluiten</button></div>`, lijst);

  const p = $("#paneel");
  p.oninput = e => { if (e.target.id === "k-zoek"){ zoek = e.target.value; lijst(); } };
  p.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.p){ porties = Math.max(1, Math.min(40, porties + +t.dataset.p)); $("#k-p").textContent = porties; if (m) run(async () => { await db.setSlot(ds, mo, {...m, porties}); await herlaadWeek(); render(); }); }
    else if (t.dataset.kies) run(async () => { await db.setSlot(ds, mo, {gerecht_id: t.dataset.kies, porties}); S.porties = porties; pref.set("porties", porties); await herlaadWeek(); sluitPaneel(); render(); toast("Ingepland"); });
    else if ("vrij" in t.dataset){ const v = $("#k-vrij").value.trim(); if (!v) return toast("Vul eerst een tekst in");
      run(async () => { await db.setSlot(ds, mo, {vrije_tekst: v, porties}); await herlaadWeek(); sluitPaneel(); render(); }); }
    else if ("leeg" in t.dataset) run(async () => { await db.clearSlot(ds, mo); await herlaadWeek(); sluitPaneel(); render(); toast("Leeggemaakt"); });
  };
}

    <h3 style="font-size:1rem;margin:16px 0 6px">Inplannen deze week (avond, ${S.porties} p.)</h3>

const opties = (lijst, sel) => lijst.map(x => `<option value="${esc(x)}" ${x === (sel || "") ? "selected" : ""}>${esc(x || "–")}</option>`).join("");
function irowHtml(i = {}){
  const eenh = EENH.includes(i.eenheid || "") ? EENH : [...EENH, i.eenheid];
  return `<div class="irow">
    <input class="in i-qty" inputmode="decimal" placeholder="Hoev." aria-label="Hoeveelheid" value="${esc(i.hoeveelheid == null ? "" : fmtNum(i.hoeveelheid, 3))}">

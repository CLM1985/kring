<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="app/favicon.png">

<meta name="mobile-web-app-capable" content="yes">

</head><body>

<title>Kring</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: één kolom, sticky kop met weekwissel, vaste tabbalk onderaan (gsm-eerst); op brede schermen weekmenu + receptenpaneel naast elkaar */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e8ece7; --fg:#18231f; --muted:#5b6a64; --line:#d5ddd8;
  --primary:#24493f; --primary-fg:#ffffff; --accent:#c48a1f; --accent-soft:#f6ead2; --danger:#a8382c; --drop:#dcebe4; --c-in:#2f6fb5; --c-uit:#c4661f;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a2320; --sunk:#222d29; --fg:#e6ece9; --muted:#9aaba4; --line:#2e3b36;
  --primary:#8cc2b0; --primary-fg:#0f1a16; --accent:#e2ab4b; --accent-soft:#3a2f1a; --danger:#e67c6e; --drop:#24403a; --c-in:#4f8ed6; --c-uit:#d0783a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a2320; --sunk:#222d29; --fg:#e6ece9; --muted:#9aaba4; --line:#2e3b36;
  --primary:#8cc2b0; --primary-fg:#0f1a16; --accent:#e2ab4b; --accent-soft:#3a2f1a; --danger:#e67c6e; --drop:#24403a; --c-in:#4f8ed6; --c-uit:#d0783a; color-scheme:dark }

[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.breed .wrap{max-width:1180px}

/* Kop */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.merk{font-family:var(--font-display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;color:var(--primary)}
.merk small{font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--muted);margin-left:6px;letter-spacing:0}
.weeknav{display:flex;align-items:center;gap:4px;margin-left:auto}
.weeknav .lbl{font-variant-numeric:tabular-nums;font-size:.92rem;text-align:center;padding:0 4px}
.weeknav .lbl b{font-family:var(--font-display)}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;height:36px;padding:0 8px}
.ib:hover{border-color:var(--primary)}
.weeknav[hidden] + #meer{margin-left:auto}

main{padding-block:16px 110px}

/* Tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);max-width:860px}
.tabs .wrap:has(> [data-tab="budget"][hidden]){grid-template-columns:repeat(5,1fr)}
@media (max-width:400px){ .tabs button{font-size:.78rem;padding-inline:2px} }
.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--primary);border-top-color:var(--accent);font-weight:700}

/* Algemeen */
.knop{border:0;border-radius:8px;padding:10px 16px;background:var(--primary);color:var(--primary-fg);font-weight:700}
.knop.sec{background:var(--sunk);color:var(--fg)}
.knop.klein{padding:6px 10px;font-size:.88rem}
.knop.gevaar{background:none;color:var(--danger);border:1px solid var(--danger)}
.knop.gevaar.zeker{background:var(--danger);color:#fff}
.link{border:0;background:none;color:var(--primary);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
.veld{display:flex;flex-direction:column;gap:4px;min-width:0}
.veld label,.lbl-klein{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
textarea.in{min-height:110px;resize:vertical}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;font-size:.9rem;margin-bottom:14px}
.tag{font-size:.7rem;background:var(--sunk);border-radius:4px;padding:1px 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;white-space:nowrap}
.tag.let{background:var(--accent-soft);color:var(--fg)}

/* Weekmenu */
.menu-grid{display:grid;grid-template-columns:1fr;gap:20px}
body.breed .menu-grid{grid-template-columns:minmax(0,1fr) 340px}
.samenvatting{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.samenvatting .getal{font-family:var(--font-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.dagen{display:flex;flex-direction:column;gap:10px}
.dag{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:start}
.dagkop{padding-top:10px;display:flex;flex-direction:column;gap:2px}
.dagnaam{font-family:var(--font-display);font-weight:700}
.datum{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dag.is-vandaag .dagnaam{color:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;min-width:0}
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;border-radius:var(--r);padding:10px 12px;border:1px solid var(--line);background:var(--surface);min-width:0;box-sizing:border-box}
.slot .moment{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.slot .titel{font-weight:700;overflow-wrap:anywhere}
.slot .meta{font-size:.85rem;color:var(--muted)}
.slot.leeg{border-style:dashed;background:transparent;color:var(--muted)}
.slot.vrij .titel{font-style:italic;font-weight:400}
.slot:hover{border-color:var(--primary)}
.slotwrap{position:relative;min-width:0}
.met-mic{position:relative;min-width:0}
.met-mic .in{padding-right:44px;width:100%}
.mic{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:transparent;font-size:1.05rem;cursor:pointer;color:var(--muted)}
.mic.aan{background:var(--danger);color:#fff;animation:mic-puls 1.2s ease-in-out infinite}
@keyframes mic-puls{50%{opacity:.6}}
.umh-form{display:grid;grid-template-columns:1fr auto;gap:8px}
.umh-lijst{list-style:none;margin:10px 0 0;padding:0}
.umh-lijst li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}
.umh-tekst{flex:1 1 12rem;min-width:0;overflow-wrap:anywhere}
.umh-acties{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.umh-acties .chip{padding:4px 10px;font-size:.82rem}
.verj-melding{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.verj-melding span{border:1px solid var(--accent, var(--line));border-radius:999px;padding:6px 12px;font-size:.92rem;background:var(--card, transparent)}
.snelkeuze,.vs-snel{margin:0}
.vs-snel{flex-basis:100%;padding:6px 0 2px}
.slotwrap .slot{padding-right:40px}
.slot-x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1rem;line-height:1;cursor:pointer}
.slot-x:hover,.slot-x:focus-visible{background:var(--line);color:var(--fg)}
.slot.over{background:var(--drop);border-color:var(--primary);border-style:solid}
.slot[draggable="true"]{cursor:grab}

.zijpaneel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 200px);display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px}
.zijpaneel h2{font-size:1rem}
.zijlijst{overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.sleep{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);cursor:grab;font-size:.92rem;display:flex;justify-content:space-between;gap:8px}
.sleep:active{cursor:grabbing}
.sleep span:last-child{color:var(--muted);font-size:.8rem;white-space:nowrap}

/* Gerechten */
.zoekbalk{display:flex;gap:8px;margin-bottom:10px}
.zoekbalk .in{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.chip.let[aria-pressed="false"]{border-color:var(--accent)}
.kaarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kaart{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kaart:hover{border-color:var(--primary)}
.kaart .titel{font-family:var(--font-display);font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.kaart .meta{font-size:.85rem;color:var(--muted)}
.kaart .onder{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.kaart .gepland{font-size:.8rem;color:var(--accent);font-weight:700}
.leegstaat{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--muted)}
.telling{font-size:.85rem;color:var(--muted);margin:-6px 0 10px}

/* Boodschappen */
.item .prod .tag{white-space:normal;max-width:100%;overflow-wrap:anywhere}
.groep.inhuis summary{cursor:pointer;list-style:none}.groep.inhuis .item .wat{opacity:.85}
.klein-uitleg{font-size:.85rem;margin:2px 0 8px}
.acties{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toggle{display:flex;align-items:center;gap:6px;font-size:.92rem}
.groep{margin-bottom:16px}
.groep h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:var(--font-body);font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px;display:flex;justify-content:space-between;gap:8px}
.item{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.item label{display:grid;grid-template-columns:24px 78px 1fr;align-items:baseline;gap:8px;padding:10px 0;flex:1;min-width:0;cursor:pointer}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);align-self:center}
.item .qty{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.item .wat{min-width:0;overflow-wrap:anywhere}
.item .voor{display:block;font-size:.8rem;color:var(--muted)}
.item .prod{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:.84rem;margin-top:2px}
.item .prod .pn{color:var(--fg)}
.item .prod .pr{font-variant-numeric:tabular-nums;color:var(--muted)}
.item.af .wat,.item.af .qty{text-decoration:line-through;color:var(--muted)}
.item .rechts{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .del{border:0;background:none;color:var(--muted);font-size:1.2rem;width:32px;height:32px}
.item .kp{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:.78rem;padding:3px 7px;white-space:nowrap}
.item .kp.voorstel{border-color:var(--accent)}
.extra-form{display:grid;grid-template-columns:1fr 180px auto;gap:8px;margin-top:8px}
.kost{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums}
details.voorraad summary{cursor:pointer;list-style:none}
details.voorraad summary::-webkit-details-marker{display:none}
details.voorraad summary h3::after{content:"tonen";font-weight:400;text-transform:none;letter-spacing:0;color:var(--primary)}
details.voorraad[open] summary h3::after{content:"verbergen"}

/* Paneel (sheet) */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,20,16,.45);display:flex;align-items:flex-end;justify-content:center}
.paneel{background:var(--bg);width:100%;max-width:700px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
@media (min-width:700px){.sheet{align-items:center}.paneel{border-radius:16px}}
.paneel-kop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.paneel-kop h2{font-size:1.25rem;flex:1;min-width:0}
.rij{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rij.drie{grid-template-columns:2fr 1fr 1fr}
.stack{display:flex;flex-direction:column;gap:10px}
.voet{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.voet .links{margin-right:auto}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:2.2em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.keuzes{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.keuze{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px}
.keuze.sel{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.keuze span:last-child{color:var(--muted);font-size:.85rem;white-space:nowrap}
.keuze small{display:block;color:var(--muted)}

.irows{display:flex;flex-direction:column;gap:8px}
.irow{display:grid;grid-template-columns:72px 96px 1fr 150px 32px;gap:6px;align-items:center}
.irow .del{border:0;background:none;color:var(--muted);font-size:1.2rem}
.ikop{display:grid;grid-template-columns:72px 96px 1fr 150px 32px;gap:6px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ilijst{list-style:none;padding:0;margin:0;display:flex;flex-direction:column}
.ilijst li{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ilijst .q{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.ilijst .n small{color:var(--muted)}
.omschr{white-space:pre-wrap;color:var(--muted);margin:0 0 12px;max-width:65ch}
.daglijst{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
@media (max-width:620px){
  .irow{grid-template-columns:64px 88px 1fr 32px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .irow .i-naam{grid-column:1 / 4;grid-row:1}
  .irow .del{grid-column:4;grid-row:1}
  .irow .i-qty{grid-row:2}
  .irow .i-eenh{grid-row:2}
  .irow .i-afd{grid-column:3 / 5;grid-row:2}
  .ikop{display:none}
  .rij.drie{grid-template-columns:1fr 1fr}
  .rij.drie .veld:first-child{grid-column:1 / 3}
  .extra-form{grid-template-columns:1fr auto}
  .extra-form select{grid-column:1 / 3;grid-row:2}
  .dag{grid-template-columns:1fr;gap:4px}
  .dagkop{flex-direction:row;gap:8px;align-items:baseline;padding-top:0}
}

/* Agenda */
.ag-kop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);font-weight:700}
.ag-chips .chip{display:inline-flex;align-items:center;gap:6px}
.ag-chips .chip[aria-pressed="true"]{background:var(--surface);color:var(--fg);border-color:var(--k)}
.ag-chips .chip[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.dot{width:10px;height:10px;border-radius:50%;background:var(--k);display:inline-block;flex:none}
.ag-aandacht{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;padding:10px;border-radius:var(--r);background:var(--accent-soft)}
.ag-lijst{display:flex;flex-direction:column;gap:4px;min-width:0}
.ag-item{display:flex;align-items:center;gap:8px;border-left:4px solid var(--k);background:var(--surface);border-radius:0 8px 8px 0;min-width:0}
.ag-item.heledag{background:color-mix(in srgb, var(--k) 14%, var(--surface))}
.ag-item.klaar .ag-titel{text-decoration:line-through;color:var(--muted)}
.ag-item .ag-vink{width:20px;height:20px;margin-left:8px;accent-color:var(--primary);flex:none}
.ag-knop{border:0;background:none;text-align:left;padding:8px 10px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;flex:1;min-width:0}
.ag-knop:disabled{cursor:default;color:inherit}
.ag-tijd{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;min-width:3.2em}
.ag-titel{overflow-wrap:anywhere}
.ag-meta{flex-basis:100%;font-size:.82rem;color:var(--muted)}
.ag-dag .dagkop{position:relative}
.ag-plus{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:28px;height:28px;margin-top:4px}
.ag-leeg{border:1px dashed var(--line);background:none;border-radius:8px;padding:8px 10px;color:var(--muted);text-align:left}
.ag-kort{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--muted);margin-top:6px}
.ag-kort span{border-left:3px solid var(--k);padding-left:5px}
.ag-kort .klaar{text-decoration:line-through}
.maand{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mkop,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mkop span{padding:6px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.mcel{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;min-height:92px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.mcel:nth-child(7n){border-right:0}
.mcel.buiten{background:var(--bg);color:var(--muted)}
.mcel.vandaag .mnr{background:var(--accent);color:#fff;border-radius:99px;padding:0 6px}
.mnr{font-size:.85rem;font-weight:700;align-self:flex-start}
.mitems{display:flex;flex-direction:column;gap:2px;min-width:0}
.mi{font-size:.72rem;border-left:3px solid var(--k);padding-left:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.hd{background:color-mix(in srgb, var(--k) 16%, transparent)}
.mmeer{font-size:.7rem;color:var(--muted)}
.mdots{display:none;gap:3px;flex-wrap:wrap}

<script>/* Kring – snel noteren ("Uit mijn hoofd"), inspreken, snelkeuzes en verjaardagsmelding */
/* Rol "tiener": eigen account, maar geen budget (de database weigert het ook) */
function zietBudget(){ try { const me = S.leden.find(l => l.id === S.ik); return !me || me.rol !== "tiener"; } catch(e){ return true; } }
document.addEventListener("change", e => {
  const c = e.target.closest && e.target.closest("[data-budgetlid]"); if (!c) return;
  run(async () => { await db.zetBudgettoegang(c.dataset.budgetlid, c.checked); await herlaadAgenda(); openInstellingen(); toast(c.checked ? "Budget zichtbaar" : "Budget verborgen"); });
});
const SNELKEUZES = ["Restjes", "Frietjes", "Takeaway", "Uit eten", "Feestje", "Soep"];
const UMH_NAAM = "Uit mijn hoofd";

/* Boodschappen: "melk, wc-papier en tomaten" → 3 regels */
function splitsBoodschappen(t){
  return String(t || "").split(/\s*(?:,|;|\n|\ben\b|\bplus\b)\s*/i).map(x => x.trim().replace(/[.!?]+$/, "")).filter(x => x.length > 0).slice(0, 30);
}

/* ---------- Inspreken (spraakherkenning van de browser) ---------- */
const SPRAAK = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let spraakNu = null;
function micKnop(id, auto){ return SPRAAK ? `<button type="button" class="mic" data-mic="${id}" ${auto ? "data-micauto" : ""} aria-label="Inspreken" title="Inspreken">🎤</button>` : ""; }
function spraakStop(){ if (spraakNu){ try { spraakNu.rec.stop(); } catch(e){} } }
function spraakStart(knop){
  const veld = document.getElementById(knop.dataset.mic); if (!veld) return;
  if (spraakNu){ const zelfde = spraakNu.knop === knop; spraakStop(); if (zelfde) return; }
  const rec = new SPRAAK(); rec.lang = "nl-BE"; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.continuous = !/Android/i.test(navigator.userAgent);   // Android: één zin, stopt vanzelf (continuous is daar onbetrouwbaar)
  const basis = veld.value.trim() ? veld.value.trim() + " " : "";
  let vast = "", fout = false, gehoord = false;
  rec.onstart = () => toast("Luisteren… spreek nu");
  rec.onresult = e => { let tijdelijk = ""; for (let k = e.resultIndex; k < e.results.length; k++){ const r = e.results[k]; if (r.isFinal) vast += r[0].transcript; else tijdelijk += r[0].transcript; }
    gehoord = true; veld.value = (basis + vast + tijdelijk).replace(/\s+/g, " ").trimStart(); veld.dispatchEvent(new Event("input", { bubbles: true })); };
  rec.onerror = e => { const m = { "not-allowed": "Geef Kring toegang tot de microfoon", "service-not-allowed": "Inspreken is hier niet beschikbaar", "no-speech": "Niets gehoord", "network": "Inspreken heeft internet nodig", "audio-capture": "Geen microfoon gevonden of hij is in gebruik", "language-not-supported": "Nederlands wordt hier niet ondersteund" }[e.error];
    fout = true; if (e.error !== "aborted") toast(m || `Inspreken lukt niet (${e.error})`); };
  rec.onend = () => { if (!gehoord && !fout) toast("Niets gehoord. Tik op 🎤 en spreek meteen");
    knop.classList.remove("aan"); knop.setAttribute("aria-pressed", "false"); if (spraakNu && spraakNu.rec === rec) spraakNu = null;
    const f = veld.form;
    if (gehoord && "micauto" in knop.dataset && f && veld.value.trim()) { f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true })); }   // inspreken = meteen bewaren
    else if (!/Android|iPhone|iPad/i.test(navigator.userAgent)) veld.focus();   // op gsm geen toetsenbord laten opspringen
  };
  try { rec.start(); } catch(e){ return toast("Inspreken lukt niet"); }
  spraakNu = { rec, knop }; knop.classList.add("aan"); knop.setAttribute("aria-pressed", "true");
}
document.addEventListener("click", e => { const b = e.target.closest("[data-mic]"); if (b){ e.preventDefault(); spraakStart(b); } });

/* ---------- Uit mijn hoofd: privé notities per gezinslid ---------- */
function umhLijst(){ const me = ik(); return S.lijsten.find(l => l.naam === UMH_NAAM && l.prive && me && l.eigenaar === me.id); }
async function umhZorgLijst(){
  let l = umhLijst(); if (l) return l;
  const id = await db.bewaarLijst({ naam: UMH_NAAM, soort: "lijst", prive: true, vast: false, eigenaar: ik().id });
  await herlaadGezin(); return S.lijsten.find(x => x.id === id) || umhLijst();
}
function umhKaart(kaart){
  const l = umhLijst(), items = l ? l.items.filter(i => !i.klaar) : [];
  const naar = (k, t) => `<button class="chip" data-umhnaar="${k}">${t}</button>`;
  return kaart(`Uit mijn hoofd${items.length ? ` <span class="muted" style="font-weight:400">(${items.length})</span>` : ""}`, `
    <form class="umh-form" id="umh-form"><div class="met-mic"><input class="in" id="umh-in" placeholder="Iets dat je niet wilt vergeten…" maxlength="300" autocomplete="off" aria-label="Snel noteren">${micKnop("umh-in", true)}</div><button class="knop" aria-label="Noteren">+</button></form>
    ${items.length ? `<ul class="umh-lijst">${items.map(i => `<li data-umh="${i.id}"><span class="umh-tekst">${esc(i.tekst)}</span><span class="umh-acties">${naar("taak", "Taak")}${naar("boodschap", "Boodschap")}${naar("afspraak", "Afspraak")}<button class="ib" data-umhweg aria-label="Wegdoen" title="Wegdoen">🗑</button></span></li>`).join("")}</ul>`
      : `<p class="muted" style="font-size:.86rem;margin:8px 0 0">Typ of tik op 🎤: wat je inspreekt, wordt meteen bewaard. Enkel jij ziet dit.</p>`}`);
}
document.addEventListener("submit", e => {
  if (e.target.id !== "umh-form") return;
  e.preventDefault(); spraakStop();
  const v = $("#umh-in").value.trim(); if (!v) return $("#umh-in").focus();
  run(async () => { const l = await umhZorgLijst(); await db.bewaarItem(l.id, { tekst: v, klaar: false, lid_id: null, deadline: null }); await herlaadGezin(); render(); toast("Genoteerd"); });
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-umhnaar],[data-umhweg]"); if (!b) return;
  const l = umhLijst(), id = b.closest("[data-umh]").dataset.umh, it = l && l.items.find(x => x.id === id); if (!it) return;
  const weg = async () => { await db.verwijderItem(l.id, id); await herlaadGezin(); };
  if ("umhweg" in b.dataset) return run(async () => { await weg(); render(); toast("Weggedaan"); });
  const v = leesSnel(it.tekst), vd = AG.iso(new Date());
  if (b.dataset.umhnaar === "taak") openTaak(null, v.datum || vd, { titel: v.titel || it.tekst, naBewaren: weg });
  else if (b.dataset.umhnaar === "afspraak") openAfspraak(null, v.datum || vd, { titel: v.titel || it.tekst, naBewaren: weg });
  else run(async () => { for (const naam of splitsBoodschappen(it.tekst)) await db.addExtra(iso(S.pweek), { naam, afdeling: K.afdelingVoor(naam) });
    await weg(); await herlaadWeek(); render(); toast(`Op de boodschappenlijst van ${pwLabel()}`); });
});

/* Snelkoppeling "Inspreken" (icoon ingedrukt houden of op het startscherm): ./?actie=inspreken */
function snelInspreken(){

  S.tab = "vandaag"; render();

/* ---------- Verjaardag binnen 7 dagen: melding bovenaan Vandaag ---------- */
function verjMelding(verj){
  const kort = (verj || []).filter(x => x.n.dagen <= 7); if (!kort.length) return "";
  const wanneer = d => d === 0 ? "Vandaag" : d === 1 ? "Morgen" : `Over ${d} dagen`;
  return `<div class="verj-melding" role="status">${kort.map(({ v, n }) => `<span>🎂 ${wanneer(n.dagen)} ${n.dagen === 0 ? "is" : "is"} <b>${esc(v.naam)}</b> jarig${n.leeftijd ? ` (wordt ${n.leeftijd})` : ""}</span>`).join("")}</div>`;
}

<script>/* Kring – ingrediëntregels lezen, eenheden normaliseren en producten voorstellen.

(function (root) {

  const EENHEID = {

    klontje: ["klontje", 1], klont: ["klontje", 1], handje: ["handje", 1], toefje: ["toefje", 1],
    vel: ["stuk", 1], rol: ["stuk", 1], flesje: ["fles", 1], fles: ["fles", 1]
  };

  const BASIS = { g: ["g", 1], kg: ["g", 1000], ml: ["ml", 1], cl: ["ml", 10], dl: ["ml", 100], l: ["ml", 1000] };

  const TEL = new Set(["stuk", "teentje", "blik", "pak", "zakje", "blokje", "bos", "sneetje", "stengel", "bol", "plantje", "potje", "bakje", "fles", ""]);

  const VAAG = new Set(["snuifje", "scheutje", "klontje", "handje", "toefje", "takje"]);

  // Basisvoorraad: komt op de lijst onder 'Voorraadkast nakijken'
  const VOORRAAD = ["zout", "peper", "zwarte peper", "witte peper", "olie", "olijfolie", "zonnebloemolie", "arachideolie", "plantaardige olie",
    "water", "boter", "bloem", "suiker", "azijn", "natuurazijn", "nootmuskaat", "paprikapoeder", "currypoeder", "oregano", "tijm",
    "laurier", "rozemarijn", "basilicum (gedroogd)", "kipkruiden", "italiaanse kruiden", "provençaalse kruiden", "cayennepeper",
    "mosterd", "ketchup", "mayonaise", "honing", "bakpapier", "chiliflakes", "kruidnagel", "bicarbonaat"];

  // Regels die geen ingrediënt zijn
  const RUIS = /^(voor \d+ personen|voorbereiding|bereiding|benodigd|ingrediënten|uit jouw keuken|grillpan|bakpapier|vidé)\b/i;

  const SYN = {
    look: "knoflook", ajuin: "ui", ajuinen: "ui", uien: "ui", "gele ui": "ui", "rode uien": "rode ui",
    wortelen: "wortel", wortels: "wortel", worteltjes: "wortel", tomaten: "tomaat", eieren: "ei", "verse eieren": "ei",
    "paprika's": "paprika", "rode paprika's": "rode paprika", courgettes: "courgette", kipfilets: "kipfilet", "kippenfilet": "kipfilet",
    aardappels: "aardappelen", patatten: "aardappelen", "loskokende aardappelen": "bloemige aardappelen", "aardappel": "aardappelen",
    krielaardappelen: "krieltjes", preien: "prei", sjalotten: "sjalot",
    "parmezaanse kaas": "parmezaan", "gran moravia": "parmezaan", "kerstomaatjes": "kerstomaten", cherrytomaten: "kerstomaten",
    "minipruimtomaatjes": "kerstomaten", "tomatenblokjes": "tomatenstukjes", "tomatenpulp": "tomatenstukjes", "geraspte kaas": "gemalen kaas",
    "rundsvlees": "stoofvlees rund", "gemengd gehakt (rund/varken)": "gemengd gehakt", "rund-varkensgehakt": "gemengd gehakt"
  };

  const FRAC = { "½": 0.5, "¼": 0.25, "¾": 0.75, "⅓": 1 / 3, "⅔": 2 / 3 };

  function getal(s) {
    if (s == null) return null;
    s = String(s).trim();
    let m = s.match(/^(\d+)\s*([½¼¾⅓⅔])$/); if (m) return +m[1] + FRAC[m[2]];
    if (FRAC[s] != null) return FRAC[s];
    m = s.match(/^(\d+)\/(\d+)$/); if (m) return +m[1] / +m[2];
    m = s.match(/^(\d+)\s*-\s*(\d+)$/); if (m) return +m[2];               // 275-300 → bovengrens
    if (/^\d{1,3}\.\d{3}$/.test(s)) return +s.replace(".", "");            // 1.000 → 1000
    const n = parseFloat(s.replace(/,\s*/, "."));                          // 0,5 / 0, 5 / 1, 5

  }

  const NUM = "(\\d+\\s*[½¼¾⅓⅔]|[½¼¾⅓⅔]|\\d+\\/\\d+|\\d+\\s*-\\s*\\d+|\\d{1,3}\\.\\d{3}|\\d+(?:[.,]\\s?\\d+)?)";
  const UNITS = Object.keys(EENHEID).sort((a, b) => b.length - a.length).map(u => u.replace(/[.()]/g, "\\$&")).join("|");
  const RE_VOOR = new RegExp("^" + NUM + "\\s*(?:x\\s+)?(?:(" + UNITS + ")(?![a-zà-ü]))?\\.?\\s*(.*)$", "i");
  const RE_ACHTER = new RegExp("^(.*?)[:\\s]+" + NUM + "\\s*(" + UNITS + ")?\\.?\\s*$", "i");

  function schoon(naam) {
    return naam.replace(/^[•\-–*]+\s*/, "").replace(/\(\(([^)]*)\)\)/g, "($1)").replace(/\s+/g, " ").replace(/^[,:;\s]+|[,:;\s]+$/g, "").trim();
  }

  /** Lees één tekstregel. Geeft {naam, hoeveelheid, eenheid, notitie} of null bij ruis. */
  function lees(regel) {
    let t = schoon(String(regel || ""));
    if (!t || RUIS.test(t)) return null;
    t = t.replace(/^\+{2,}\s*/, "").replace(/^(evt\.|eventueel( ter garnering)?( met)?|naar smaak)\s+/i, "");
    let q = null, u = "", naam = t, notitie = "";
    let m = t.match(RE_VOOR);
    if (m && m[3] !== undefined && (m[2] || /^[a-zà-ü(]/i.test(m[3]))) {
      q = getal(m[1]); u = m[2] ? EENHEID[m[2].toLowerCase()][0] : ""; naam = m[3];
    } else if ((m = t.match(RE_ACHTER)) && m[1] && !/\d$/.test(m[1])) {
      q = getal(m[2]); u = m[3] ? EENHEID[m[3].toLowerCase()][0] : ""; naam = m[1];
    }
    // "1 teentje knoflook" waar eenheid in de naam zit ("2 teentjes teentjes knoflook")
    const dub = naam.match(new RegExp("^(" + UNITS + ")\\s+(.*)$", "i"));
    if (dub && !u) { u = EENHEID[dub[1].toLowerCase()][0]; naam = dub[2]; }
    else if (dub && EENHEID[dub[1].toLowerCase()][0] === u) naam = dub[2];
    // Notitie na komma ("1 ui, fijngesneden") of tussen haakjes aan het einde
    const k = naam.match(/^(.*?),\s*(.+)$/);
    if (k && !/^\d/.test(k[2])) { naam = k[1]; notitie = k[2]; }
    const h = naam.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
    if (h && h[1]) { naam = h[1]; notitie = [h[2], notitie].filter(Boolean).join(", "); }
    naam = naam.replace(/\s+(in stukken|fijngesneden|fijngehakt|fijngesnipperd|hardgekookt|verkruimeld|uitgelekt|naar smaak)$/i, m2 => { notitie = notitie || m2.trim(); return ""; });
    naam = schoon(naam);
    if (!naam) return null;
    if (q != null && !u) u = "stuk";
    if (VAAG.has(u)) { notitie = [q != null ? `${fmt(q)} ${u}` : u, notitie].filter(Boolean).join(", "); q = null; u = ""; }
    // Hoofdletter enkel weghalen als het geen eigennaam/merk lijkt ("Tomaat" → "tomaat", "Gran Moravia" blijft)
    if (/^[A-ZÀ-Ü][a-zà-ü]/.test(naam) && !/\s[A-ZÀ-Ü]/.test(naam)) naam = naam.charAt(0).toLowerCase() + naam.slice(1);
    return { naam, hoeveelheid: q, eenheid: u, notitie };
  }

  /** Lees een lijst regels; voegt losse "2 stuks"-regels samen met de vorige naam (FamilyWall-export). */
  function leesLijst(regels) {
    const uit = [];
    for (const r of regels) {
      const s = schoon(r);
      const losseQty = s.match(new RegExp("^" + NUM + "\\s*(" + UNITS + ")?\\.?$", "i"));
      if (losseQty && uit.length && uit[uit.length - 1].hoeveelheid == null) {

        vorige.hoeveelheid = getal(losseQty[1]);
        vorige.eenheid = losseQty[2] ? EENHEID[losseQty[2].toLowerCase()][0] : "stuk";
        continue;
      }
      const i = lees(r); if (i) uit.push(i);
    }
    return uit;
  }

  function sleutel(naam) {
    let s = String(naam || "").toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, " ").trim();
    s = s.replace(/^(verse?|gedroogde?|grote?|kleine?|middelgrote|jonge|biologische|bio)\s+/, "");
    return SYN[s] || s;
  }
  const isVoorraad = naam => { const k = sleutel(naam); return VOORRAAD.includes(k) || /^(zout|peper)( en (zout|peper))?$|zwarte peper$/.test(k); };

  /** Naar basiseenheid (g/ml) waar mogelijk */
  function basis(q, u) { return (q != null && BASIS[u]) ? [q * BASIS[u][1], BASIS[u][0]] : [q, u]; }

  function minuten(s) {
    if (!s) return null;
    const h = s.match(/(\d+)\s*h/), m = s.match(/(\d+)\s*min/);
    const t = (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0);
    return t || null;
  }

  function fmt(n) { return Number(n).toLocaleString("nl-BE", { maximumFractionDigits: 2 }); }

  // ---------- Productkoppeling ----------
  const MERK = /^(boni|everyday|colruyt|belviva|jordans|dallagiovanna|herta|zandvliet|kiri|philadelphia|chaumes|duyvis|lay's|jimmy's|ijsboerke|iglo|wagner|hoogstraten|hass|zespri|del monte gold|go-tan|come a casa|lotus biscoff|arla|pindos|fama|salakis|vache bleue|deliziosa|carlsbourg|bosto|quaker oats express|devos lemmens|maredsous|bh)\s+/i;
  function productKern(naam) {

    room: "culinaire room", kookroom: "culinaire room", "verse groene pesto": "groene pesto", krieltjes: "minikrieltjes",
    "witloof": "witloof extra", "ui": "uien", "rode ui": "rode uien", eieren: "scharrelei", ei: "scharrelei", "bladerdeeg": "bladerdeeg",
    melk: "halfvolle melk", aardappelen: "aardappelen matig vastkokend", "bloemige aardappelen": "aardappelen matig vastkokend" };
  const ALGEMEEN = new Set(["pasta", "saus"]);                       // dan telt het woord ervoor
  const GEEN = new Set(["mix", "kruidenmix", "kruid", "kruiden"]);   // kruidenmixen: geen voorstel
  ZOEK.yoghurt = ZOEK["volle yoghurt"] = "griekse yoghurt natuur";
  const ma = (a, b) => a === b || (Math.min(a.length, b.length) >= 5 && Math.min(a.length, b.length) / Math.max(a.length, b.length) >= 0.75 && (a.startsWith(b) || b.startsWith(a)));

  /** Score-gebaseerd voorstel: top-n producten voor een ingrediëntnaam.
      Het hoofdwoord (laatste woord, bv. 'paprika' in 'rode paprika') moet in het product voorkomen. */
  function stelVoor(ingrNaam, producten, n = 3) {
    const sl = sleutel(ingrNaam);
    const k = woorden(ZOEK[sl] || sl).map(stam);
    if (!k.length) return [];
    let hoofd = k[k.length - 1];
    if (GEEN.has(hoofd) || k.some(w => GEEN.has(w))) return [];
    if (ALGEMEEN.has(hoofd)) { if (k.length < 2) return []; hoofd = k[k.length - 2]; }
    return producten.map(p => {
      const w = woorden(p.kern || productKern(p.naam)).map(stam);
      if (!w.some(b => ma(hoofd, b))) return { p, s: 0 };
      let s = 3;
      for (const a of k.slice(0, -1)) if (w.some(b => ma(a, b))) s += 2;
      if (ma(hoofd, w[0])) s += 1;                       // product begint met het hoofdwoord
      s -= Math.max(0, w.length - k.length) * 0.3;      // korte productnamen lichte voorkeur
      if (!p.beschikbaar) s -= 0.5;
      return { p, s };
    }).filter(x => x.s >= 2).sort((a, b) => b.s - a.s).slice(0, n).map(x => x.p);
  }

  /** Aantal verpakkingen + kost voor een benodigde hoeveelheid (basis-eenheid) */
  function verpakkingen(q, u, p) {
    if (!p) return null;
    if (p.prijs_per === "kg") {                         // los per kg
      if (u === "g" && q != null) return { aantal: null, label: `${fmt(q / 1000)} kg`, kost: p.prijs != null ? (q / 1000) * p.prijs : null };
      return { aantal: null, label: "per kg", kost: null };
    }
    let aantal = 1;
    if (q != null && p.inhoud && p.inhoud_eenheid === u) aantal = Math.max(1, Math.ceil(q / p.inhoud - 1e-9));
    else if (q != null && p.inhoud_eenheid === "stuk" && TEL.has(u)) aantal = Math.max(1, Math.ceil(q / (p.inhoud || 1) - 1e-9));
    else if (q != null && TEL.has(u) && !p.inhoud) aantal = Math.max(1, Math.ceil(q - 1e-9));
    return { aantal, label: `${aantal}×`, kost: p.prijs != null ? aantal * p.prijs : null };
  }

  // ---------- Winkelafdeling voorstellen ----------
  const AFD_RE = [
    [/aardappel|krieltje|\bui\b|uien|sjalot|knoflook|^look|wortel|tomaat|tomaten|paprika|courgette|prei|spinazie|^sla|\bsla$|rucola|komkommer|broccoli|bloemkool|kool|witloof|asperge|champignon|selder|peterselie|basilicum|bieslook|koriander|munt|dille|citroen|limoen|appel|peer|pompoen|avocado|boontjes|sperzie|spruit|lente-ui|chilipeper|jalape|veldsla|waterkers|little gem|ijsberg|ajuin/i, "Groenten & fruit"],
    [/gehakt|kip|varken|rund|steak|worst|chipolata|scampi|garnaal|garnalen|zalm|kabeljauw|vis|tonijn|mignonette|spek|pancetta|chorizo|\bham|prosciutto|serrano|lams|kalkoen|mosselen|merguez|schartong/i, "Vlees & vis"],
    [/kaas|parmezaan|gran moravia|mozzarella|burrata|feta|ricotta|mascarpone|cheddar|gruy/i, "Kaas & charcuterie"],
    [/room|melk|yoghurt|boter|\bei\b|eieren|eierdooier/i, "Zuivel & eieren"],
    [/pasta|spaghetti|penne|tagliatel|fettuc|macaroni|farfalle|orzo|couscous|rijst|risotto|spirelli|linguine|tortiglioni|cellentani|capellini|cappelini|bloem|paneermeel|panko|chips|suiker|havervlok|rozijn|pijnboom|zonnebloempit|noten/i, "Droge voeding"],
    [/wrap|tortilla|pita|brood|ciabatta|stokbro|pizzabodem|bladerdeeg|pasteibak|boterham|pistolet/i, "Brood & bakkerij"],
    [/passata|pulp|tomatenstuk|tomatenblok|puree|bouillon|fond|pesto|mayonaise|ketchup|mosterd|saus|azijn|balsamico|olijven|kappertjes|maïs|kokosmelk|honing|stroop|guacamole|tzatziki|sambal|harissa/i, "Conserven & sauzen"],
    [/kruiden|mix|paprikapoeder|curry|nootmuskaat|oregano|tijm|laurier|rozemarijn|peper|zout|kruidnagel|jeneverbes|ras-el|dragon|marjolein|cayenne|chiliflakes|gist|bicarbonaat|olie/i, "Kruiden & specerijen"],
    [/diepvries|frieten|frietjes|nuggets/i, "Diepvries"],
    [/bier|wijn|whisky|\bwater\b/i, "Dranken"]
  ];
  const afdelingVoor = naam => { const s = sleutel(naam) + " " + String(naam || "").toLowerCase(); return (AFD_RE.find(([re]) => re.test(s)) || [, "Andere"])[1]; };
  const zoekLink = naam => "https://www.collectandgo.be/nl/zoek?searchTerm=" + encodeURIComponent(naam);

  const api = { afdelingVoor, zoekLink, lees, leesLijst, sleutel, isVoorraad, basis, minuten, getal, productKern, stelVoor, verpakkingen, TEL, BASIS, EENHEDEN: [...new Set(Object.values(EENHEID).map(x => x[0]))] };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.KringIngr = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* Kring – agendalogica: herhalingen uitrollen, Belgische feestdagen, Vlaamse schoolvakanties, ICS lezen.
   Datums zijn lokale kalenderdagen als "YYYY-MM-DD", tijden als "HH:MM" (Europe/Brussels).
   Werkt in de browser (window.KringAgenda) en in Node (module.exports). */
(function (root) {
  "use strict";
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dag = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const plus = (s, n) => { const d = dag(s); d.setDate(d.getDate() + n); return iso(d); };
  const verschil = (a, b) => Math.round((dag(b) - dag(a)) / 864e5);
  const weekdag = s => (dag(s).getDay() + 6) % 7 + 1;          // 1 = maandag … 7 = zondag

  /* ---------- Herhaling ----------
     h = { freq: 'dag'|'week'|'maand'|'jaar', interval: 1, dagen: [1..7] (enkel week), tot: 'YYYY-MM-DD'|null }
     Geeft alle startdatums van een reeks die (met hun duur) overlappen met [van, tot]. */
  function voorkomens(start, duurDagen, h, van, tot, uitzonderingen) {
    const uit = new Set(uitzonderingen || []);
    const res = [];
    const ok = d => !uit.has(d) && d <= tot && plus(d, duurDagen) >= van;
    if (!h || !h.freq) { if (ok(start)) res.push(start); return res; }
    const n = Math.max(1, h.interval || 1);
    const einde = h.tot && h.tot < tot ? h.tot : tot;
    if (h.freq === "dag") {
      let d = start;
      const skip = Math.max(0, Math.floor((verschil(start, van) - duurDagen) / n));
      if (skip > 0) d = plus(start, skip * n);
      for (; d <= einde; d = plus(d, n)) if (ok(d)) res.push(d);
    } else if (h.freq === "week") {
      const dagen = (h.dagen && h.dagen.length ? h.dagen : [weekdag(start)]).slice().sort();

    ["2026-02-16", "2026-02-22", "Krokusvakantie"], ["2026-04-06", "2026-04-19", "Paasvakantie"],
    ["2026-05-14", "2026-05-15", "Hemelvaart (vrij)"], ["2026-07-01", "2026-08-31", "Zomervakantie"],
    ["2026-11-02", "2026-11-08", "Herfstvakantie"], ["2026-12-21", "2027-01-03", "Kerstvakantie"],
    ["2027-02-08", "2027-02-14", "Krokusvakantie"], ["2027-03-29", "2027-04-11", "Paasvakantie"],
    ["2027-05-06", "2027-05-07", "Hemelvaart (vrij)"], ["2027-07-01", "2027-08-31", "Zomervakantie"]

  function volgendeVerjaardag(v, vanaf) {

    };

      if (!e) continue;
      const i = r.indexOf(":"); if (i < 0) continue;

      else if (naam === "DESCRIPTION") e.notitie = ont(w);
      else if (naam === "UID") e.uid = w;
      else if (naam === "DTSTART") e.start = tijd(w, p);
      else if (naam === "DTEND") e.einde = tijd(w, p);
      else if (naam === "RRULE") e.rrule = Object.fromEntries(w.split(";").map(x => x.split("=")));
      else if (naam === "EXDATE") w.split(",").forEach(x => { const t = tijd(x, p); if (t) e.exdate.push(t.datum); });

        }

      }

  const p = $("#paneel");
  p.onchange = e => {
    if (e.target.id === "af-wie") run(async () => { await db.zetAfvalLid(id, e.target.value || null); await herlaadAfval(); render(); toast("Bewaard"); });
    if (e.target.id === "af-klaar") run(async () => { await db.vinkAfval(id, e.target.checked); await herlaadAfval(); render(); });
  };
  p.onclick = e => { const b = e.target.closest("button"); if (b && "afval" in b.dataset) openAfval(); };
}
function afVink(cb) {
  const id = cb.dataset.afval, val = cb.checked, it = cb.closest(".ag-item"); if (it) it.classList.toggle("klaar", val);
  run(async () => { await db.vinkAfval(id, val); await herlaadAfval(); if ($("#sheet").hidden) render(); else if ($("#paneel .paneel-kop h2") && $("#paneel .paneel-kop h2").textContent === "Afval") openAfval(); });
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-afvalitem],button[data-afval]"); if (!b || b.closest("#paneel")) return;
  if (b.dataset.afvalitem) openAfvalItem(b.dataset.afvalitem); else openAfval();
});
document.addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.afval && !t.closest("#paneel")) afVink(t); });
</script>
<script>/* Kring – agenda-scherm (R2). Gebruikt de globale hulpfuncties van index.html ($, esc, S, db, run, openPaneel …).
   Wordt vóór het hoofdscript geladen; functies worden pas aangeroepen na de start. */
"use strict";
const AG = window.KringAgenda;
const KLEUREN = ["#2f7a5b", "#3a6ea5", "#b03a48", "#8a4fa3", "#c48a1f", "#1f8a8a", "#b05a2a", "#5b6a64"];
const SYS = [   // ingebouwde kalenders (niet bewaard, enkel aan/uit)
  { id: "sys-taken", naam: "Taken", kleur: "#5b6a64" },
  { id: "sys-verj", naam: "Verjaardagen", kleur: "#c48a1f" },
  { id: "sys-maaltijd", naam: "Maaltijden", kleur: "#24493f" },
  { id: "sys-feest", naam: "Feestdagen BE", kleur: "#b05a2a" },
  { id: "sys-school", naam: "Schoolvakanties VL", kleur: "#8a4fa3" },
  { id: "sys-afval", naam: "Afval", kleur: "#767676" }
];
const HERH = [["", "Niet"], ["dag", "Elke dag"], ["week", "Elke week"], ["week2", "Om de 2 weken"], ["maand", "Elke maand"], ["jaar", "Elk jaar"]];
const HERINNER = [["", "Geen"], ["15", "15 min vooraf"], ["60", "1 uur vooraf"], ["1440", "1 dag vooraf"]];
const KORT = ["ma", "di", "wo", "do", "vr", "za", "zo"];
const MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];

const zichtbaar = id => !S.verborgen.includes(id);
const kalender = id => S.kalenders.find(k => k.id === id) || SYS.find(k => k.id === id) || { naam: "?", kleur: "#5b6a64" };
const lid = id => S.leden.find(l => l.id === id);
const herhTekst = h => !h ? "" : h.freq === "week" && h.interval === 2 ? "om de 2 weken" : ({ dag: "elke dag", week: "elke week", maand: "elke maand", jaar: "elk jaar" })[h.freq] || "";

/* ---------- Items per dag ---------- */
function agendaItems(van, tot) {
  const per = {};
  const voeg = (d, it) => (per[d] = per[d] || []).push(it);
  for (const a of AG.rolUit(S.afspraken.filter(a => zichtbaar(a.kalender_id)), van, tot))
    voeg(a.dag, { soort: "afspraak", id: a.id, voorkomen: a.voorkomen, titel: a.titel, heleDag: a.hele_dag || (a.meerdaags && !a.eersteDag && !a.laatsteDag),
      tijd: a.hele_dag ? "" : (a.eersteDag ? a.start_tijd : (a.laatsteDag ? "tot " + (a.eind_tijd || "") : "")), eind: a.eersteDag && !a.meerdaags ? a.eind_tijd : "",
      kleur: kalender(a.kalender_id).kleur, plaats: a.plaats, wie: (a.deelnemers || []).map(lid).filter(Boolean), herh: !!a.herhaling, ics: a.ics });
  if (zichtbaar("sys-taken"))
    for (const t of AG.rolUit(S.taken.map(t => ({ ...t, datum: t.deadline })), van, tot))
      voeg(t.dag, { soort: "taak", id: t.id, voorkomen: t.voorkomen, titel: t.titel, tijd: t.tijd || "", heleDag: !t.tijd, kleur: (lid(t.lid_id) || {}).kleur || "#5b6a64",
        wie: [lid(t.lid_id)].filter(Boolean), klaar: (t.klaar || []).includes(t.voorkomen), herh: !!t.herhaling, denkt: t.eigenaar_id && t.eigenaar_id !== t.lid_id ? lid(t.eigenaar_id) : null });
  if (zichtbaar("sys-taken"))
    for (const l of S.lijsten || []) for (const i of l.items) if (i.deadline && i.deadline >= van && i.deadline <= tot && (!l.prive || l.eigenaar === S.ik))
      voeg(i.deadline, { soort: "lijstitem", id: l.id + "|" + i.id, titel: i.tekst, tijd: "", heleDag: true, kleur: (lid(i.lid_id) || {}).kleur || "#5b6a64", wie: [lid(i.lid_id)].filter(Boolean), klaar: i.klaar, lijst: l.naam });
  if (zichtbaar("sys-verj"))
    for (const v of S.verjaardagen) {
      const n = AG.volgendeVerjaardag(v, van);
      if (n.datum <= tot) voeg(n.datum, { soort: "verjaardag", id: v.id, titel: n.leeftijd ? `${v.naam} wordt ${n.leeftijd}` : `Verjaardag ${v.naam}`, heleDag: true, kleur: kalender("sys-verj").kleur });
    }
  if (zichtbaar("sys-feest"))
    for (let j = +van.slice(0, 4); j <= +tot.slice(0, 4); j++)
      AG.feestdagen(j).filter(f => f.datum >= van && f.datum <= tot).forEach(f => voeg(f.datum, { soort: "feest", titel: f.naam, heleDag: true, kleur: kalender("sys-feest").kleur }));
  if (zichtbaar("sys-school"))
    AG.rolUit(AG.SCHOOLVAKANTIES.map((s, i) => ({ ...s, id: "sv" + i, titel: s.naam })), van, tot)
      .forEach(s => voeg(s.dag, { soort: "school", titel: s.titel, heleDag: true, kleur: kalender("sys-school").kleur }));
  if (zichtbaar("sys-maaltijd"))
    for (const m of S.menu) if (m.datum >= van && m.datum <= tot && m.moment === "avond") {
      const g = gerecht(m.gerecht_id); const t = g ? g.naam : m.vrije_tekst;
      if (t) voeg(m.datum, { soort: "maaltijd", titel: t, heleDag: true, kleur: kalender("sys-maaltijd").kleur });
    }
  if (zichtbaar("sys-afval")) afvalAgendaItems(van, tot, voeg);
  const volg = { school: 0, feest: 1, verjaardag: 2, afval: 2, afspraak: 3, taak: 4, lijstitem: 5, maaltijd: 9 };
  for (const d in per) per[d].sort((a, b) => (a.heleDag === b.heleDag ? 0 : a.heleDag ? -1 : 1) || (a.tijd || "").localeCompare(b.tijd || "") || volg[a.soort] - volg[b.soort]);
  return per;
}

function itemRij(it, dagStr, kort) {
  const meta = [it.eind ? `tot ${it.eind}` : "", it.lijst ? "op " + it.lijst : "", it.reden || "", it.plaats, it.wie && it.wie.length ? it.wie.map(w => w.naam).join(", ") : "", it.denkt ? "denkt: " + it.denkt.naam : "", it.herh ? "↻" : ""].filter(Boolean).join(" · ");
  const klik = it.soort === "afspraak" || it.soort === "taak" || it.soort === "verjaardag" ? `data-item="${it.soort}|${it.id}|${it.voorkomen || dagStr}"` : it.soort === "lijstitem" ? `data-litembewerk="${it.id}"` : it.soort === "afval" ? `data-afvalitem="${esc(it.id)}"` : "";
  const cls = `ag-item ag-${it.soort}${it.klaar ? " klaar" : ""}${it.heleDag ? " heledag" : ""}`;
  const vink = it.soort === "taak" ? `<input type="checkbox" class="ag-vink" data-taak="${it.id}|${it.voorkomen}" ${it.klaar ? "checked" : ""} aria-label="Taak afvinken">`
    : it.soort === "lijstitem" ? `<input type="checkbox" class="ag-vink" data-litem="${it.id}" ${it.klaar ? "checked" : ""} aria-label="Afvinken">`
    : it.soort === "afval" ? `<input type="checkbox" class="ag-vink" data-afval="${esc(it.id)}" ${it.klaar ? "checked" : ""} aria-label="${esc(it.titel)} buitengezet">` : "";
  const label = it.soort === "maaltijd" ? `<span class="tag">avond</span> ` : it.soort === "school" || it.soort === "feest" ? "" : "";
  const duim = it.soort === "taak" && typeof duimHtml === "function" && (it.wie || []).some(w => isKindLid(w.id)) ? duimHtml(it.id, it.voorkomen) : "";
  return `<div class="${cls}" style="--k:${it.kleur}">${vink}<button class="ag-knop" ${klik} ${klik ? "" : "disabled"}>
    ${it.tijd ? `<span class="ag-tijd">${esc(it.tijd)}</span>` : ""}<span class="ag-titel">${label}${esc(it.titel)}</span>${!kort && meta ? `<span class="ag-meta">${esc(meta)}</span>` : ""}</button>${duim}</div>`;
}

/* ---------- Scherm ---------- */
/* Eerste dag van de agenda-weekweergave: vandaag + S.agOffset dagen (veelvoud van 7) */
const agVan = () => AG.plus(AG.iso(new Date()), S.agOffset || 0);
function viewAgenda() {
  const vandaag = AG.iso(new Date());
  const chips = [...S.kalenders, ...SYS].map(k => `<button class="chip ag-chip" data-kal="${k.id}" aria-pressed="${zichtbaar(k.id)}" style="--k:${k.kleur}"><span class="dot"></span>${esc(k.naam)}</button>`).join("");
  const kop = `<div class="ag-kop">
      <div class="seg" role="group" aria-label="Weergave"><button data-agview="week" aria-pressed="${S.agendaView === "week"}">Week</button><button data-agview="maand" aria-pressed="${S.agendaView === "maand"}">Maand</button></div>
      <span class="acties" style="margin:0"><button class="knop sec" data-afval>Afval</button><button class="knop sec" data-overleg>Eilandraad</button><button class="knop" data-nieuwitem>+ Nieuw</button></span></div>
    <div class="chips ag-chips">${chips}</div>`;
  // Aandacht: taken te laat + verjaardagen binnen 14 dagen
  // Te laat: eenmalige taken van de voorbije 30 dagen; herhalende enkel het laatste gemiste voorkomen van de voorbije 7 dagen
  const telaat = S.taken.flatMap(t => {
    const vk = AG.voorkomens(t.deadline, 0, t.herhaling, AG.plus(vandaag, t.herhaling ? -7 : -30), AG.plus(vandaag, -1), t.uitzonderingen);
    const open = (t.herhaling ? vk.slice(-1) : vk).filter(d => !(t.klaar || []).includes(d));
    return open.map(d => ({ ...t, voorkomen: d }));
  });
  const verj = S.verjaardagen.map(v => ({ v, n: AG.volgendeVerjaardag(v, vandaag) })).filter(x => x.n.dagen <= 14).sort((a, b) => a.n.dagen - b.n.dagen);
  const telaatRij = (t, metDatum) => `<div class="ag-item ag-taak telaat" style="--k:var(--danger)"><input type="checkbox" class="ag-vink" data-taak="${t.id}|${t.voorkomen}" aria-label="Taak afvinken"><button class="ag-knop" data-item="taak|${t.id}|${t.voorkomen}"><span class="ag-tijd">te laat</span><span class="ag-titel">${esc(t.titel)}</span><span class="ag-meta">${metDatum ? `${AG.dag(t.voorkomen).getDate()} ${MND[AG.dag(t.voorkomen).getMonth()]}` : ""}${t.lid_id && lid(t.lid_id) ? (metDatum ? " · " : "") + esc(lid(t.lid_id).naam) : ""}</span></button>${typeof duimHtml === "function" && isKindLid(t.lid_id) ? duimHtml(t.id, t.voorkomen) : ""}</div>`;
  // Weekweergave vanaf vandaag: open taken van vroeger staan dan in hun eigen dag bovenaan, niet in het aandachtsblok
  const rollend = S.agendaView !== "maand" && !(S.agOffset || 0);
  const tlBlok = rollend ? [] : telaat;
  const aandacht = (tlBlok.length || verj.length) ? `<div class="ag-aandacht">
      ${tlBlok.map(t => telaatRij(t, true)).join("")}
      ${verj.map(({ v, n }) => `<div class="ag-item ag-verjaardag" style="--k:${kalender("sys-verj").kleur}"><button class="ag-knop" data-item="verjaardag|${v.id}|${n.datum}"><span class="ag-tijd">${n.dagen === 0 ? "vandaag" : n.dagen === 1 ? "morgen" : "over " + n.dagen + " d."}</span><span class="ag-titel">${esc(n.leeftijd ? `${v.naam} wordt ${n.leeftijd}` : `Verjaardag ${v.naam}`)}</span></button></div>`).join("")}
    </div>` : "";
  let body;
  if (S.agendaView === "maand") {
    const m0 = new Date(S.maand.getFullYear(), S.maand.getMonth(), 1, 12);
    const start = AG.plus(AG.iso(m0), 1 - AG.weekdag(AG.iso(m0)));
    const last = new Date(m0.getFullYear(), m0.getMonth() + 1, 0, 12);
    const eind = AG.plus(AG.iso(last), 7 - AG.weekdag(AG.iso(last)));
    const per = agendaItems(start, eind);
    const cellen = [];
    for (let d = start; d <= eind; d = AG.plus(d, 1)) {
      const it = per[d] || [], buiten = AG.dag(d).getMonth() !== m0.getMonth();
      cellen.push(`<button class="mcel${buiten ? " buiten" : ""}${d === vandaag ? " vandaag" : ""}" data-dag="${d}" aria-label="${AG.dag(d).getDate()} ${MAANDEN[AG.dag(d).getMonth()]}, ${it.length} items">
        <span class="mnr">${AG.dag(d).getDate()}</span>
        <span class="mitems">${it.filter(x => x.soort !== "maaltijd").slice(0, 3).map(x => `<span class="mi${x.heleDag ? " hd" : ""}" style="--k:${x.kleur}">${x.tijd ? esc(x.tijd) + " " : ""}${esc(x.titel)}</span>`).join("")}${it.length > 3 ? `<span class="mmeer">+${it.length - 3}</span>` : ""}</span>
        <span class="mdots">${it.slice(0, 5).map(x => `<i style="--k:${x.kleur}"></i>`).join("")}</span></button>`);
    }
    body = `<div class="maand"><div class="mkop">${KORT.map(k => `<span>${k}</span>`).join("")}</div><div class="mgrid">${cellen.join("")}</div></div>`;
  } else {
    // 7 dagen vanaf vandaag (met ‹ › telkens 7 dagen verder); vóór vandaag enkel de dagen met nog open taken
    const van = agVan(), tot = AG.plus(van, 6), per = agendaItems(van, tot);
    const vroeger = rollend ? [...new Set(telaat.map(t => t.voorkomen))].sort() : [];
    const dagNaam = d => DAGEN[AG.weekdag(d) - 1];
    const oud = vroeger.map(d => `<section class="dag ag-dag ag-oud">
        <div class="dagkop"><span class="dagnaam">${dagNaam(d)}</span><span class="datum">${AG.dag(d).getDate()} ${MND[AG.dag(d).getMonth()]} · nog open</span></div>
        <div class="ag-lijst">${telaat.filter(t => t.voorkomen === d).map(t => telaatRij(t, false)).join("")}</div></section>`).join("");
    body = `<div class="dagen">${oud}${[0, 1, 2, 3, 4, 5, 6].map(i => {
      const d = AG.plus(van, i), it = per[d] || [];
      return `<section class="dag ag-dag ${d === vandaag ? "is-vandaag" : ""}">
        <div class="dagkop"><span class="dagnaam">${d === vandaag ? "Vandaag" : d === AG.plus(vandaag, 1) ? "Morgen" : dagNaam(d)}</span><span class="datum">${d === vandaag || d === AG.plus(vandaag, 1) ? dagNaam(d).toLowerCase() + " " : ""}${AG.dag(d).getDate()} ${MND[AG.dag(d).getMonth()]}</span><button class="ag-plus" data-nieuwop="${d}" aria-label="Nieuw op ${dagNaam(d)}">+</button></div>
        <div class="ag-lijst">${it.length ? it.map(x => itemRij(x, d)).join("") : `<button class="ag-leeg" data-nieuwop="${d}">Niets gepland</button>`}</div></section>`;
    }).join("")}</div>`;
  }
  $("#view").innerHTML = agendaBanner() + kop + aandacht + body;
}
function agendaBanner() {
  return db.demo ? `<div class="banner"><b>Testversie agenda</b> met voorbeeldafspraken en -taken (geen echte gegevens), echte Belgische feestdagen en Vlaamse schoolvakanties. Herinneringen en Google Agenda werken pas in de echte versie.</div>` : "";
}

/* Afspraken van een dag voor het weekmenu (agenda naast het weekmenu) */
function dagAgendaKort(ds) {
  const it = (agendaItems(ds, ds)[ds] || []).filter(x => x.soort !== "maaltijd" && x.soort !== "school" && x.soort !== "afval");
  if (!it.length) return "";
  return `<div class="ag-kort">${it.slice(0, 4).map(x => `<span style="--k:${x.kleur}" class="${x.soort === "taak" && x.klaar ? "klaar" : ""}">${x.tijd ? `<b>${esc(x.tijd)}</b> ` : ""}${esc(x.titel)}</span>`).join("")}${it.length > 4 ? `<span>+${it.length - 4}</span>` : ""}</div>`;
}

/* ---------- Panelen ---------- */
function openDag(ds) {
  const it = agendaItems(ds, ds)[ds] || [];
  const d = AG.dag(ds);
  openPaneel(`<div class="paneel-kop"><h2>${DAGEN[(d.getDay() + 6) % 7]} ${d.getDate()} ${MAANDEN[d.getMonth()]}</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    <div class="ag-lijst">${it.length ? it.map(x => itemRij(x, ds)).join("") : `<p class="muted">Niets gepland.</p>`}</div>
    <div class="voet"><button class="knop sec" data-nieuw-soort="verjaardag|${ds}">+ Verjaardag</button><button class="knop sec" data-nieuw-soort="taak|${ds}">+ Taak</button><button class="knop" data-nieuw-soort="afspraak|${ds}">+ Afspraak</button></div>`);
  $("#paneel").onclick = agendaPaneelKlik;
  $("#paneel").onchange = agendaVinkWijzig;
}
function openNieuwKeuze(ds) {
  openPaneel(`<div class="paneel-kop"><h2>Nieuw</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    <div class="keuzes"><button class="keuze" data-nieuw-soort="afspraak|${ds}"><span>Afspraak<small>met tijd of hele dag, eventueel herhalend</small></span></button>
    <button class="keuze" data-nieuw-soort="taak|${ds}"><span>Taak met deadline<small>bv. afval buitenzetten, formulier terugbezorgen</small></span></button>
    <button class="keuze" data-nieuw-soort="verjaardag|${ds}"><span>Verjaardag<small>komt elk jaar terug</small></span></button></div>`);
  $("#paneel").onclick = agendaPaneelKlik;
}
function agendaPaneelKlik(e) {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.nieuwSoort) { const [s, d] = t.dataset.nieuwSoort.split("|"); ({ afspraak: openAfspraak, taak: openTaak, verjaardag: openVerjaardag })[s](null, d); }
  else if (t.dataset.item) openItem(t.dataset.item);
  else if (t.dataset.afvalitem) openAfvalItem(t.dataset.afvalitem);
}
function agendaVinkWijzig(e) {
  if (e.target.dataset && e.target.dataset.afval) return afVink(e.target);
  const v = e.target.dataset && e.target.dataset.taak; if (!v) return;
  const [id, d] = v.split("|"), val = e.target.checked;
  e.target.closest(".ag-item").classList.toggle("klaar", val);
  run(async () => { await db.vinkTaak(id, d, val); const t = S.taken.find(x => x.id === id); if (val && t) await db.log(`vinkte '${t.titel}' af`); await Promise.all([herlaadAgenda(), herlaadGezin()]); if ($("#sheet").hidden) render(); });
}
function openItem(v) {
  const [soort, id, d] = v.split("|");
  if (soort === "afspraak") openAfspraak(id, d); else if (soort === "taak") openTaak(id, d); else if (soort === "verjaardag") openVerjaardag(id);
}

const lidChips = (sel, naam = "wie") => `<div class="chips" style="margin:0">${S.leden.map(l => `<label class="chip toggle" style="--k:${l.kleur}"><input type="checkbox" name="${naam}" value="${l.id}" ${sel.includes(l.id) ? "checked" : ""}> ${esc(l.naam)}</label>`).join("")}</div>`;
const herhVeld = (h, ds) => {
  const v = !h ? "" : h.freq === "week" && h.interval === 2 ? "week2" : h.freq;
  const dagen = h && h.dagen && h.dagen.length ? h.dagen : [AG.weekdag(ds)];
  return `<div class="rij"><div class="veld"><label for="a-herh">Herhalen</label><select class="in" id="a-herh">${HERH.map(([k, l]) => `<option value="${k}" ${k === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="veld"><label for="a-tot">Tot en met</label><input class="in" id="a-tot" type="date" value="${h && h.tot ? h.tot : ""}"></div></div>
    <div id="a-dagen" class="chips" ${v === "week" || v === "week2" ? "" : "hidden"}>${KORT.map((k, i) => `<label class="chip toggle"><input type="checkbox" name="wd" value="${i + 1}" ${dagen.includes(i + 1) ? "checked" : ""}> ${k}</label>`).join("")}</div>`;
};
function leesHerh(p) {
  const v = p.querySelector("#a-herh").value; if (!v) return null;
  const dagen = [...p.querySelectorAll('input[name="wd"]:checked')].map(x => +x.value);
  return { freq: v === "week2" ? "week" : v, interval: v === "week2" ? 2 : 1, dagen: v.startsWith("week") ? dagen : [], tot: p.querySelector("#a-tot").value || null };
}
function verwijderKnoppen(item, d) {

/* "Zichtbaar voor": iedereen of een of meer gezinsleden. Bij een nieuwe taak leeg en verplicht.
   undefined = nog niet gekozen, null = iedereen, [ids] = enkel die leden (+ wie het doet en wie eraan denkt) */
function zichtVeld(z) {
  const iedereen = z === null, sel = Array.isArray(z) ? z : [];
  return `<div class="veld" id="t-zicht"><label id="t-zicht-lbl">Zichtbaar voor</label>
    <div class="chips" style="margin:0" role="group" aria-labelledby="t-zicht-lbl">
      <label class="chip toggle"><input type="checkbox" name="zicht" value="*" ${iedereen ? "checked" : ""}> Iedereen</label>
      ${S.leden.map(l => `<label class="chip toggle" style="--k:${l.kleur}"><input type="checkbox" name="zicht" value="${l.id}" ${sel.includes(l.id) ? "checked" : ""}> ${esc(l.naam)}</label>`).join("")}</div>
    <small class="muted">Wie het doet en wie eraan denkt, zien de taak altijd.</small>
    <p class="neg-tekst" id="t-zicht-fout" role="alert" hidden style="margin:0;font-size:.85rem">Kies voor wie deze taak zichtbaar is.</p></div>`;
}
function zichtWijzig(p, cb) {
  if (cb.checked) p.querySelectorAll('input[name="zicht"]').forEach(x => { if (cb.value === "*" ? x.value !== "*" : x.value === "*") x.checked = false; });
  p.querySelector("#t-zicht-fout").hidden = true;
}
function leesZicht(p) {
  const v = [...p.querySelectorAll('input[name="zicht"]:checked')].map(x => x.value);
  if (!v.length) { const f = p.querySelector("#t-zicht-fout"); f.hidden = false; f.scrollIntoView({ block: "nearest" }); p.querySelector('input[name="zicht"]').focus(); return undefined; }
  return v.includes("*") ? null : v;
}
function zietTaak(t, me) { return !t.zichtbaar_voor || !me || t.zichtbaar_voor.includes(me) || t.lid_id === me || t.eigenaar_id === me; }

    <div class="stack">${S.leden.map(l => `<div class="instrij" style="--k:${l.kleur}"><span class="dot"></span><span>${esc(l.naam)}</span>${l.heeft_account ? `<span class="tag">account</span>` : ""}</div>`).join("")}
      <form class="instform" id="f-lid"><input class="in" id="lid-naam" placeholder="Naam (bv. kind zonder account)" aria-label="Naam gezinslid">${kl(KLEUREN[3], "lid-kleur")}<button class="knop sec klein">Toevoegen</button></form></div>
    <div class="lbl-klein" style="margin-top:8px">Agenda's</div>
    <div class="stack">${S.kalenders.map(k => `<div class="instrij" style="--k:${k.kleur}"><span class="dot"></span><span>${esc(k.naam)}</span>${k.soort === "ics" ? `<span class="tag">geïmporteerd</span><button class="link" data-wiskal="${k.id}" style="margin-left:auto">verwijderen</button>` : ""}</div>`).join("")}
      <form class="instform" id="f-kal"><input class="in" id="kal-naam" placeholder="Nieuwe agenda (bv. Werk Ouder B)" aria-label="Naam agenda">${kl(KLEUREN[5], "kal-kleur")}<button class="knop sec klein">Toevoegen</button></form></div>
    <div class="lbl-klein" style="margin-top:8px">Externe agenda (school, sportclub)</div>
    <div class="stack"><label class="knop sec" style="text-align:center;cursor:pointer">ICS-bestand importeren<input type="file" id="ics-file" accept=".ics,text/calendar" hidden></label>
      <form class="instform" id="f-ics"><input class="in" id="ics-url" type="url" placeholder="https://… .ics (abonneren)" aria-label="ICS-link"><button class="knop sec klein">Abonneren</button></form>
      <p class="muted" style="font-size:.85rem;margin:0">Abonneren houdt de agenda automatisch bij. Dat werkt pas in de echte versie; in de testversie kan je een .ics-bestand importeren.</p></div>`;
}
function instellingenAgendaBind(p) {
  if (p.dataset.agBound) return; p.dataset.agBound = "1";
  p.addEventListener("submit", e => {
    e.preventDefault();
    if (e.target.id === "f-lid") { const n = p.querySelector("#lid-naam").value.trim(); if (!n) return;
      run(async () => { await db.bewaarLid({ naam: n, kleur: p.querySelector('[name="lid-kleur"]').value }); await herlaadAgenda(); openInstellingen(); toast("Gezinslid toegevoegd"); }); }
    if (e.target.id === "f-kal") { const n = p.querySelector("#kal-naam").value.trim(); if (!n) return;
      run(async () => { await db.bewaarKalender({ naam: n, kleur: p.querySelector('[name="kal-kleur"]').value, soort: "eigen" }); await herlaadAgenda(); openInstellingen(); toast("Agenda toegevoegd"); }); }
    if (e.target.id === "f-ics") { const u = p.querySelector("#ics-url").value.trim(); if (!u) return;
      run(async () => { const n = await db.abonneerICS(u); await herlaadAgenda(); sluitPaneel(); render(); toast(`${n} afspraken geladen`); }); }
  });
  p.addEventListener("change", e => {
    if (e.target.id === "ik-sel") { S.ik = e.target.value; pref.set("ik", S.ik); render(); return; }
    if (e.target.id !== "ics-file" || !e.target.files[0]) return;
    const f = e.target.files[0], r = new FileReader();
    r.onload = () => run(async () => {
      const ev = AG.leesICS(String(r.result));
      if (!ev.length) throw new Error("geen afspraken gevonden in dit bestand");
      const n = await db.importeerICS(f.name.replace(/\.ics$/i, ""), KLEUREN[(S.kalenders.length + 2) % KLEUREN.length], ev);
      await herlaadAgenda(); sluitPaneel(); S.tab = "agenda"; render();
      const onv = ev.filter(x => x.onvolledig).length;
      toast(`${n} afspraken geïmporteerd${onv ? ` (${onv} met een herhaling die als eenmalig is ingelezen)` : ""}`);
    });
    r.readAsText(f);
  });
  p.addEventListener("click", e => { const t = e.target.closest("[data-wiskal]"); if (t) run(async () => { await db.verwijderKalender(t.dataset.wiskal); await herlaadAgenda(); openInstellingen(); }); });
}

<script>/* Kring – budget-rekenmotor (R4, lezen). Dezelfde regels als in de SQL-validatie op de YNAB-spiegel:
   - activiteit = som van transacties (en splitsingen) per categorie per maand, op budgetrekeningen
   - beschikbaar(m) = max(beschikbaar(m-1), 0) + toegewezen(m) + activiteit(m)      (negatief schuift niet door)
   - A(m) = Σ inkomen t/m m − Σ toegewezen t/m m + Σ overbesteding (negatief beschikbaar) t/m m-1
   - te verdelen(m) = A(m) ≥ 0 ? max(0, A(m) − toegewezen na m) : A(m) − toegewezen na m
   Bedragen in centen. Werkt in de browser (window.KringBudget) en in Node. */
(function (root) {
  "use strict";
  const mnd = d => d.slice(0, 7);
  const volgende = m => { const [y, k] = m.split("-").map(Number); return k === 12 ? `${y + 1}-01` : `${y}-${String(k + 1).padStart(2, "0")}`; };
  const reeks = (van, tot) => { const r = []; for (let m = van; m <= tot; m = volgende(m)) r.push(m); return r; };
  const RTA = "RTA";

  /** Regels per transactie (splitsingen apart). */
  function regels(transacties) {
    const out = [];
    for (const t of transacties) {
      if (t.splits && t.splits.length) t.splits.forEach(s => out.push({ ...t, bedrag: s.bedrag, categorie_id: s.categorie_id, memo: s.memo || t.memo, split: true }));
      else out.push(t);
    }
    return out;
  }

  function bereken(data, totMaand) {
    const opBudget = new Set(data.rekeningen.filter(r => r.op_budget).map(r => r.id));
    const cats = data.categorieen.map(c => c.id);
    const lijn = regels(data.transacties);
    const maanden0 = [...lijn.map(t => mnd(t.datum)), ...Object.keys(data.toewijzingen)].sort();
    const eerste = data.start ? volgende(data.start.maand) : maanden0[0], laatste = [totMaand, ...Object.keys(data.toewijzingen)].sort().pop();
    const maanden = reeks(eerste, laatste);
    const act = {}, inkomen = {};
    // Categorieën waarvan de activiteit niet uit transacties volgt (kredietkaartbetaling in YNAB): vaste waarden per maand
    const vast = new Set(data.categorieen.filter(c => c.activiteit_per_maand).map(c => c.id));
    for (const m of maanden) { act[m] = {}; inkomen[m] = 0; }
    for (const t of lijn) {
      if (!opBudget.has(t.rekening_id) || !t.categorie_id) continue;   // overboeking tussen budgetrekeningen: geen categorie
      const m = mnd(t.datum); if (!act[m]) continue;
      if (t.categorie_id === RTA) inkomen[m] += t.bedrag;
      else if (vast.has(t.categorie_id)) continue;
      else act[m][t.categorie_id] = (act[m][t.categorie_id] || 0) + t.bedrag;
    }
    for (const c of data.categorieen) if (c.activiteit_per_maand) for (const m of maanden) if (act[m]) act[m][c.id] = c.activiteit_per_maand[m] || 0;
    // Startpunt (bv. 24 maanden terug): beschikbaar per categorie en A uit de bron overnemen
    const res = {};
    let vorige = data.start ? Object.fromEntries(Object.entries(data.start.beschikbaar).map(([k, v]) => [k, { beschikbaar: v }])) : {};
    let cumA = data.start ? data.start.A : 0;
    let overPrev = data.start ? Object.entries(data.start.beschikbaar).filter(([k]) => !vast.has(k)).reduce((s, [, v]) => s + Math.min(0, v), 0) : 0;
    const toeTot = {}; let s = 0;
    for (const m of maanden.slice().reverse()) { toeTot[m] = s; s += Object.values(data.toewijzingen[m] || {}).reduce((a, b) => a + b, 0); }
    for (const m of maanden) {
      const toe = data.toewijzingen[m] || {};
      const rij = {}; let over = 0, somToe = 0, somAct = 0;
      for (const c of cats) {
        const t = toe[c] || 0, a = act[m][c] || 0, carry = vast.has(c) ? (vorige[c] ? vorige[c].beschikbaar : 0) : Math.max(vorige[c] ? vorige[c].beschikbaar : 0, 0);
        const b = carry + t + a;
        rij[c] = { toegewezen: t, activiteit: a, beschikbaar: b, overgedragen: carry };
        if (b < 0 && !vast.has(c)) over += b;
        somToe += t; somAct += a;
      }
      cumA += inkomen[m] - somToe + overPrev;
      const F = toeTot[m];
      res[m] = { cat: rij, inkomen: inkomen[m], toegewezen: somToe, activiteit: somAct, overbesteed: over, overbesteedVorige: overPrev,
                 A: cumA, toekomst: F, teVerdelen: cumA >= 0 ? Math.max(0, cumA - F) : cumA - F };
      overPrev = over; vorige = rij;
    }
    return { maanden, per: res };
  }

  /** Target: hoeveel moet er deze maand nog bij */
  function target(c, r, m) {
    const tg = c.target; if (!tg) return null;
    if (tg.type === "maand") { const nodig = Math.max(0, tg.bedrag - r.toegewezen); return { nodig, doel: tg.bedrag, voortgang: Math.min(1, r.toegewezen / tg.bedrag), label: `${(tg.bedrag / 100).toFixed(0)} per maand` }; }
    if (tg.type === "buffer") { const nodig = Math.max(0, tg.bedrag - r.beschikbaar); return { nodig, doel: tg.bedrag, voortgang: Math.max(0, Math.min(1, r.beschikbaar / tg.bedrag)), label: `buffer van ${(tg.bedrag / 100).toFixed(0)}` }; }
    if (tg.type === "datum") {
      const [y, k] = m.split("-").map(Number), [ty, tk] = tg.datum.split("-").map(Number);
      const rest = Math.max(1, (ty - y) * 12 + (tk - k) + 1);
      const perMaand = Math.ceil(Math.max(0, tg.bedrag - r.overgedragen) / rest);
      return { nodig: Math.max(0, perMaand - r.toegewezen), doel: tg.bedrag, voortgang: Math.max(0, Math.min(1, r.beschikbaar / tg.bedrag)), label: `${(tg.bedrag / 100).toFixed(0)} tegen ${tg.datum.slice(5, 7)}/${tg.datum.slice(0, 4)}` };
    }
    return null;
  }

  function saldi(data) {
    const s = {}; data.rekeningen.forEach(r => s[r.id] = { saldo: 0, gecleard: 0, open: 0 });
    for (const t of data.transacties) { const x = s[t.rekening_id]; if (!x) continue; x.saldo += t.bedrag; if (t.status === "u") x.open += t.bedrag; else x.gecleard += t.bedrag; }
    return s;
  }

    const categorieen = [

      C("school", "vast", "School & opvang", 120),

      C("kapper", "dag", "Kapper", 40), C("brandstof", "dag", "Brandstof", 160), C("auto", "dag", "Auto-onderhoud", 60, { type: "buffer", bedrag: 120000 }),
      C("uiteten", "plezier", "Uit eten", 150), C("sport", "plezier", "Vrije tijd & sport", 90), C("cadeaus", "plezier", "Cadeaus", 60), C("abo", "plezier", "Abonnementen", 35),
      C("vakantie", "doelen", "Vakantie", 250, { type: "datum", bedrag: 300000, datum: "2027-07" }), C("buffer", "doelen", "Buffer", 150, { type: "buffer", bedrag: 600000 }),

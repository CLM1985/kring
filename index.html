<script>/* Kring – budget-scherm (R4, lezen): plan per maand, rekeningen met register, rapporten. */
"use strict";
const KB = window.KringBudget;
const euro = c => (c < 0 ? "−" : "") + "€ " + (Math.abs(c) / 100).toLocaleString("nl-BE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const euroKort = c => (c < 0 ? "−" : "") + "€ " + Math.round(Math.abs(c) / 100).toLocaleString("nl-BE");
const MAANDNAAM = m => { const [y, k] = m.split("-").map(Number); return `${MAANDEN[k - 1]} ${y}`; };
const MAANDKORT = m => MAANDEN[+m.slice(5, 7) - 1].slice(0, 3);
const vorigeMnd = m => { const [y, k] = m.split("-").map(Number); return k === 1 ? `${y - 1}-12` : `${y}-${String(k - 1).padStart(2, "0")}`; };

let BR = null;   // berekening (cache)
function budgetBerekening() { if (!BR || BR.data !== S.budget) BR = { data: S.budget, ...KB.bereken(S.budget, S.budget.huidig) }; return BR; }
const regelsCache = () => (BR && BR.regels) || (BR.regels = KB.regels(S.budget.transacties));

function viewBudget() {
  if (!S.budget) { $("#view").innerHTML = `<div class="leegstaat">${S.budgetGeladen ? "Nog geen budget gekoppeld aan dit gezin, of het kon niet geladen worden. Probeer later opnieuw." : "Budget laden…"}</div>`; return; }
  const seg = `<div class="ag-kop"><div class="seg" role="group" aria-label="Budget">${[["plan", "Plan"], ["rekeningen", "Rekeningen"], ["rapporten", "Rapporten"]].map(([k, l]) => `<button data-bview="${k}" aria-pressed="${S.budgetView === k}">${l}</button>`).join("")}</div></div>`;
  const banner = beBanner();
  $("#view").innerHTML = banner + seg + `<div id="bview"></div>`;
  ({ plan: budgetPlan, rekeningen: budgetRekeningen, rapporten: budgetRapporten })[S.budgetView]();
}

/* ---------- Plan ---------- */
function budgetPlan() {
  const B = budgetBerekening(), m = S.bmaand, r = B.per[m];
  if (!r) { $("#bview").innerHTML = `<div class="leegstaat">Geen budget voor ${MAANDNAAM(m)}.</div>`; return; }
  const cats = S.budget.categorieen;
  const info = c => ({ c, r: r.cat[c.id], t: KB.target(c, r.cat[c.id], m) });
  const filt = { alle: () => true, teweinig: x => x.t && x.t.nodig > 0, over: x => x.r.beschikbaar < 0, beschikbaar: x => x.r.beschikbaar > 0 }[S.bfilter];
  const tv = r.teVerdelen;
  const kop = `<div class="rta ${tv > 0 ? "pos" : tv < 0 ? "neg" : "nul"}">
      <div><span class="lbl-klein">Te verdelen</span><div class="rta-bedrag">${euro(tv)}</div></div>
      <div class="rta-sub">${tv > 0 ? "Geef elke euro een taak." : tv < 0 ? "Meer toegewezen dan er is: haal ergens geld weg." : "Alles heeft een taak."}<br>
      Inkomen ${euro(r.inkomen)} · toegewezen ${euro(r.toegewezen)} · uitgegeven ${euro(-Math.min(0, r.activiteit))}${r.overbesteedVorige < 0 ? ` · overbesteed vorige maand ${euro(r.overbesteedVorige)}` : ""}${r.toekomst ? ` · al toegewezen in latere maanden ${euro(r.toekomst)}` : ""}</div></div>`;
  const chips = `<div class="chips">${[["alle", "Alle"], ["teweinig", "Te weinig"], ["over", "Overbesteed"], ["beschikbaar", "Geld beschikbaar"]].map(([k, l]) => `<button class="chip" data-bfilter="${k}" aria-pressed="${S.bfilter === k}">${l}</button>`).join("")}</div>`;
  const pill = b => `<span class="pill ${b < 0 ? "neg" : b > 0 ? "pos" : "nul"}">${euro(b)}</span>`;
  const groepen = S.budget.groepen.map(g => {
    const rijen = cats.filter(c => c.groep_id === g.id).map(info).filter(filt);
    if (!rijen.length) return "";
    const som = k => rijen.reduce((s, x) => s + x.r[k], 0);
    return `<tbody><tr class="grp"><th scope="rowgroup">${esc(g.naam)}</th><td>${euro(som("toegewezen"))}</td><td>${euro(som("activiteit"))}</td><td>${euro(som("beschikbaar"))}</td></tr>
      ${rijen.map(({ c, r: x, t }) => `<tr class="cat${S.bcat === c.id ? " sel" : ""}" data-bcat="${c.id}" tabindex="0">
        <th scope="row"><span class="cnaam">${esc(c.naam)}</span>${t ? `<span class="tbar" title="${esc(t.label)}"><i style="width:${Math.round(t.voortgang * 100)}%"></i></span><span class="tlbl">${t.nodig > 0 ? `nog ${euro(t.nodig)} nodig` : "doel gehaald"}</span>` : ""}</th>
        <td>${euro(x.toegewezen)}</td><td>${euro(x.activiteit)}</td><td>${pill(x.beschikbaar)}</td></tr>`).join("")}</tbody>`;
  }).join("");
  const tabel = `<div class="btabel-wrap"><table class="btabel"><thead><tr><th scope="col">Categorie</th><th scope="col">Toegewezen</th><th scope="col">Activiteit</th><th scope="col">Beschikbaar</th></tr></thead>${groepen || `<tbody><tr><td colspan="4" class="muted">Geen categorieën in deze selectie.</td></tr></tbody>`}</table></div>`;
  const breed = window.innerWidth >= 1000;
  let live = "";
  if (S.budget.controle) {   // echte versie: elke keer vergelijken met de YNAB-cijfers
    let ok = 0, n = 0, okR = 0, nR = 0;
    for (const k of B.maanden) { const c = S.budget.controle.beschikbaar && S.budget.controle.beschikbaar[k]; if (c) for (const id in c) { n++; if (B.per[k].cat[id] && B.per[k].cat[id].beschikbaar === c[id]) ok++; }
      const tv = S.budget.controle.te_verdelen && S.budget.controle.te_verdelen[k]; if (tv != null && k <= S.budget.huidig) { nR++; if (B.per[k].teVerdelen === tv) okR++; } }
    live = `<p><b>Vandaag:</b> beschikbaar ${ok.toLocaleString("nl-BE")} van ${n.toLocaleString("nl-BE")} gelijk, te verdelen ${okR} van ${nR} maanden gelijk.</p>`;
  }
  const controle = `<details class="controle"${live ? " open" : ""}><summary>Controle met YNAB</summary>${live}<p>Op jullie echte gezamenlijke plan (2018 – nov 2026) rekende ik dezelfde regels na in de database:</p>
    <ul><li>Activiteit per categorie per maand: <b>14.873 van 14.873</b> op de cent gelijk.</li><li>Beschikbaar per categorie per maand: <b>14.873 van 14.873</b> gelijk.</li>
    <li>Te verdelen per maand: <b>106 van 107</b> gelijk. De afwijking (deze maand, € 331,05) zit in de kredietkaartlogica en wordt nog uitgezocht.</li></ul>
    <p class="muted">In de echte versie loopt deze controle elke nacht tot de overstap.</p></details>`;
  $("#bview").innerHTML = kop + chips + (breed ? `<div class="bgrid">${tabel}<aside class="inspector" id="inspector">${inspectorHtml()}</aside></div>` : tabel) + controle;
}
function inspectorHtml() {
  const B = budgetBerekening(), m = S.bmaand, r = B.per[m];
  const c = S.budget.categorieen.find(x => x.id === S.bcat);
  if (!c) {
    const over = S.budget.categorieen.filter(x => r.cat[x.id].beschikbaar < 0);
    return `<h3>${MAANDNAAM(m)}</h3><dl class="kv"><dt>Inkomen</dt><dd>${euro(r.inkomen)}</dd><dt>Toegewezen</dt><dd>${euro(r.toegewezen)}</dd><dt>Activiteit</dt><dd>${euro(r.activiteit)}</dd><dt>Te verdelen</dt><dd>${euro(r.teVerdelen)}</dd></dl>
      ${over.length ? `<p class="lbl-klein">Overbesteed</p><ul class="kort">${over.map(x => `<li><button class="link" data-bcat="${x.id}">${esc(x.naam)}</button> ${euro(r.cat[x.id].beschikbaar)}</li>`).join("")}</ul><p class="muted">Een tekort schuift niet door: het wordt volgende maand van het te verdelen bedrag afgetrokken.</p>` : `<p class="muted">Geen overbestede categorieën.</p>`}

  }
  const x = r.cat[c.id], t = KB.target(c, x, m);
  const hist = B.maanden.filter(k => k <= m).slice(-12).map(k => B.per[k].cat[c.id].activiteit);
  const gem = n => { const a = hist.slice(-n - 1, -1); return a.length ? Math.round(a.reduce((s, v) => s + v, 0) / a.length) : 0; };
  const laatste = regelsCache().filter(tr => tr.categorie_id === c.id && tr.datum.slice(0, 7) <= m).slice(-5).reverse();

    <div class="ins-bedrag ${x.beschikbaar < 0 ? "neg" : ""}">${euro(x.beschikbaar)}<span class="lbl-klein"> beschikbaar</span></div>
    <dl class="kv"><dt>Overgedragen</dt><dd>${euro(x.overgedragen)}</dd><dt>+ Toegewezen</dt><dd>${euro(x.toegewezen)}</dd><dt>+ Activiteit</dt><dd>${euro(x.activiteit)}</dd><dt>= Beschikbaar</dt><dd><b>${euro(x.beschikbaar)}</b></dd></dl>
    ${t ? `<p class="lbl-klein">Doel</p><p>${esc(t.label)}<span class="tbar groot"><i style="width:${Math.round(t.voortgang * 100)}%"></i></span>${t.nodig > 0 ? `Nog ${euro(t.nodig)} nodig deze maand.` : "Doel gehaald."}</p>` : ""}
    <dl class="kv"><dt>Gem. uitgegeven 3 mnd</dt><dd>${euro(-gem(3))}</dd><dt>Gem. uitgegeven 12 mnd</dt><dd>${euro(-gem(12))}</dd></dl>
    ${laatste.length ? `<p class="lbl-klein">Laatste transacties</p><ul class="kort">${laatste.map(tr => `<li><span>${tr.datum.slice(8, 10)}/${tr.datum.slice(5, 7)} ${esc(tr.begunstigde)}</span><span>${euro(tr.bedrag)}</span></li>`).join("")}</ul>` : ""}`;
}
function openInspector(id) {

/* ---------- Rekeningen + register ---------- */
function budgetRekeningen() {
  const s = KB.saldi(S.budget), rek = S.budget.rekeningen;
  const totaal = l => l.reduce((a, r) => a + s[r.id].saldo, 0);
  const lijst = (titel, l) => `<div class="groep"><h3><span>${titel}</span><span>${euro(totaal(l))}</span></h3>${l.map(r => `<button class="rek${S.brek === r.id ? " sel" : ""}" data-brek="${r.id}"><span>${esc(r.naam)}</span><span>${euro(s[r.id].saldo)}${s[r.id].open ? `<small>${euro(s[r.id].open)} nog niet verwerkt</small>` : ""}</span></button>`).join("")}</div>`;
  const zoek = S.bzoek || "";
  const sel = S.brek || "alle", namen = Object.fromEntries(S.budget.categorieen.map(c => [c.id, c.naam])); namen.RTA = "Inkomen (te verdelen)";
  const rekNaam = Object.fromEntries(rek.map(r => [r.id, r.naam]));
  let tx = S.budget.transacties.filter(t => sel === "alle" ? true : t.rekening_id === sel);
  let saldo = 0; const metSaldo = tx.map(t => ({ ...t, loop: (saldo += t.bedrag) }));
  const z = norm(zoek);
  const zicht = metSaldo.filter(t => !z || norm(t.begunstigde).includes(z) || norm(namen[t.categorie_id] || "").includes(z) || norm(t.memo).includes(z) || String(t.bedrag / 100).includes(z)).reverse().slice(0, 150);
  const cat = t => t.splits ? `Gesplitst: ${t.splits.map(x => namen[x.categorie_id]).join(", ")}` : t.transfer_rekening_id ? `→ ${rekNaam[t.transfer_rekening_id]}` : (namen[t.categorie_id] || "—");
  $("#bview").innerHTML = `<div class="rek-grid"><div>${lijst("Budgetrekeningen", rek.filter(r => r.op_budget))}${lijst("Opvolgen (buiten budget)", rek.filter(r => !r.op_budget))}
      <button class="rek${sel === "alle" ? " sel" : ""}" data-brek="alle"><span>Alle rekeningen</span><span></span></button></div>
    <div class="register"><div class="zoekbalk"><input class="in" id="bzoek" type="search" placeholder="Zoek begunstigde, categorie, bedrag" value="${esc(zoek)}" aria-label="Zoek transacties"></div>
      <div class="btabel-wrap"><table class="btabel reg"><thead><tr><th scope="col">Datum</th><th scope="col">Begunstigde</th><th scope="col">Categorie</th><th scope="col">Bedrag</th>${sel !== "alle" ? `<th scope="col">Saldo</th>` : ""}</tr></thead>
      <tbody>${zicht.map(t => `<tr><td>${t.datum.slice(8, 10)}/${t.datum.slice(5, 7)}/${t.datum.slice(2, 4)}</td><td>${esc(t.begunstigde)}${sel === "alle" ? `<small>${esc(rekNaam[t.rekening_id])}</small>` : ""}${t.status === "u" ? ` <span class="tag">open</span>` : ""}</td><td>${esc(cat(t))}</td><td class="${t.bedrag < 0 ? "" : "in"}">${euro(t.bedrag)}</td>${sel !== "alle" ? `<td>${euro(t.loop)}</td>` : ""}</tr>`).join("") || `<tr><td colspan="5" class="muted">Geen transacties gevonden.</td></tr>`}</tbody></table></div>
      <p class="muted" style="font-size:.85rem">${zicht.length === 150 ? "De 150 meest recente transacties. Zoek om verder te filteren." : `${zicht.length} transacties`}</p></div></div>`;
}

/* ---------- Rapporten ---------- */
function budgetRapporten() {
  const B = budgetBerekening(), eind = S.bmaand <= S.budget.huidig ? S.bmaand : S.budget.huidig;
  const mm = B.maanden.filter(k => k <= eind).slice(-12);
  const uitgaven = k => -S.budget.categorieen.reduce((s, c) => s + B.per[k].cat[c.id].activiteit, 0);   // netto uitgaven (terugbetalingen trekken af)
  const r = B.per[eind];
  const perCat = S.budget.categorieen.map(c => ({ c, v: -r.cat[c.id].activiteit })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const top = perCat.slice(0, 8), rest = perCat.slice(8).reduce((s, x) => s + x.v, 0);
  if (rest > 0) top.push({ c: { naam: "Overige" }, v: rest });
  const totaalUit = perCat.reduce((s, x) => s + x.v, 0);
  // 1. horizontale staven per categorie
  const maxH = Math.max(1, ...top.map(x => x.v));
  const hbars = `<div class="hbars" role="img" aria-label="Uitgaven per categorie in ${MAANDNAAM(eind)}">${top.map(x => `<div class="hb"><span class="hb-l">${esc(x.c.naam)}</span><span class="hb-b"><i style="width:${(x.v / maxH * 100).toFixed(1)}%" title="${esc(x.c.naam)}: ${euro(x.v)}"></i></span><span class="hb-v">${euro(x.v)}</span></div>`).join("")}</div>`;
  // 2+3. staafgrafieken over 12 maanden (SVG, één schaal)
  const W = 640, H = 220, L = 52, R = 8, T = 12, Bm = 26, iw = W - L - R, ih = H - T - Bm;
  const schaal = max => { const stap = [100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000].map(x => x * 100).find(s => max / s <= 5) || 1000000; return { top: Math.ceil(max / stap) * stap || stap, stap }; };
  const grid = (sc) => { let g = ""; for (let v = 0; v <= sc.top; v += sc.stap) { const y = T + ih - v / sc.top * ih; g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" class="gl"/><text x="${L - 6}" y="${y + 4}" class="ax" text-anchor="end">${euroKort(v)}</text>`; } return g; };
  const xlab = (i, bw) => `<text x="${L + i * (iw / mm.length) + (iw / mm.length) / 2}" y="${H - 8}" class="ax" text-anchor="middle">${MAANDKORT(mm[i])}</text>`;
  const trend = mm.map(uitgaven), sc1 = schaal(Math.max(...trend, 1));
  const bw1 = iw / mm.length;
  const svg1 = `<svg viewBox="0 0 ${W} ${H}" class="grafiek" role="img" aria-label="Uitgaven per maand">${grid(sc1)}${trend.map((v, i) => { const h = Math.max(0, v) / sc1.top * ih; return `<rect x="${L + i * bw1 + bw1 * 0.18}" y="${T + ih - h}" width="${bw1 * 0.64}" height="${h}" rx="3" class="b-uit"><title>${MAANDNAAM(mm[i])}: ${euro(v)}</title></rect>`; }).join("")}${mm.map((_, i) => xlab(i)).join("")}</svg>`;
  const ink = mm.map(k => B.per[k].inkomen), sc2 = schaal(Math.max(...ink, ...trend, 1));
  const svg2 = `<svg viewBox="0 0 ${W} ${H}" class="grafiek" role="img" aria-label="Inkomen en uitgaven per maand">${grid(sc2)}${mm.map((k, i) => { const x0 = L + i * bw1 + bw1 * 0.12, w = bw1 * 0.36, h1 = Math.max(0, ink[i]) / sc2.top * ih, h2 = Math.max(0, trend[i]) / sc2.top * ih;
      return `<rect x="${x0}" y="${T + ih - h1}" width="${w}" height="${h1}" rx="3" class="b-in"><title>${MAANDNAAM(k)} inkomen: ${euro(ink[i])}</title></rect><rect x="${x0 + w + 2}" y="${T + ih - h2}" width="${w}" height="${h2}" rx="3" class="b-uit"><title>${MAANDNAAM(k)} uitgaven: ${euro(trend[i])}</title></rect>`; }).join("")}${mm.map((_, i) => xlab(i)).join("")}</svg>`;
  const somI = ink.reduce((a, b) => a + b, 0), somU = trend.reduce((a, b) => a + b, 0);
  $("#bview").innerHTML = `
    ${budgetVerdeling(B, eind)}
    <section class="rapport"><h2>Uitgaven per maand</h2><p class="muted">Gemiddeld ${euro(Math.round(somU / mm.length))} per maand over ${mm.length} maanden</p><div class="grafiek-wrap">${svg1}</div></section>
    <section class="rapport"><h2>Inkomen en uitgaven</h2><div class="legende"><span><i class="b-in"></i>Inkomen</span><span><i class="b-uit"></i>Uitgaven</span></div><div class="grafiek-wrap">${svg2}</div>
      <p>Over ${mm.length} maanden: inkomen ${euro(somI)}, uitgaven ${euro(somU)}, ${somI - somU >= 0 ? "overschot" : "tekort"} <b>${euro(somI - somU)}</b>.</p>
      <details><summary>Cijfers per maand</summary><div class="btabel-wrap"><table class="btabel"><thead><tr><th scope="col">Maand</th><th scope="col">Inkomen</th><th scope="col">Uitgaven</th><th scope="col">Saldo</th></tr></thead><tbody>${mm.map((k, i) => `<tr><th scope="row">${MAANDNAAM(k)}</th><td>${euro(ink[i])}</td><td>${euro(trend[i])}</td><td>${euro(ink[i] - trend[i])}</td></tr>`).join("")}</tbody></table></div></details></section>`;
}

/* Uitgavenverdeling: halve donut (deel van het geheel, max. 6 + Overige) + meterlijst werkelijk vs budget */
function budgetVerdeling(B, eind){
  const per = S.bperiode || "jaar", wat = S.bper || "groep";
  const jaar = eind.slice(0, 4);
  const mm = per === "jaar" ? B.maanden.filter(k => k.startsWith(jaar) && k <= eind) : [eind];
  const nM = Math.max(1, mm.length);
  const sleutel = c => wat === "groep" ? c.groep_id : c.id;
  const naamVan = id => wat === "groep" ? ((S.budget.groepen.find(g => g.id === id) || {}).naam || "Zonder groep") : ((S.budget.categorieen.find(c => c.id === id) || {}).naam || "?");
  const tot = new Map();
  for (const c of S.budget.categorieen) {
    if (c.activiteit_per_maand) continue;   // kredietkaartbetalingen: geen uitgave (anders dubbel geteld)
    const k = sleutel(c); const t = tot.get(k) || { id: k, uit: 0, budget: 0 };
    for (const m of mm) { const x = B.per[m] && B.per[m].cat[c.id]; if (x) { t.uit += -x.activiteit; t.budget += x.toegewezen; } }
    tot.set(k, t);
  }
  const rijen = [...tot.values()].map(t => ({ ...t, naam: naamVan(t.id) })).filter(t => t.uit > 0 || t.budget > 0).sort((a, b) => b.uit - a.uit);
  const pos = rijen.filter(t => t.uit > 0), som = pos.reduce((s, t) => s + t.uit, 0), budSom = rijen.reduce((s, t) => s + Math.max(0, t.budget), 0);
  const kleuren = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];
  const delen = pos.slice(0, 6).map((t, i) => ({ naam: t.naam, v: t.uit, kleur: kleuren[i] }));
  const rest = pos.slice(6).reduce((s, t) => s + t.uit, 0);
  if (rest > 0) delen.push({ naam: `Overige (${pos.length - 6})`, v: rest, kleur: "var(--s-rest)" });
  // halve donut: van links (180°) over boven naar rechts (360°)
  const cx = 160, cy = 150, R = 140, r = 84;
  const pt = (a, rad) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
  let a0 = Math.PI;
  const paden = som > 0 ? delen.map(d => {
    const a1 = a0 + Math.PI * d.v / som, groot = a1 - a0 > Math.PI ? 1 : 0;
    const p = `<path d="M${pt(a0, R)} A${R} ${R} 0 ${groot} 1 ${pt(a1, R)} L${pt(a1, r)} A${r} ${r} 0 ${groot} 0 ${pt(a0, r)}Z" fill="${d.kleur}"><title>${esc(d.naam)}: ${euro(d.v)} (${Math.round(d.v / som * 100)}%)</title></path>`;
    a0 = a1; return p; }).join("") : `<path d="M${pt(Math.PI, R)} A${R} ${R} 0 0 1 ${pt(2 * Math.PI, R)} L${pt(2 * Math.PI, r)} A${r} ${r} 0 0 0 ${pt(Math.PI, r)}Z" fill="var(--sunk)"/>`;
  const periodeTxt = per === "jaar" ? `${jaar} t.e.m. ${MAANDNAAM(eind).split(" ")[0]}` : MAANDNAAM(eind);
  const svg = `<svg class="bv-donut" viewBox="0 0 320 160" role="img" aria-label="Verdeling van de uitgaven ${esc(periodeTxt)}">${paden}
    <text x="${cx}" y="${cy - 22}" text-anchor="middle" class="tot">${euroKort(som)}</text><text x="${cx}" y="${cy - 4}" text-anchor="middle" class="sub">uitgegeven</text></svg>`;
  const pct = v => som > 0 ? Math.round(v / som * 100) + "%" : "–";
  const leg = `<ul class="bv-leg">${delen.map(d => `<li><i style="background:${d.kleur}"></i><span class="pct">${pct(d.v)}</span><span class="nm" title="${esc(d.naam)}">${esc(d.naam)}</span><span class="bdr">${euroKort(d.v)}</span></li>`).join("")}</ul>`;
  const verschil = budSom - som;
  const cijfers = `<div class="bv-cijfers"><div><span class="lbl-klein">Budget</span><b>${euroKort(budSom)}</b></div><div><span class="lbl-klein">Werkelijk</span><b>${euroKort(som)}</b></div>
    <div><span class="lbl-klein">${verschil >= 0 ? "Nog over" : "Te veel"}</span><b class="${verschil < 0 ? "neg" : ""}">${euroKort(Math.abs(verschil))}</b></div>${per === "jaar" ? `<div><span class="lbl-klein">Per maand</span><b>${euroKort(Math.round(som / nM))}</b></div>` : ""}</div>`;
  const meter = (t, extra) => { const over = t.budget > 0 ? t.uit > t.budget : t.uit > 0, w = t.budget > 0 ? Math.min(100, t.uit / t.budget * 100) : (t.uit > 0 ? 100 : 0);
    return `<div class="bv-rij ${over ? "over" : ""} ${extra || ""}"><span class="nm">${esc(t.naam)}</span><span class="waarde">${euroKort(t.uit)}</span>
      <span class="meter" role="img" aria-label="${esc(t.naam)}: ${euroKort(t.uit)} van ${euroKort(t.budget)}"><i style="width:${w.toFixed(1)}%"></i></span>
      <span class="uitleg"><b>${euroKort(t.uit)}</b> van ${euroKort(Math.max(0, t.budget))} budget${over ? ` · <b style="color:var(--danger)">${euroKort(t.uit - Math.max(0, t.budget))} over</b>` : ""}</span>
      <span class="rechts">${per === "jaar" ? `${euroKort(Math.round(t.uit / nM))}/m` : ""}</span></div>`; };
  const lijst = rijen.filter(t => t.uit > 0);
  const toon = S.bvAlles ? lijst : lijst.slice(0, 10);
  const seg = (attr, waarde, opties) => `<div class="seg" role="group">${opties.map(([k, l]) => `<button ${attr}="${k}" aria-pressed="${waarde === k}">${l}</button>`).join("")}</div>`;
  return `<section class="rapport bv">
    <div class="bv-kop"><h2>Uitgaven ${esc(periodeTxt)}</h2><div class="bv-ctl">${seg("data-bperiode", per, [["maand", "Maand"], ["jaar", "Jaar"]])}${seg("data-bper", wat, [["groep", "Per groep"], ["categorie", "Per categorie"]])}</div></div>
    ${cijfers}
    <div class="bv-grafiek">${svg}${leg}</div>
    <div class="bv-lijst">${meter({ naam: "Uitgaven totaal", uit: som, budget: budSom }, "totaal")}${toon.map(t => meter(t)).join("")}</div>
    ${lijst.length > 10 ? `<button class="link" data-bvalles style="margin-top:8px">${S.bvAlles ? "Toon minder" : `Toon alle ${lijst.length}`}</button>` : ""}
  </section>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-bperiode],[data-bper],[data-bvalles]"); if (!b || S.tab !== "budget") return;
  if (b.dataset.bperiode) S.bperiode = b.dataset.bperiode;
  else if (b.dataset.bper) S.bper = b.dataset.bper;
  else S.bvAlles = !S.bvAlles;
  try { pref.set("bverdeling", { p: S.bperiode, w: S.bper }); } catch(_) {}
  budgetRapporten();
});

/* Klein overzicht voor Vandaag */
function budgetKort() {
  if (!S.budget) return "";
  const B = budgetBerekening(), m = S.budget.huidig, r = B.per[m];
  const boodsch = S.budget.categorieen.find(c => /boodschap/i.test(c.naam));
  const over = S.budget.categorieen.filter(c => r.cat[c.id].beschikbaar < 0);
  return { teVerdelen: r.teVerdelen, boodsch: boodsch ? { naam: boodsch.naam, b: r.cat[boodsch.id].beschikbaar } : null, over: over.map(c => ({ naam: c.naam, b: r.cat[c.id].beschikbaar })) };
}

<script>/* Kring – R3 Gezin: Vandaag-overzicht, lijsten (to-do en vrije lijsten), activiteit en snel toevoegen. */
"use strict";
const LIJSTSOORT = [["todo", "To-do"], ["lijst", "Lijst"], ["boodschap", "Boodschappen"]];
const ik = () => S.leden.find(l => l.id === S.ik) || S.leden[0] || { naam: "Ik" };

function tijdGeleden(ts) {
  const s = (Date.now() - new Date(ts).getTime()) / 1000;
  if (s < 60) return "net nu"; if (s < 3600) return `${Math.floor(s / 60)} min geleden`; if (s < 86400) return `${Math.floor(s / 3600)} u geleden`;
  const d = Math.floor(s / 86400); return d === 1 ? "gisteren" : `${d} dagen geleden`;
}

function nieuwsKaart(kaart) {
  const grens = AG.plus(AG.iso(new Date()), -7), zb = zietBudget();
  const n = NIEUWS.filter(x => x.datum >= grens && (zb || !x.budget));
  if (!n.length) return "";

/* ---------- Snel toevoegen ---------- */
// "morgen 19u kapper", "vrijdag ramen wassen", "12/11 oudercontact 17u30", "melk" → datum, tijd en rest
function leesSnel(tekst) {
  let t = " " + tekst.trim() + " ", datum = null, tijd = null;
  const vd = AG.iso(new Date());
  const m1 = t.match(/\s(\d{1,2})[u:h.](\d{2})?\s/i) || t.match(/\s(\d{1,2})[u:h]\s/i);
  if (m1 && +m1[1] < 24) { tijd = `${String(m1[1]).padStart(2, "0")}:${m1[2] || "00"}`; t = t.replace(m1[0], " "); }
  const dagen = { maandag: 1, dinsdag: 2, woensdag: 3, donderdag: 4, vrijdag: 5, zaterdag: 6, zondag: 7 };
  const m2 = t.match(/\s(vandaag|vanavond|morgen|overmorgen|maandag|dinsdag|woensdag|donderdag|vrijdag|zaterdag|zondag)\s/i);
  if (m2) { const w = m2[1].toLowerCase(); datum = w === "vandaag" || w === "vanavond" ? vd : w === "morgen" ? AG.plus(vd, 1) : w === "overmorgen" ? AG.plus(vd, 2) : AG.plus(vd, ((dagen[w] - AG.weekdag(vd) + 7) % 7) || 7);
    if (w === "vanavond" && !tijd) tijd = "19:00"; t = t.replace(m2[0], " "); }
  const m3 = t.match(/\s(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\s/);
  if (m3) { let y = m3[3] ? +m3[3] : new Date().getFullYear(); if (y < 100) y += 2000; datum = `${y}-${String(m3[2]).padStart(2, "0")}-${String(m3[1]).padStart(2, "0")}`; if (!m3[3] && datum < vd) datum = `${y + 1}${datum.slice(4)}`; t = t.replace(m3[0], " "); }
  return { titel: t.replace(/\s+(om|op|tegen)\s*$/i, "").replace(/\s+/g, " ").trim(), datum, tijd };
}

         todo: `To-do "${v.titel}" op ${todo[0] ? todo[0].naam : "een nieuwe to-do-lijst"}`, notitie: `Notitie in "Uit mijn hoofd" (enkel jij ziet ze)`, boodschap: `"${v.titel}" op de boodschappenlijst van ${pwLabel()}` })[soort];
  };
  p.oninput = toon;
  p.onclick = e => { const t = e.target.closest("[data-ssoort]"); if (t) { soort = t.dataset.ssoort; gekozen = true; toon(); } };

      else if (soort === "todo") { let l = todo[0]; if (!l) { const id = await db.bewaarLijst({ naam: "To Do", soort: "todo", prive: false, vast: true, eigenaar: ik().id }); await herlaadGezin(); l = S.lijsten.find(x => x.id === id); } await db.bewaarItem(l.id, { tekst: v.titel, klaar: false, lid_id: null, deadline: v.datum }); }
      else await db.addExtra(iso(S.pweek), { naam: v.titel, afdeling: K.afdelingVoor(v.titel) });
      await db.log(({ afspraak: "plande", taak: "maakte taak", todo: "zette op de to-do", boodschap: "zette op de boodschappenlijst" })[soort] + ` '${v.titel}'`);
      await Promise.all([herlaadAgenda(), herlaadGezin(), herlaadWeek()]); sluitPaneel(); render(); toast("Toegevoegd");
    });
  };
}

<script>/* Kring – Diepvries: plaatsen (variabele indeling), categorieën, genummerde dozen en inhoud.
   Zelfde regels als 20261109_gezin_diepvries.sql: bij invriezen worden naam, plaats en eet-voor aangevuld,
   één doos bevat één inhoud, uithalen kan per portie. Gebruikt de globale hulpfuncties ($, esc, S, db, run, openPaneel …). */
"use strict";
const DV_EENH = [["portie", "porties"], ["stuk", "stuks"], ["zak", "zakken"], ["doos", "dozen"], ["pak", "pakken"], ["g", "g"], ["ml", "ml"]];
const DV_SOORT = [["schap", "Schap"], ["bak", "Bak"], ["deur", "Deur"], ["andere", "Andere"]];
const DV_MAATEN = [500, 750, 1000, 1500, 2000];
const dvLabel = n => "D" + String(n).padStart(3, "0");
const dvEenh = (n, u) => { const e = DV_EENH.find(x => x[0] === u) || [u, u]; return n === 1 ? e[0] : e[1]; };
const dvAantal = i => `${fmtNum(i.aantal, 2)} ${dvEenh(Number(i.aantal), i.eenheid)}`;
const dvDatum = ds => { if (!ds) return ""; const [y, m, d] = ds.split("-").map(Number); return `${d} ${MND[m - 1]}${y !== new Date().getFullYear() ? " " + y : ""}`; };
// + maanden zoals Postgres (31 jan + 1 mnd = 28 feb)
function dvPlusMaanden(ds, m){ const [y, mo, d] = ds.split("-").map(Number); const x = new Date(y, mo - 1 + m, d, 12); if (x.getDate() !== d) x.setDate(0); return iso(x); }
function dvMaandenOud(ds){ const [y, m, d] = ds.split("-").map(Number), n = new Date(); return Math.max(0, (n.getFullYear() - y) * 12 + n.getMonth() - (m - 1) - (n.getDate() < d ? 1 : 0)); }
function dvRaadCategorie(naam, bron){
  const s = norm(naam);
  if (bron === "gerecht") return /soep|saus|bouillon/.test(s) ? "Soep en saus" : "Bereide gerechten";
  if (/scampi|garnaal|zalm|kabeljauw|vis|tonijn|schartong|mossel/.test(s)) return "Vis";
  if (/kip|gehakt|varken|rund|steak|worst|hamburger|spek|vlees|kalkoen|lams/.test(s)) return "Vlees";
  if (/framboos|frambozen|aardbei|bessen|fruit|mango|kers/.test(s)) return "Fruit";
  if (/broccoli|bonen|spinazie|erwt|wortel|prei|groente|bloemkool|spruit|ui|paprika|mais|maïs/.test(s)) return "Groenten";
  if (/brood|pistolet|croissant|deeg|pizza|wafel|stokbrood/.test(s)) return "Brood en deeg";
  if (/ijs|sorbet|dessert|taart|gebak/.test(s)) return "IJs en dessert";
  if (/kruid|basilicum|peterselie|bieslook|look/.test(s)) return "Kruiden";
  return "Andere";
}

/* ---------- Gedeelde regel: invriezen aanvullen (zoals de databasetrigger) ---------- */
function dvAanvullen(v, dv){
  const it = { soort: "vrij", aantal: 1, eenheid: "portie", ingevroren_op: iso(new Date()), notitie: "", ...v };
  if (!norm(it.naam)) it.naam = (it.gerecht_id && (gerecht(it.gerecht_id) || {}).naam) || (it.product_id && (product(it.product_id) || {}).naam) || "";
  const c = dv.categorieen.find(x => x.id === it.categorie_id);
  if (!it.plaats_id && c) it.plaats_id = c.plaats_id;
  if (!it.eet_voor) it.eet_voor = dvPlusMaanden(it.ingevroren_op, c ? c.bewaar_maanden : 3);
  return it;
}

/* ---------- Testdata ---------- */
function demoDiepvries(d){
  const pl = [["S1", "Schap boven", "schap"], ["S2", "Schap onder", "schap"], ["B1", "Bak 1", "bak"], ["B2", "Bak 2", "bak"], ["B3", "Bak 3", "bak"], ["B4", "Bak 4", "bak"], ["B5", "Bak 5", "bak"]]
    .map(([code, naam, soort], i) => ({ id: uid(), code, naam, soort, volgorde: i + 1, actief: true }));
  const pid = c => pl.find(p => p.code === c).id;
  const categorieen = [["Bereide gerechten", "B1", 3], ["Soep en saus", "B1", 3], ["Vlees", "B2", 6], ["Vis", "B2", 4], ["Groenten", "B3", 8], ["Fruit", "B3", 8],
    ["Brood en deeg", "B4", 3], ["IJs en dessert", "B5", 2], ["Kruiden", "S1", 6], ["Andere", "S2", 3]]
    .map(([naam, code, m], i) => ({ id: uid(), naam, plaats_id: pid(code), bewaar_maanden: m, volgorde: i + 1 }));
  const dozen = Array.from({ length: 30 }, (_, i) => ({ id: uid(), nummer: i + 1, label: dvLabel(i + 1), inhoud_ml: i < 20 ? 1000 : 500, vorm: i < 20 ? "rechthoekig 1 l" : "rechthoekig 500 ml", actief: true }));
  const dv = { plaatsen: pl, categorieen, dozen, items: [] };
  const cat = n => categorieen.find(c => c.naam === n).id;
  const vd = new Date(), dag = n => iso(plus(vd, -n));
  const g = n => (d.gerechten.find(x => x.naam.toLowerCase().startsWith(n.toLowerCase())) || {});
  const p = n => (d.producten.find(x => x.naam.toLowerCase().includes(n)) || {});
  const voeg = (v, doos) => dv.items.push({ id: uid(), uit_op: null, ...dvAanvullenDemo({ ...v, doos_id: doos ? dozen[doos - 1].id : null }, dv, d) });
  voeg({ soort: "gerecht", gerecht_id: g("Spaghetti bolognaise").id, naam: g("Spaghetti bolognaise").naam || "Bolognaisesaus", categorie_id: cat("Bereide gerechten"), aantal: 4, ingevroren_op: dag(110) }, 3);
  voeg({ soort: "gerecht", gerecht_id: g("Stoofvlees").id, naam: g("Stoofvlees").naam || "Stoofvlees", categorie_id: cat("Bereide gerechten"), aantal: 2, ingevroren_op: dag(40) }, 9);
  voeg({ soort: "vrij", naam: "Pompoensoep", categorie_id: cat("Soep en saus"), aantal: 1, eenheid: "stuk", notitie: "1 liter", ingevroren_op: dag(34) }, 12);
  voeg({ soort: "gerecht", gerecht_id: g("Griekse gehaktballetjes").id, naam: g("Griekse gehaktballetjes").naam || "Gehaktballetjes", categorie_id: cat("Bereide gerechten"), aantal: 3, ingevroren_op: dag(7) }, 17);
  voeg({ soort: "gerecht", gerecht_id: g("Kip-preipie").id, naam: g("Kip-preipie").naam || "Kip-preipie", categorie_id: cat("Bereide gerechten"), aantal: 2, ingevroren_op: dag(3) }, 21);
  voeg({ soort: "product", product_id: p("scampi").id, naam: p("scampi").naam || "Scampi", categorie_id: cat("Vis"), aantal: 1, eenheid: "zak", ingevroren_op: dag(20) });
  voeg({ soort: "vrij", naam: "Kipfilet", categorie_id: cat("Vlees"), aantal: 4, eenheid: "stuk", ingevroren_op: dag(170) });
  voeg({ soort: "product", product_id: p("broccoli").id, naam: p("broccoli").naam || "Broccoli", categorie_id: cat("Groenten"), aantal: 1, eenheid: "zak", ingevroren_op: dag(60) });
  voeg({ soort: "product", product_id: p("sperziebonen").id, naam: p("sperziebonen").naam || "Sperziebonen", categorie_id: cat("Groenten"), aantal: 2, eenheid: "zak", ingevroren_op: dag(25) });
  voeg({ soort: "product", product_id: p("frambozen").id, naam: p("frambozen").naam || "Frambozen", categorie_id: cat("Fruit"), aantal: 1, eenheid: "zak", ingevroren_op: dag(90) });
  voeg({ soort: "vrij", naam: "Pistolets", categorie_id: cat("Brood en deeg"), aantal: 8, eenheid: "stuk", ingevroren_op: dag(12) });
  voeg({ soort: "vrij", naam: "Vanille-ijs", categorie_id: cat("IJs en dessert"), aantal: 1, eenheid: "doos", ingevroren_op: dag(50) });
  // Ligt niet waar de indeling het verwacht (frieten bij de groenten gelegd)
  const fr = p("frieten");
  dv.items.push({ id: uid(), uit_op: null, ...dvAanvullenDemo({ soort: "product", product_id: fr.id, naam: fr.naam || "Frieten", categorie_id: cat("Andere"), plaats_id: pid("B3"), aantal: 1, eenheid: "zak", ingevroren_op: dag(15) }, dv, d) });
  return dv;
}
// Variant die niet afhangt van S (testdata wordt opgebouwd vóór de app geladen is)
function dvAanvullenDemo(v, dv, d){
  const it = { soort: "vrij", aantal: 1, eenheid: "portie", ingevroren_op: iso(new Date()), notitie: "", ...v };
  const c = dv.categorieen.find(x => x.id === it.categorie_id);
  if (!it.plaats_id && c) it.plaats_id = c.plaats_id;
  if (!it.eet_voor) it.eet_voor = dvPlusMaanden(it.ingevroren_op, c ? c.bewaar_maanden : 3);
  if (!it.gerecht_id) delete it.gerecht_id;
  if (!it.product_id) delete it.product_id;
  return it;
}

/* ---------- Opslag ---------- */
window.DV_LOCAL = {
  async loadDiepvries(){
    if (!this.d.diepvries) { this.d.diepvries = demoDiepvries(this.d); this.save(); }
    const dv = JSON.parse(JSON.stringify(this.d.diepvries)); dv.items = dv.items.filter(i => !i.uit_op); return dv;
  },
  async dvInvriezen(v){
    const dv = this.d.diepvries, it = dvAanvullen(v, dv);
    if (!norm(it.naam)) throw new Error("geef aan wat je invriest");
    if (it.doos_id){
      const d = dv.dozen.find(x => x.id === it.doos_id);
      if (!d || !d.actief) throw new Error("deze doos is niet in gebruik");
      if (dv.items.some(i => i.doos_id === it.doos_id && !i.uit_op)) throw new Error(`${d.label} is al gevuld`);
    }
    it.id = uid(); it.uit_op = null; dv.items.push(it); this.save();
    const waar = [(dv.dozen.find(x => x.id === it.doos_id) || {}).label, (dv.plaatsen.find(x => x.id === it.plaats_id) || {}).code].filter(Boolean).join(", ");
    await this.log(`vroor '${it.naam}' in${waar ? ` (${waar})` : ""}`);
    return it;
  },
  async dvUit(id, n){
    const i = this.d.diepvries.items.find(x => x.id === id);
    if (!i || i.uit_op) throw new Error("al uitgehaald");
    if (n == null || n >= i.aantal){ i.uit_op = new Date().toISOString(); this.save(); await this.log(`haalde '${i.naam}' uit de diepvries`); return { rest: 0, doos_vrij: !!i.doos_id }; }
    i.aantal = Math.round((i.aantal - n) * 100) / 100; this.save();
    await this.log(`haalde ${fmtNum(n)} ${dvEenh(n, i.eenheid)} '${i.naam}' uit de diepvries`);
    return { rest: i.aantal, doos_vrij: false };
  },
  async dvBewaarItem(id, w){ Object.assign(this.d.diepvries.items.find(x => x.id === id), w); this.save(); },
  async dvBewaarIndeling(plaatsen, categorieen){ this.d.diepvries.plaatsen = plaatsen; this.d.diepvries.categorieen = categorieen; this.save(); },
  async dvDozenToevoegen(n, ml, vorm){
    const dz = this.d.diepvries.dozen, start = dz.reduce((m, d) => Math.max(m, d.nummer), 0) + 1;
    const nieuw = Array.from({ length: n }, (_, k) => ({ id: uid(), nummer: start + k, label: dvLabel(start + k), inhoud_ml: ml || null, vorm: vorm || null, actief: true }));
    dz.push(...nieuw); this.save(); return nieuw.map(d => d.label);
  },
  async dvDoosActief(id, val){ this.d.diepvries.dozen.find(x => x.id === id).actief = val; this.save(); }
};
window.DV_SUPA = {
  async loadDiepvries(){
    const q = t => this.g.from(t).select("*").eq("huishouden_id", this.h);
    const [p, c, d, i] = await Promise.all([q("diepvries_plaatsen").order("volgorde"), q("diepvries_categorieen").order("volgorde"),
      q("diepvries_dozen").order("nummer"), q("diepvries_items").is("uit_op", null)]);
    return { plaatsen: this.ok(p), categorieen: this.ok(c), dozen: this.ok(d), items: this.ok(i).map(x => ({ ...x, aantal: Number(x.aantal) })) };
  },
  async dvInvriezen(v){
    const r = { huishouden_id: this.h, soort: v.soort, gerecht_id: v.gerecht_id || null, product_id: v.product_id || null, naam: norm(v.naam) ? v.naam.trim() : null,
      categorie_id: v.categorie_id || null, plaats_id: v.plaats_id || null, doos_id: v.doos_id || null, aantal: v.aantal, eenheid: v.eenheid,
      ingevroren_op: v.ingevroren_op, eet_voor: v.eet_voor || null, notitie: v.notitie || null };
    const { data, error } = await this.g.from("diepvries_items").insert(r).select().single();
    if (error) throw new Error(/diepvries_doos_bezet/.test(error.message) ? "deze doos is al gevuld" : error.message);
    return data;
  },
  async dvUit(id, n){ const r = this.ok(await this.g.rpc("diepvries_uit", { p_item: id, p_aantal: n == null ? null : n })); if (r.fout) throw new Error(r.fout); return r; },
  async dvBewaarItem(id, w){ this.ok(await this.g.from("diepvries_items").update(w).eq("id", id)); },
  async dvBewaarIndeling(plaatsen, categorieen){
    this.ok(await this.g.from("diepvries_plaatsen").upsert(plaatsen.map(p => ({ id: p.id, huishouden_id: this.h, code: p.code, naam: p.naam, soort: p.soort, volgorde: p.volgorde, actief: p.actief }))));
    this.ok(await this.g.from("diepvries_categorieen").upsert(categorieen.map(c => ({ id: c.id, huishouden_id: this.h, naam: c.naam, plaats_id: c.plaats_id || null, bewaar_maanden: c.bewaar_maanden, volgorde: c.volgorde }))));
  },
  async dvDozenToevoegen(n, ml, vorm){ return this.ok(await this.g.rpc("diepvries_dozen_toevoegen", { p_huishouden: this.h, p_aantal: n, p_inhoud_ml: ml || null, p_vorm: vorm || null })); },
  async dvDoosActief(id, val){ this.ok(await this.g.from("diepvries_dozen").update({ actief: val }).eq("id", id)); }
};
async function herlaadDiepvries(){ try { S.dv = await db.loadDiepvries(); } catch(e){ console.error(e); S.dv = { plaatsen: [], categorieen: [], dozen: [], items: [] }; } }

/* ---------- Afgeleide gegevens ---------- */
const dvPlaatsen = (alle) => S.dv.plaatsen.filter(p => alle || p.actief).sort((a, b) => a.volgorde - b.volgorde || a.code.localeCompare(b.code));
const dvPlaats = id => S.dv.plaatsen.find(p => p.id === id);
const dvDoos = id => S.dv.dozen.find(d => d.id === id);
const dvCat = id => S.dv.categorieen.find(c => c.id === id);
const dvBezet = () => new Set(S.dv.items.map(i => i.doos_id).filter(Boolean));
function dvVerrijk(i){
  if (!i) return null;
  const vd = iso(new Date()), c = dvCat(i.categorie_id), hoort = c && c.plaats_id ? dvPlaats(c.plaats_id) : null;
  return { ...i, cat: c, plaats: dvPlaats(i.plaats_id), doos: (dvDoos(i.doos_id) || {}).label || "", hoort,
    buiten: !!(hoort && i.plaats_id && hoort.id !== i.plaats_id),
    status: i.eet_voor && i.eet_voor < vd ? "oud" : i.eet_voor && i.eet_voor <= iso(plus(new Date(), 14)) ? "binnenkort" : "",
    maanden: dvMaandenOud(i.ingevroren_op) };
}
const dvOud = m => m === 0 ? "deze maand" : m === 1 ? "1 maand" : `${m} maanden`;

/* ---------- Scherm ---------- */
function viewDiepvries(){
  if (S.vrRuimte && S.vrRuimte !== "diepvries") return viewRuimte();
  dvBody();
  $("#view").insertAdjacentHTML("afterbegin", vrKop());
}
function dvBody(){
  const items = S.dv.items.map(dvVerrijk), pl = dvPlaatsen();
  const eerst = items.filter(i => i.status), buiten = items.filter(i => i.buiten);
  const actief = S.dv.dozen.filter(d => d.actief), bezet = dvBezet();
  const z = norm(S.dvZoek);
  const rows = items.filter(i => (!S.dvPlaats || i.plaats_id === S.dvPlaats)
      && (S.dvFilter === "alle" || (S.dvFilter === "eerst" ? i.status : i.buiten))
      && (!z || norm(i.naam).includes(z) || norm(i.doos).includes(z) || norm(i.notitie).includes(z)))
    .sort((a, b) => (a.eet_voor || "").localeCompare(b.eet_voor || "") || a.naam.localeCompare(b.naam, "nl"));
  const groepen = S.dvPlaats ? [[dvPlaats(S.dvPlaats), rows]]
    : [...pl, null].map(p => [p, rows.filter(i => p ? i.plaats_id === p.id : !pl.some(x => x.id === i.plaats_id))]).filter(([, l]) => l.length);
  const catsVan = p => S.dv.categorieen.filter(c => c.plaats_id === p.id).sort((a, b) => a.volgorde - b.volgorde).map(c => c.naam);
  $("#view").innerHTML = (db.demo ? `<div class="banner"><b>Testversie diepvries</b> met voorbeeldinhoud en dozen D001–D030. Een doos openen kan met het nummer hieronder of met een link zoals <b>#diepvries/D017</b> (wat de QR-code op het etiket doet).</div>` : "") + `
    <div class="samenvatting">
      <div><span class="getal">${items.length}</span> <span class="muted">in de diepvries · ${actief.filter(d => !bezet.has(d.id)).length} van ${actief.length} dozen vrij</span></div>
      ${eerst.length ? `<button class="link" data-dvfilter="eerst">${eerst.length} eerst opeten →</button>` : ""}
    </div>
    <div class="acties">
      <button class="knop" data-dvinvriezen>+ Invriezen</button>
      <form class="dv-zoekdoos" id="dv-doosform"><input class="in" id="dv-doosnr" inputmode="numeric" autocomplete="off" placeholder="Doosnr, bv. 17" aria-label="Doosnummer" value="${esc(S.dvDoosnr || "")}"><button class="knop sec">Open doos</button></form>
      <button class="knop sec" data-dvindeling>Indeling</button>
      <button class="knop sec" data-dvdozen>Dozen</button>
    </div>
    <div class="dv-grid">
      <div class="dv-kast" role="group" aria-label="Diepvriezer">
        ${pl.map(p => { const n = items.filter(i => i.plaats_id === p.id), w = n.filter(i => i.status).length, cs = catsVan(p);
          return `<button class="dv-vak ${esc(p.soort)} ${S.dvPlaats === p.id ? "sel" : ""}" data-dvplaats="${p.id}" aria-pressed="${S.dvPlaats === p.id}">
            <span class="dv-code">${esc(p.code)}</span><span class="dv-naam">${esc(p.naam)}<small>${cs.length ? esc(cs.join(", ")) : "nog niets toegewezen"}</small></span>
            <span class="dv-n">${n.length}${w ? `<i title="eerst opeten">${w}</i>` : ""}</span></button>`; }).join("")}
      </div>
      <div>
        <div class="chips">
          ${[["alle", "Alles"], ["eerst", `Eerst opeten (${eerst.length})`], ["buiten", `Buiten indeling (${buiten.length})`]].map(([k, l]) => `<button class="chip" data-dvfilter="${k}" aria-pressed="${S.dvFilter === k}">${l}</button>`).join("")}
          ${S.dvPlaats ? `<button class="chip" data-dvplaats="" aria-pressed="true">${esc(dvPlaats(S.dvPlaats).code)} ✕</button>` : ""}
        </div>
        <input class="in" id="dv-zoek" type="search" placeholder="Zoek op naam of doos" value="${esc(S.dvZoek)}" aria-label="Zoek in de diepvries" style="margin-bottom:8px">
        <div id="dv-lijst">${dvLijstHtml(groepen)}</div>
      </div>
    </div>`;
}
function dvLijstHtml(groepen){
  if (!groepen.length) return `<div class="leegstaat">${S.dv.items.length ? "Niets gevonden." : "De diepvries is leeg. Vries iets in met <b>+ Invriezen</b>."}</div>`;
  return groepen.map(([p, l]) => `<div class="groep"><h3><span>${p ? `${esc(p.code)} · ${esc(p.naam)}` : "Zonder plaats"}</span><span>${l.length}</span></h3>
    ${l.map(i => `<button class="dv-rij" data-dvitem="${i.id}">
      <span class="dv-doos ${i.doos ? "" : "geen"}">${i.doos || "los"}</span>
      <span class="dv-wat"><b>${esc(i.naam)}</b><small>${dvAantal(i)} · ${dvOud(i.maanden)} oud${i.buiten ? ` · <span class="neg-tekst">hoort in ${esc(i.hoort.code)}</span>` : ""}${i.notitie ? " · " + esc(i.notitie) : ""}</small></span>
      <span class="tag ${i.status}">${i.status === "oud" ? "op sinds " : "eet voor "}${dvDatum(i.eet_voor)}</span></button>`).join("")}</div>`).join("");
}
function dvVandaagKaart(kaart){
  const dv = S.dv ? S.dv.items.map(dvVerrijk).filter(i => i.status).map(i => ({ t: (i.doos ? `<b>${esc(i.doos)}</b> ` : "") + esc(i.naam), a: dvAantal(i), eet: i.eet_voor, st: i.status, w: "diepvries" })) : [];
  const vr = S.vr ? S.vr.items.filter(i => !i.op_op && vrStatus(i)).map(i => ({ t: esc(i.naam), a: vrAantal(i), eet: i.eet_voor, st: vrStatus(i), w: (vrRuimte(i.ruimte_id) || {}).code || "" })) : [];
  const l = dv.concat(vr).sort((a, b) => a.eet.localeCompare(b.eet));
  if (!l.length) return "";
  return kaart("Eerst opeten", `<ul class="vlijst">${l.slice(0, 6).map(i => `<li><span>${i.t} <span class="muted">${i.a} · ${esc(i.w)}</span></span><span class="${i.st === "oud" ? "neg-tekst" : "muted"}">${dvDatum(i.eet)}</span></li>`).join("")}</ul>`,
    `<button class="link" data-goto="diepvries">Voorraad</button>`);
}

/* ---------- Doos openen (nummer of QR-link #diepvries/D017) ---------- */
function dvNormLabel(s){ const m = String(s || "").match(/\d+/); return m ? dvLabel(+m[0]) : null; }
function openDoos(invoer){
  const label = dvNormLabel(invoer), d = label && S.dv.dozen.find(x => x.label === label);
  if (!d) { toast(label ? `${label} bestaat niet. Maak nieuwe dozen aan via Dozen.` : "Geef een doosnummer"); return; }
  const it = S.dv.items.find(i => i.doos_id === d.id);
  if (it) return openDvItem(it.id);
  if (!d.actief) { toast(`${d.label} staat op niet in gebruik`); return; }
  openInvriezen({ doos_id: d.id });
}
function dvOpenUitHash(){
  const m = location.hash.match(/^#diepvries\/(.+)$/); if (!m) return;
  history.replaceState(null, "", "#diepvries");
  if (S.vrRuimte !== "diepvries"){ S.vrRuimte = "diepvries"; render(); }
  openDoos(decodeURIComponent(m[1]));
}

/* ---------- Item: uithalen, verplaatsen, aanpassen ---------- */
function openDvItem(id){
  const i = dvVerrijk(S.dv.items.find(x => x.id === id)); if (!i) return;
  let n = Math.min(1, i.aantal);
  const stap = i.eenheid === "g" || i.eenheid === "ml" ? 100 : 1;
  if (stap > 1) n = Math.min(stap, i.aantal);
  openPaneel(`
    <div class="paneel-kop">${i.doos ? `<span class="dv-doos dv-groot">${esc(i.doos)}</span>` : ""}<h2>${esc(i.naam)}</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    <dl class="kv">
      <dt>Aantal</dt><dd>${dvAantal(i)}</dd>
      <dt>Ingevroren</dt><dd>${dvDatum(i.ingevroren_op)} (${dvOud(i.maanden)})</dd>
      <dt>Eet voor</dt><dd class="${i.status === "oud" ? "neg-tekst" : ""}">${dvDatum(i.eet_voor)}</dd>
      <dt>Plaats</dt><dd>${i.plaats ? esc(i.plaats.code + " · " + i.plaats.naam) : "—"}</dd>
      <dt>Categorie</dt><dd>${i.cat ? esc(i.cat.naam) : "—"}</dd>
    </dl>
    ${i.buiten ? `<div class="banner">Volgens de indeling hoort dit in <b>${esc(i.hoort.code)} · ${esc(i.hoort.naam)}</b>. Verplaatst? Pas de plaats hieronder aan.</div>` : ""}
    <h3>Uithalen</h3>
    <div class="instrij" style="flex-wrap:wrap">
      <div class="stepper"><button class="ib" data-n="-1" aria-label="Minder">−</button><output id="dv-n">${fmtNum(n)}</output><button class="ib" data-n="1" aria-label="Meer">+</button></div>
      <span class="muted" id="dv-n-eenh">${dvEenh(n, i.eenheid)}</span>
      <button class="knop" data-dvuit>Uithalen</button>
      <button class="knop sec" data-dvalles>Alles uithalen</button>
    </div>
    <h3 style="margin-top:18px">Aanpassen</h3>
    <div class="rij">
      <div class="veld"><label for="dv-plaats">Plaats</label><select class="in" id="dv-plaats">${dvPlaatsOpties(i.plaats_id)}</select></div>
      <div class="veld"><label for="dv-eet">Eet voor</label><input class="in" type="date" id="dv-eet" value="${esc(i.eet_voor || "")}" min="${esc(i.ingevroren_op)}"></div>
    </div>
    <div class="veld"><label for="dv-notitie">Notitie</label><input class="in" id="dv-notitie" value="${esc(i.notitie || "")}" placeholder="pikant, zonder look …"></div>
    <div class="voet"><button class="knop" data-dvbewaar>Bewaren</button></div>`);
  const p = $("#paneel");
  p.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.n){ n = Math.max(stap, Math.min(i.aantal, n + Number(t.dataset.n) * stap)); $("#dv-n").textContent = fmtNum(n); $("#dv-n-eenh").textContent = dvEenh(n, i.eenheid); }
    if ("dvuit" in t.dataset || "dvalles" in t.dataset) run(async () => {
      const alles = "dvalles" in t.dataset || n >= i.aantal;
      const r = await db.dvUit(i.id, alles ? null : n);
      await Promise.all([herlaadDiepvries(), herlaadGezin()]); sluitPaneel(); render();
      toast(r.rest > 0 ? `Nog ${fmtNum(r.rest)} ${dvEenh(r.rest, i.eenheid)} over` : i.doos ? `${i.doos} is nu leeg en vrij` : "Uitgehaald");
    });
    if ("dvbewaar" in t.dataset) run(async () => {
      const eet = $("#dv-eet").value;
      if (eet && eet < i.ingevroren_op){ toast("Eet voor kan niet vóór de invriesdatum liggen"); return; }
      await db.dvBewaarItem(i.id, { plaats_id: $("#dv-plaats").value || null, eet_voor: eet || null, notitie: $("#dv-notitie").value.trim() || null });
      await herlaadDiepvries(); sluitPaneel(); render(); toast("Bewaard");
    });
  };
}
const dvPlaatsOpties = (sel, leeg) => (leeg ? `<option value="">${leeg}</option>` : "") + dvPlaatsen(true).map(p => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(p.code)} · ${esc(p.naam)}${p.actief ? "" : " (niet in gebruik)"}</option>`).join("");

/* ---------- Invriezen ---------- */
function openInvriezen(opts = {}){
  const st = { bron: "gerecht", gerecht_id: null, product_id: null, naam: "", cat: null, plaatsGezet: false, doos_id: opts.doos_id || null,
    aantal: 2, eenheid: "portie", datum: iso(new Date()), zoek: "" };
  const bezet = dvBezet();
  const vrij = S.dv.dozen.filter(d => d.actief && !bezet.has(d.id)).sort((a, b) => a.nummer - b.nummer);
  if (!st.doos_id && vrij.length) st.doos_id = vrij[0].id;
  const catId = n => (S.dv.categorieen.find(c => c.naam === n) || {}).id || null;
  const vast = opts.doos_id ? dvDoos(opts.doos_id) : null;
  openPaneel(`
    <div class="paneel-kop">${vast ? `<span class="dv-doos dv-groot">${esc(vast.label)}</span>` : ""}<h2>Invriezen</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    ${vast ? `<p class="muted" style="margin-top:-6px">Deze doos is leeg${vast.inhoud_ml ? ` (${fmtNum(vast.inhoud_ml / 1000)} l)` : ""}. Wat gaat erin?</p>` : ""}
    <div class="seg" role="group" aria-label="Wat vries je in" style="margin-bottom:12px">
      ${[["gerecht", "Gerecht"], ["product", "Product"], ["vrij", "Iets anders"]].map(([k, l]) => `<button data-bron="${k}" aria-pressed="${k === st.bron}">${l}</button>`).join("")}
    </div>
    <div id="dv-zoekblok"><input class="in" id="dv-izoek" type="search" placeholder="Zoek een gerecht" aria-label="Zoek" autofocus><div class="keuzes" id="dv-keuzes"></div></div>
    <div id="dv-vrijblok" hidden><div class="veld"><label for="dv-naam">Wat</label><input class="in" id="dv-naam" placeholder="bv. pompoensoep, restje lasagne"></div></div>
    <p class="neg-tekst" id="dv-fout-wat" hidden style="font-size:.88rem;margin:6px 0 0"></p>
    <div class="rij" style="margin-top:12px">
      <div class="veld dv-aantal"><label>Aantal</label><div class="instrij" style="flex-wrap:wrap"><div class="stepper"><button class="ib" data-a="-1" aria-label="Minder">−</button><output id="dv-a">${st.aantal}</output><button class="ib" data-a="1" aria-label="Meer">+</button></div>
        <select class="in" id="dv-eenh" aria-label="Eenheid" style="width:auto;min-width:110px">${DV_EENH.map(([k, l]) => `<option value="${k}" ${k === st.eenheid ? "selected" : ""}>${l}</option>`).join("")}</select></div></div>
      <div class="veld"><label for="dv-datum">Ingevroren op</label><input class="in" type="date" id="dv-datum" value="${st.datum}" max="${st.datum}"></div>
    </div>
    <div class="rij">
      <div class="veld"><label for="dv-cat">Categorie</label><select class="in" id="dv-cat">${S.dv.categorieen.slice().sort((a, b) => a.volgorde - b.volgorde).map(c => `<option value="${c.id}">${esc(c.naam)} (${c.bewaar_maanden} mnd)</option>`).join("")}</select></div>
      <div class="veld"><label for="dv-pl">Plaats</label><select class="in" id="dv-pl">${dvPlaatsOpties(null, "volgens categorie")}</select></div>
    </div>
    <div class="veld"><label for="dv-doos">Doos</label><select class="in" id="dv-doos" ${vast ? "disabled" : ""}>
      <option value="">Geen doos (zak of eigen verpakking)</option>
      ${(vast ? [vast] : vrij).map(d => `<option value="${d.id}" ${d.id === st.doos_id ? "selected" : ""}>${d.label}${d.inhoud_ml ? ` · ${fmtNum(d.inhoud_ml / 1000)} l` : ""}</option>`).join("")}
    </select>${!vast && !vrij.length ? `<span class="muted" style="font-size:.85rem">Geen vrije dozen. Maak er bij via Dozen.</span>` : ""}</div>
    <p class="muted" id="dv-samen" style="font-size:.9rem;margin:12px 0 0"></p>
    <div class="voet"><button class="knop sec" data-sluit>Annuleren</button><button class="knop" data-dvvries>Invriezen</button></div>`);
  const p = $("#paneel");
  const keuzes = () => {
    const z = norm(st.zoek);
    const lijst = st.bron === "gerecht"
      ? S.gerechten.filter(g => !z || norm(g.naam).includes(z)).sort((a, b) => a.naam.localeCompare(b.naam, "nl")).slice(0, 8).map(g => ({ id: g.id, naam: g.naam, sub: `${g.porties} pers.` }))
      : S.producten.filter(x => !z || norm(x.naam).includes(z)).sort((a, b) => (b.afdeling === "Diepvries") - (a.afdeling === "Diepvries") || a.naam.localeCompare(b.naam, "nl")).slice(0, 8).map(x => ({ id: String(x.id), naam: x.naam, sub: x.afdeling }));
    const sel = st.bron === "gerecht" ? st.gerecht_id : st.product_id;
    $("#dv-keuzes").innerHTML = lijst.map(k => `<button class="keuze ${String(k.id) === String(sel) ? "sel" : ""}" data-kies="${esc(k.id)}"><span>${esc(k.naam)}</span><span>${esc(k.sub)}</span></button>`).join("")
      || `<p class="muted">Niets gevonden${st.bron === "product" ? ". Gebruik 'Iets anders' voor een product van Comarkt of elders." : "."}</p>`;
  };
  const samen = () => {
    const c = dvCat($("#dv-cat").value), pl = dvPlaats($("#dv-pl").value) || (c && dvPlaats(c.plaats_id)), d = dvDoos($("#dv-doos").value);
    const eet = dvPlusMaanden($("#dv-datum").value || st.datum, c ? c.bewaar_maanden : 3);
    $("#dv-samen").innerHTML = `${d ? `In <b>${d.label}</b>, ` : ""}${pl ? `naar <b>${esc(pl.code)} · ${esc(pl.naam)}</b>` : "zonder plaats"}, eet voor <b>${dvDatum(eet)}</b>.`;
  };
  const zetCat = n => { const id = catId(n); if (id) $("#dv-cat").value = id; samen(); };
  const zetBron = b => {
    st.bron = b; p.querySelectorAll("[data-bron]").forEach(x => x.setAttribute("aria-pressed", x.dataset.bron === b));
    $("#dv-zoekblok").hidden = b === "vrij"; $("#dv-vrijblok").hidden = b !== "vrij";
    $("#dv-izoek").placeholder = b === "gerecht" ? "Zoek een gerecht" : "Zoek een product (diepvries eerst)";
    st.aantal = b === "gerecht" ? 2 : 1; st.eenheid = b === "gerecht" ? "portie" : b === "product" ? "zak" : "portie";
    $("#dv-a").textContent = st.aantal; $("#dv-eenh").value = st.eenheid;
    if (!vast) $("#dv-doos").value = b === "product" ? "" : (vrij[0] || {}).id || "";
    zetCat(b === "gerecht" ? "Bereide gerechten" : "Andere");
    $("#dv-fout-wat").hidden = true; keuzes();
  };
  p.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.bron) zetBron(t.dataset.bron);
    if (t.dataset.kies){
      if (st.bron === "gerecht"){ st.gerecht_id = t.dataset.kies; const g = gerecht(st.gerecht_id); zetCat(dvRaadCategorie(g.naam, "gerecht")); }
      else { st.product_id = t.dataset.kies; const x = product(st.product_id); zetCat(dvRaadCategorie(x.naam, "product")); }
      $("#dv-fout-wat").hidden = true; keuzes();
    }
    if (t.dataset.a){ st.aantal = Math.max(1, st.aantal + Number(t.dataset.a)); $("#dv-a").textContent = st.aantal; }
    if ("dvvries" in t.dataset){
      const fout = m => { const f = $("#dv-fout-wat"); f.textContent = m; f.hidden = false; };
      if (st.bron === "gerecht" && !st.gerecht_id) return fout("Kies een gerecht");
      if (st.bron === "product" && !st.product_id) return fout("Kies een product");
      const naam = $("#dv-naam").value.trim();
      if (st.bron === "vrij" && !naam){ $("#dv-naam").focus(); return fout("Vul in wat je invriest"); }
      run(async () => {
        const it = await db.dvInvriezen({ soort: st.bron, gerecht_id: st.bron === "gerecht" ? st.gerecht_id : null, product_id: st.bron === "product" ? st.product_id : null,
          naam: st.bron === "vrij" ? naam : "", categorie_id: $("#dv-cat").value || null, plaats_id: $("#dv-pl").value || null,
          doos_id: (vast && vast.id) || $("#dv-doos").value || null, aantal: st.aantal, eenheid: $("#dv-eenh").value, ingevroren_op: $("#dv-datum").value || st.datum });
        await Promise.all([herlaadDiepvries(), herlaadGezin()]); sluitPaneel(); render();
        const w = [(dvDoos(it.doos_id) || {}).label, (dvPlaats(it.plaats_id) || {}).code].filter(Boolean).join(" · ");
        toast(`${it.naam} ingevroren${w ? " → " + w : ""}`);
      });
    }
  };
  p.oninput = e => { if (e.target.id === "dv-izoek"){ st.zoek = e.target.value; keuzes(); } if (e.target.id === "dv-naam") $("#dv-fout-wat").hidden = true; };
  p.onchange = e => { if (["dv-cat", "dv-pl", "dv-doos", "dv-datum"].includes(e.target.id)) samen(); };
  zetBron("gerecht");
}

/* ---------- Indeling: plaatsen en wat waar hoort ---------- */
function openIndeling(){
  let pl = JSON.parse(JSON.stringify(dvPlaatsen(true))), cats = JSON.parse(JSON.stringify(S.dv.categorieen)).sort((a, b) => a.volgorde - b.volgorde);
  const lees = () => {
    pl.forEach(p => { const r = $(`[data-pl="${p.id}"]`); if (!r) return; p.code = r.querySelector(".pl-code").value.trim().toUpperCase(); p.naam = r.querySelector(".pl-naam").value.trim(); p.soort = r.querySelector(".pl-soort").value; p.actief = r.querySelector(".pl-actief").checked; });
    cats.forEach(c => { const r = $(`[data-ct="${c.id}"]`); if (!r) return; c.naam = r.querySelector(".ct-naam").value.trim(); c.plaats_id = r.querySelector(".ct-plaats").value || null; c.bewaar_maanden = Number(r.querySelector(".ct-mnd").value) || 0; });
  };
  const teken = () => {
    const optie = sel => `<option value="">— geen —</option>` + pl.map(p => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(p.code || "?")}${p.actief ? "" : " (uit)"}</option>`).join("");
    openPaneel(`
      <div class="paneel-kop"><h2>Indeling diepvriezer</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
      <p class="muted" style="margin-top:-6px">Bepaal zelf welke schappen en bakken er zijn en wat waar hoort. Wat al ligt, verhuist niet mee: het krijgt het label <i>hoort in …</i> tot je het verplaatst.</p>
      <h3>Plaatsen</h3>
      <div class="dv-ind kop"><span>Code</span><span>Naam</span><span>Soort</span><span title="In gebruik">Aan</span></div>
      ${pl.map(p => `<div class="dv-ind" data-pl="${p.id}"><input class="in pl-code" value="${esc(p.code)}" maxlength="6" aria-label="Code"><input class="in pl-naam" value="${esc(p.naam)}" maxlength="60" aria-label="Naam">
        <select class="in pl-soort" aria-label="Soort">${DV_SOORT.map(([k, l]) => `<option value="${k}" ${k === p.soort ? "selected" : ""}>${l}</option>`).join("")}</select>
        <input type="checkbox" class="pl-actief" ${p.actief ? "checked" : ""} aria-label="In gebruik"></div>`).join("")}
      <button class="knop sec klein" data-plnieuw>+ Plaats</button>
      <h3 style="margin-top:18px">Wat hoort waar</h3>
      <div class="dv-ind cat kop"><span>Categorie</span><span>Plaats</span><span>Bewaren (mnd)</span></div>
      ${cats.map(c => `<div class="dv-ind cat" data-ct="${c.id}"><input class="in ct-naam" value="${esc(c.naam)}" maxlength="60" aria-label="Categorie">
        <select class="in ct-plaats" aria-label="Plaats">${optie(c.plaats_id)}</select>
        <input class="in ct-mnd" type="number" min="1" max="36" step="1" value="${c.bewaar_maanden}" aria-label="Bewaren in maanden"></div>`).join("")}
      <button class="knop sec klein" data-ctnieuw>+ Categorie</button>
      <p class="neg-tekst" id="ind-fout" hidden style="font-size:.88rem"></p>
      <p class="muted" style="font-size:.85rem">Bewaartermijnen zijn richtwaarden om te weten wat eerst op moet, geen houdbaarheidsdatum.</p>
      <div class="voet"><button class="knop sec" data-sluit>Annuleren</button><button class="knop" data-indbewaar>Bewaren</button></div>`);
    $("#paneel").onclick = klik;
    $("#paneel").oninput = () => { $("#ind-fout").hidden = true; };
  };
  const klik = e => {
    const t = e.target.closest("button"); if (!t) return;
    if ("plnieuw" in t.dataset){ lees(); const n = pl.filter(p => p.soort === "bak").length + 1; pl.push({ id: uid(), code: "B" + n, naam: "Bak " + n, soort: "bak", volgorde: pl.length + 1, actief: true }); teken(); }
    if ("ctnieuw" in t.dataset){ lees(); cats.push({ id: uid(), naam: "", plaats_id: null, bewaar_maanden: 3, volgorde: cats.length + 1 }); teken(); const r = $(`[data-ct="${cats[cats.length - 1].id}"] .ct-naam`); r.focus(); }
    if ("indbewaar" in t.dataset){
      lees();
      cats = cats.filter(c => c.naam || c.plaats_id);
      const fout = m => { const f = $("#ind-fout"); f.textContent = m; f.hidden = false; };
      const codes = pl.map(p => p.code);
      if (pl.some(p => !p.code || !p.naam)) return fout("Elke plaats heeft een code en een naam nodig.");
      if (new Set(codes).size !== codes.length) return fout("Elke code mag maar één keer voorkomen.");
      if (cats.some(c => !c.naam)) return fout("Geef elke categorie een naam.");
      if (new Set(cats.map(c => norm(c.naam))).size !== cats.length) return fout("Elke categorienaam mag maar één keer voorkomen.");
      if (cats.some(c => !(c.bewaar_maanden >= 1 && c.bewaar_maanden <= 36))) return fout("Bewaren: tussen 1 en 36 maanden.");
      pl.forEach((p, i) => p.volgorde = i + 1); cats.forEach((c, i) => c.volgorde = i + 1);
      run(async () => { await db.dvBewaarIndeling(pl, cats); await herlaadDiepvries(); sluitPaneel(); render(); toast("Indeling bewaard"); });
    }
  };
  teken();
}

/* ---------- Dozen ---------- */
function openDozen(){
  const teken = () => {
    const bezet = new Map(S.dv.items.filter(i => i.doos_id).map(i => [i.doos_id, i]));
    const dz = S.dv.dozen.slice().sort((a, b) => a.nummer - b.nummer);
    openPaneel(`
      <div class="paneel-kop"><h2>Dozen</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
      <form class="stack" id="dz-form" style="gap:8px"><div class="lbl-klein">Nieuwe dozen</div>
        <div class="rij drie" style="margin:0"><div class="veld"><label for="dz-n">Aantal</label><input class="in" id="dz-n" type="number" min="1" max="200" step="1" value="10"></div>
          <div class="veld"><label for="dz-ml">Inhoud</label><select class="in" id="dz-ml"><option value="">onbekend</option>${DV_MAATEN.map(m => `<option value="${m}" ${m === 1000 ? "selected" : ""}>${fmtNum(m / 1000)} l</option>`).join("")}</select></div>
          <div class="veld"><label for="dz-vorm">Vorm</label><input class="in" id="dz-vorm" placeholder="rechthoekig"></div></div>
        <p class="neg-tekst" id="dz-fout" hidden style="font-size:.88rem;margin:0"></p>
        <div><button class="knop">Nummers aanmaken</button></div></form>
      <h3 style="margin-top:16px">${dz.filter(d => d.actief).length} dozen in gebruik · ${bezet.size} gevuld</h3>
      <ul class="vlijst">${dz.map(d => { const i = bezet.get(d.id);
        return `<li><span><span class="dv-doos" style="display:inline-block;min-width:52px;margin-right:8px">${d.label}</span>${i ? esc(i.naam) : `<span class="muted">${d.actief ? "leeg" : "niet in gebruik"}</span>`}</span>
          <span class="muted" style="display:flex;gap:10px;align-items:center">${d.inhoud_ml ? fmtNum(d.inhoud_ml / 1000) + " l" : ""}<label class="toggle"><input type="checkbox" data-dzactief="${d.id}" ${d.actief ? "checked" : ""} aria-label="${d.label} in gebruik"></label></span></li>`; }).join("")}</ul>
      <p class="muted" style="font-size:.85rem">Een doos die stuk of weg is, zet je uit. Het nummer wordt niet opnieuw gebruikt, zodat een oud etiket nooit naar een andere doos wijst.</p>`);
    const p = $("#paneel");
    p.onsubmit = e => { e.preventDefault();
      const n = Number($("#dz-n").value);
      if (!(n >= 1 && n <= 200)){ const f = $("#dz-fout"); f.textContent = "Aantal tussen 1 en 200"; f.hidden = false; return; }
      run(async () => { const l = await db.dvDozenToevoegen(n, Number($("#dz-ml").value) || null, $("#dz-vorm").value.trim()); await herlaadDiepvries(); teken(); render();
        toast(`${l[0]}${l.length > 1 ? "–" + l[l.length - 1] : ""} aangemaakt. Druk de etiketten voor deze nummers.`); }); };
    p.oninput = () => { const f = $("#dz-fout"); if (f) f.hidden = true; };
    p.onchange = e => { const id = e.target.dataset.dzactief; if (!id) return;
      run(async () => { await db.dvDoosActief(id, e.target.checked); await herlaadDiepvries(); render(); }); };
  };
  teken();
}

/* ---------- Gebeurtenissen buiten panelen ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.closest("#paneel")) return;
  if ("dvplaats" in t.dataset){ S.dvPlaats = t.dataset.dvplaats && S.dvPlaats !== t.dataset.dvplaats ? t.dataset.dvplaats : null; viewDiepvries(); }
  else if (t.dataset.dvfilter){ S.dvFilter = S.dvFilter === t.dataset.dvfilter ? "alle" : t.dataset.dvfilter; if (S.tab !== "diepvries"){ S.tab = "diepvries"; history.replaceState(null, "", "#diepvries"); render(); } else viewDiepvries(); }
  else if (t.dataset.dvitem) openDvItem(t.dataset.dvitem);
  else if ("dvinvriezen" in t.dataset) openInvriezen();
  else if ("dvindeling" in t.dataset) openIndeling();
  else if ("dvdozen" in t.dataset) openDozen();
});
document.addEventListener("input", e => {
  if (e.target.id === "dv-doosnr") S.dvDoosnr = e.target.value;
  if (e.target.id === "dv-zoek"){ S.dvZoek = e.target.value; const pos = e.target.selectionStart; viewDiepvries(); const z = $("#dv-zoek"); z.focus(); z.setSelectionRange(pos, pos); }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "dv-doosform") return;
  e.preventDefault(); const v = $("#dv-doosnr").value; S.dvDoosnr = ""; if (!v.trim()) { $("#dv-doosnr").focus(); toast("Geef een doosnummer"); return; } openDoos(v);
});
</script>
<style>
.be-knoppen{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.banner.be-echt{background:color-mix(in srgb, var(--primary) 14%, var(--surface));border:1px solid var(--primary)}
</style>
<script>/* Kring – testversie: echte budgetcijfers ophalen uit de YNAB-spiegel (Supabase, schema ynab) via de
   Supabase-koppeling van wie de pagina bekijkt. Vaste leesquery's, plan "Gezamelijke", laatste 13 maanden.
   Opgehaald in kleine delen (algemeen, transacties per 3 maanden, controle per 4 maanden) met korte sleutels,
   omdat één groot antwoord (± 450 kB) niet goed doorkwam. De app zet alles terug in het formaat van
   gezin.budget_gegevens. Niets wordt in de pagina of de browser bewaard, enkel de keuze "automatisch ophalen". */
"use strict";
const BE_PROJECT = "yjeldhekcpylxjemcrff";
const BE_KOP = `with par as (select p.plan_id as v_plan, (date_trunc('month', current_date) - interval '13 months')::date as v_start
    from ynab.plan p where p.name = 'Gezamelijke' limit 1),
  cat as (select c.category_id, left(c.category_id::text, 8) as k, left(c.category_group_id::text, 8) as gk, c.name, c.hidden, c.goal_type, c.goal_target,
      g.name = 'Credit Card Payments' as kk, (c.internal or g.internal) and g.name <> 'Credit Card Payments' as intern, c.name like 'Inflow:%' as inflow
    from ynab.category c join ynab.category_group g using (category_group_id), par
    where c.plan_id = par.v_plan and not c.deleted and not g.deleted),
  mc as (select m.month, m.budgeted, m.balance, m.activity, cat.k, cat.kk, cat.intern, cat.inflow
    from ynab.month_category m join cat using (category_id), par where m.plan_id = par.v_plan)`;
const BE_SQL_ALG = BE_KOP + `,
  per as (select month, sum(activity) filter (where inflow) as inkomen, sum(budgeted) filter (where not intern) as toegewezen,
      sum(least(balance, 0)) filter (where not intern and not kk) as overbesteed
    from mc, par where month <= par.v_start group by month),
  a_start as (select coalesce(sum(inkomen), 0) - coalesce(sum(toegewezen), 0)
      + coalesce(sum(overbesteed) filter (where month < (select v_start from par)), 0) as a from per)
select jsonb_build_object(
  'huidig', to_char(current_date, 'YYYY-MM'),
  'startmaand', to_char((select v_start from par), 'YYYY-MM'),
  'groepen', (select jsonb_agg(jsonb_build_object('id', left(g.category_group_id::text, 8), 'naam', g.name) order by g.name = 'Credit Card Payments', g.name)
      from ynab.category_group g, par where g.plan_id = par.v_plan and not g.deleted and (not g.internal or g.name = 'Credit Card Payments')
        and exists (select 1 from cat where cat.gk = left(g.category_group_id::text, 8) and not cat.intern)),
  'categorieen', (select jsonb_agg(jsonb_build_object('id', c.k, 'groep_id', c.gk, 'naam', c.name, 'verborgen', c.hidden,
      'target', case when c.goal_type in ('MF', 'NEED') and c.goal_target > 0 then jsonb_build_object('type', 'maand', 'bedrag', round(c.goal_target * 100))
                     when c.goal_type in ('TB', 'TBD') and c.goal_target > 0 then jsonb_build_object('type', 'buffer', 'bedrag', round(c.goal_target * 100)) end,
      'activiteit_per_maand', case when c.kk then (select jsonb_object_agg(to_char(m.month, 'YYYY-MM'), round(m.activity * 100)) from mc m, par where m.k = c.k and m.month > par.v_start) end))
    from cat c where not c.intern and not c.inflow),
  'rekeningen', (select jsonb_agg(jsonb_build_object('id', left(a.account_id::text, 8), 'naam', a.name,
      'type', case a.type when 'checking' then 'zicht' when 'savings' then 'spaar' when 'cash' then 'cash' when 'creditCard' then 'krediet' else 'tracking' end,
      'op_budget', a.on_budget, 'gesloten', a.closed) order by a.on_budget desc, a.closed, a.name)
    from ynab.account a, par where a.plan_id = par.v_plan and not a.deleted),
  'toewijzingen', coalesce((select jsonb_object_agg(m, b) from (select to_char(month, 'YYYY-MM') as m, jsonb_object_agg(k, round(budgeted * 100)) as b
      from mc, par where month > par.v_start and budgeted <> 0 and not intern group by month) q), '{}'::jsonb),
  'start', jsonb_build_object('maand', to_char((select v_start from par), 'YYYY-MM'), 'A', (select round(a * 100) from a_start),
      'beschikbaar', coalesce((select jsonb_object_agg(k, round(balance * 100)) from mc, par where month = par.v_start and not intern and not inflow), '{}'::jsonb)),
  'te_verdelen', (select jsonb_object_agg(to_char(month, 'YYYY-MM'), round(to_be_budgeted * 100)) from ynab.month_summary, par where plan_id = par.v_plan and month > par.v_start),
  'begin', (select coalesce(jsonb_agg(jsonb_build_array(r, s)), '[]'::jsonb) from (select left(t.account_id::text, 8) as r, round(sum(t.amount) * 100) as s
      from ynab.txn t, par where t.plan_id = par.v_plan and not t.deleted and t.date < (par.v_start + interval '1 month')::date group by 1) b)
) as d`;
const beSqlTx = (van, tot) => BE_KOP + `
select coalesce(jsonb_agg(jsonb_build_array(t.date, left(t.account_id::text, 8), round(t.amount * 100), coalesce(p.name, ''), coalesce(t.memo, ''),
    case when c.inflow then 'RTA' else left(t.category_id::text, 8) end, left(t.transfer_account_id::text, 8),
    case t.cleared when 'reconciled' then 'r' when 'cleared' then 'c' else 'u' end,
    case when t.is_split then (select jsonb_agg(jsonb_build_array(case when sc.inflow then 'RTA' else left(s.category_id::text, 8) end, round(s.amount * 100), coalesce(s.memo, '')))
      from ynab.subtxn s left join cat sc on sc.category_id = s.category_id where s.plan_id = t.plan_id and s.transaction_id = t.transaction_id and not s.deleted) end
  ) order by t.date), '[]'::jsonb) as d
from ynab.txn t join par on t.plan_id = par.v_plan
left join ynab.payee p on p.payee_id = t.payee_id and p.plan_id = t.plan_id
left join cat c on c.category_id = t.category_id
where not t.deleted and t.date >= to_date('${van}', 'YYYY-MM') and t.date < (to_date('${tot}', 'YYYY-MM') + interval '1 month')::date`;
const beSqlCtl = (van, tot) => BE_KOP + `
select coalesce((select jsonb_object_agg(m, b) from (select to_char(month, 'YYYY-MM') as m, jsonb_object_agg(k, round(balance * 100)) as b
  from mc where month >= to_date('${van}', 'YYYY-MM') and month <= to_date('${tot}', 'YYYY-MM') and not intern and not inflow group by month) q), '{}'::jsonb) as d`;

const BE = { status: "test", bij: null, fout: null, bezig: false, stap: 0, stappen: 0 };

/* Antwoord van execute_sql lezen: tekst met een <untrusted-data-…>-omslag rond een JSON-lijst van rijen */
function beParse(r){
  let t = r && r.payload, bron = "";
  if (Array.isArray(t)) return t[0] && t[0].d;
  if (t && typeof t === "object") t = typeof t.result === "string" ? t.result : null;
  if (typeof t !== "string"){
    const blok = ((r && r.content) || []).find(c => c.type === "text");
    t = blok ? blok.text : "";
    try { const j = JSON.parse(t); if (j && typeof j.result === "string") t = j.result; else if (Array.isArray(j)) return j[0] && j[0].d; } catch (e) { /* tekst */ }
  }
  bron = String(t || "");
  // De rijen staan tussen de omslagtags; soms zijn regeleinden en aanhalingstekens nog ge-escapet (\n, \")
  // De inleidende zin noemt de tag zelf ook ("within the below <untrusted-data-…> boundaries"), dus de laatste openingstag vóór de sluittag nemen
  const sluit = bron.indexOf("</untrusted-data-"), open = sluit < 0 ? -1 : bron.lastIndexOf("<untrusted-data-", sluit);
  const kern = open < 0 ? bron : bron.slice(bron.indexOf(">", open) + 1, sluit).replace(/^(?:\s|\\n)+|(?:\s|\\n)+$/g, "");
  const pogingen = [() => JSON.parse(kern), () => JSON.parse(JSON.parse('"' + kern + '"'))];
  for (const p of pogingen) { try { const rijen = p(); if (Array.isArray(rijen)) return rijen[0] ? rijen[0].d : null; } catch (e) { /* volgende poging */ } }
  throw { code: "formaat", detail: `${bron.length} tekens ontvangen, begint met "${bron.slice(0, 40)}", eindigt op "${bron.slice(-60)}"` };
}
const beMaandPlus = (ym, n) => { const [y, m] = ym.split("-").map(Number), d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
const beOK = s => /^\d{4}-\d{2}$/.test(s);

const BE_FOUT = {
  geen_mcp: "Echte cijfers ophalen kan enkel als je deze pagina in claude.ai opent (niet in een los browservenster of via een publieke link).",
  not_granted: "Deze pagina mag je Supabase-koppeling niet gebruiken in deze weergave.",
  capability_disabled: "Deze pagina mag je Supabase-koppeling niet gebruiken in deze weergave.",
  not_in_manifest: "Je hebt de pagina geen toegang tot Supabase gegeven. Probeer opnieuw en kies Toestaan, of zet het aan via het menu Machtigingen van de pagina.",
  approval_required: "Ophalen heeft je toestemming nodig. Klik opnieuw op Echte cijfers ophalen en kies Toestaan.",
  consent_required: "Ophalen heeft je toestemming nodig. Klik opnieuw op Echte cijfers ophalen en kies Toestaan.",
  server_not_connected: "Supabase is niet gekoppeld aan je account. Voeg het toe in claude.ai bij Instellingen → Connectors.",
  needs_reauth: "Je Supabase-koppeling is verlopen. Verbind ze opnieuw in claude.ai bij Instellingen → Connectors.",
  selection_required: "Je hebt meer dan één Supabase-koppeling. Kies er één wanneer claude.ai erom vraagt.",
  blocked_by_policy: "Je organisatie laat deze Supabase-functie niet toe vanuit een pagina.",
  server_unavailable: "Supabase antwoordde niet op tijd. Probeer het zo meteen opnieuw.",
  leeg: "Supabase gaf geen budget terug. Bestaat het plan 'Gezamelijke' nog in de spiegel?",
  formaat: "Het antwoord van Supabase kon niet gelezen worden."
};
const beFoutTekst = e => (BE_FOUT[e && e.code] || (e && e.code === "tool_error" ? `Supabase meldde een fout: ${String(e.message || "").slice(0, 200)}` : `Ophalen lukte niet (${(e && e.code) || "onbekend"}). Probeer het opnieuw.`))
  + (e && e.detail ? ` Detail: ${e.detail}` : "");

async function haalEchtBudget(auto){
  if (BE.bezig) return;
  BE.bezig = true; BE.fout = null; BE.stap = 0; BE.stappen = 0; beHerteken();
  const mcp = window.claude && typeof window.claude.use === "function" ? await window.claude.use("mcp").catch(() => null) : null;
  try {
    if (!mcp) throw { code: "geen_mcp" };
    const vraag = async sql => { const r = await mcp.callTool("Supabase", "execute_sql", { project_id: BE_PROJECT, query: sql }, { cache: false }); BE.stap++; beVoortgang(); return beParse(r); };
    const alg = await vraag(BE_SQL_ALG);
    if (!alg || !Array.isArray(alg.categorieen) || !beOK(alg.startmaand) || !beOK(alg.huidig)) throw { code: "leeg" };
    // Maanden na de startmaand tot nu; de laatste reeks loopt door voor transacties met een latere datum
    const maanden = []; for (let m = beMaandPlus(alg.startmaand, 1); m <= alg.huidig; m = beMaandPlus(m, 1)) maanden.push(m);
    const reeksen = (n) => { const out = []; for (let i = 0; i < maanden.length; i += n) out.push([maanden[i], maanden[Math.min(i + n, maanden.length) - 1]]); return out; };
    const txReeksen = reeksen(3).concat([[beMaandPlus(alg.huidig, 1), "2099-12"]]);   // laatste: transacties met een latere datum
    const ctlReeksen = reeksen(4);
    BE.stappen = 1 + txReeksen.length + ctlReeksen.length; beVoortgang();
    // Transacties: lukt een reeks niet (te groot), dan per maand opnieuw
    const haalTx = async ([van, tot]) => {
      try { return await vraag(beSqlTx(van, tot)); }
      catch (e) {
        if (e.code !== "formaat" || van === tot || tot === "2099-12") throw e;
        const deel = []; for (let m = van; m <= tot; m = beMaandPlus(m, 1)) deel.push(m);
        BE.stappen += deel.length - 1;
        return (await Promise.all(deel.map(m => vraag(beSqlTx(m, m))))).flat();
      }
    };
    const [tx, ctl] = await Promise.all([Promise.all(txReeksen.map(haalTx)), Promise.all(ctlReeksen.map(([van, tot]) => vraag(beSqlCtl(van, tot))))]);
    S.budget = beSamenstellen(alg, tx.flat(), Object.assign({}, ...ctl));
    S.bmaand = alg.huidig; S.bcat = null; S.brek = null;
    BE.status = "echt"; BE.bij = new Date();
    pref.set("budget_echt", true);
  } catch (e) {
    BE.fout = e && e.code ? e : { code: "onbekend", detail: String(e && e.message || e) };
    if (auto && ["not_in_manifest", "approval_required", "consent_required", "geen_mcp", "not_granted", "capability_disabled"].includes(BE.fout.code)) BE.fout = null;  // automatisch: stil terugvallen op testcijfers
  }
  BE.bezig = false; beHerteken();
}

/* Zelfde formaat als gezin.budget_gegevens */
function beSamenstellen(alg, tx, ctl){
  const eerste = beMaandPlus(alg.startmaand, 1), [ey, em] = eerste.split("-");
  const begin = alg.begin.map(([r, s]) => ({ id: "b-" + r, rekening_id: r, datum: eerste + "-01", bedrag: s, begunstigde: `Saldo vóór ${em}/${ey}`, categorie_id: null, status: "r" }));
  const rijen = tx.map(([datum, rek, bedrag, begunstigde, memo, cat, transfer, status, splits], i) => ({
    id: "t" + i, rekening_id: rek, datum, bedrag, begunstigde, memo, categorie_id: cat, transfer_rekening_id: transfer, status,
    splits: splits ? splits.map(([c, b, m]) => ({ categorie_id: c, bedrag: b, memo: m })) : null }));
  return { huidig: alg.huidig, bron: "ynab", groepen: alg.groepen || [], categorieen: alg.categorieen, rekeningen: alg.rekeningen || [],
    transacties: begin.concat(rijen).sort((a, b) => a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0),
    toewijzingen: alg.toewijzingen || {}, start: alg.start, controle: { beschikbaar: ctl, te_verdelen: alg.te_verdelen || {} } };
}

function beVoortgang(){ const el = document.getElementById("be-stap"); if (el && BE.stappen) el.textContent = `${Math.min(BE.stap, BE.stappen)} van ${BE.stappen}`; }
function beHerteken(){ if (["budget", "vandaag"].includes(S.tab) && $("#sheet").hidden) render(); }
function beTerug(){ pref.set("budget_echt", false); BE.status = "test"; BE.fout = null; S.bmaand = null; S.bcat = null; S.brek = null; herlaadBudget().then(render); }
function beAuto(){ if (db && db.demo && pref.get("budget_echt", false)) haalEchtBudget(true); }

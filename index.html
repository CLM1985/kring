    <input class="in i-naam" list="ingr-namen" placeholder="Ingrediënt, eventueel notitie" aria-label="Ingrediënt" value="${esc(i.naam ? naamMetNotitie(i) : "")}">
    <select class="in i-afd" aria-label="Afdeling">${opties(AFD, i.afdeling || "Andere")}</select>
    <button type="button" class="del" data-delrow aria-label="Ingrediënt verwijderen">×</button></div>`;
}

function openEditor(id){
  const g = id ? JSON.parse(JSON.stringify(gerecht(id))) : {naam: "", porties: S.porties, categorie: "", bereidingstijd_min: null, omschrijving: "", bereiding: "", bron_url: "", ingredienten: []};
  const bekend = new Map(); S.gerechten.forEach(x => (x.ingredienten || []).forEach(i => { const k = norm(i.naam); if (k && !bekend.has(k)) bekend.set(k, i); }));
  let zeker = false;
  openPaneel(`
    <form id="g-form" novalidate>
    <div class="paneel-kop"><h2>${id ? "Gerecht bewerken" : "Nieuw gerecht"}</h2><button type="button" class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    <div class="veld" style="margin-bottom:10px"><label for="g-naam">Naam</label><input class="in" id="g-naam" value="${esc(g.naam)}" required ${id ? "" : "autofocus"}></div>
    <div class="rij drie">
      <div class="veld"><label for="g-cat">Categorie</label><select class="in" id="g-cat">${opties(["", ...CAT], g.categorie)}</select></div>
      <div class="veld"><label for="g-porties">Personen</label><input class="in" id="g-porties" type="number" min="1" max="40" value="${g.porties}"></div>
      <div class="veld"><label for="g-tijd">Minuten</label><input class="in" id="g-tijd" type="number" min="0" value="${g.bereidingstijd_min ?? ""}"></div>
    </div>
    <div class="veld" style="margin-bottom:10px"><label for="g-url">Bron (link)</label>
      <div class="zoekbalk" style="margin:0"><input class="in" id="g-url" type="url" value="${esc(g.bron_url)}" placeholder="https://…"><button type="button" class="knop sec" data-web>Ophalen</button></div></div>
    <h3 style="margin:16px 0 8px;font-size:1.05rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">Ingrediënten <span class="muted" style="font-family:var(--font-body);font-weight:400;font-size:.85rem">voor ${g.porties} personen</span>
      <button type="button" class="link" data-plak style="margin-left:auto;font-size:.9rem">Lijst plakken</button></h3>
    <div id="plakvak" hidden class="stack" style="margin-bottom:12px">
      <textarea class="in" id="plaktekst" placeholder="Eén ingrediënt per regel, bv.&#10;400 gr vastkokende aardappelen&#10;2 teentjes knoflook&#10;1 ui, fijngesneden"></textarea>
      <div style="display:flex;gap:8px"><button type="button" class="knop klein" data-verwerk>Toevoegen aan de lijst</button><button type="button" class="knop sec klein" data-plak>Annuleren</button></div>
    </div>
    <div class="ikop"><span>Hoev.</span><span>Eenheid</span><span>Ingrediënt</span><span>Afdeling</span><span></span></div>
    <div class="irows" id="irows">${(g.ingredienten.length ? g.ingredienten : [{}, {}, {}]).map(irowHtml).join("")}</div>
    <button type="button" class="link" data-addrow style="margin-top:10px">+ Ingrediënt toevoegen</button>
    <datalist id="ingr-namen">${[...bekend.values()].slice(0, 400).map(i => `<option value="${esc(i.naam)}">`).join("")}</datalist>
    <div class="stack" style="margin-top:16px">
      <div class="veld"><label for="g-omschr">Omschrijving</label><textarea class="in" id="g-omschr" style="min-height:70px">${esc(g.omschrijving)}</textarea></div>
      <div class="veld"><label for="g-bereiding">Bereiding</label><textarea class="in" id="g-bereiding">${esc(g.bereiding)}</textarea></div>
    </div>
    <div class="voet">
      ${id ? `<button type="button" class="knop gevaar links" data-wis>Verwijderen</button>` : ""}
      <button type="button" class="knop sec" data-sluit>Annuleren</button>
      <button class="knop" type="submit">Bewaren</button>
    </div></form>`);

  const p = $("#paneel");
  const voegToe = lijst => {
    const rows = $("#irows");
    [...rows.querySelectorAll(".irow")].forEach(r => { if (!r.querySelector(".i-naam").value.trim()) r.remove(); });
    lijst.forEach(i => rows.insertAdjacentHTML("beforeend", irowHtml({...i, afdeling: (bekend.get(norm(i.naam)) || {}).afdeling || K.afdelingVoor(i.naam)})));
  };
  p.onchange = e => {
    if (!e.target.classList.contains("i-naam")) return;
    const r = e.target.closest(".irow"), k = bekend.get(norm(splitNotitie(e.target.value)[0]));
    if (r.querySelector(".i-afd").value === "Andere") r.querySelector(".i-afd").value = k ? (k.afdeling || "Andere") : K.afdelingVoor(e.target.value);
    if (k && !r.querySelector(".i-eenh").value) r.querySelector(".i-eenh").value = k.eenheid || "";
  };
  p.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if ("addrow" in t.dataset){ $("#irows").insertAdjacentHTML("beforeend", irowHtml()); $("#irows .irow:last-child .i-qty").focus(); }
    else if ("delrow" in t.dataset) t.closest(".irow").remove();
    else if ("plak" in t.dataset){ $("#plakvak").hidden = !$("#plakvak").hidden; if (!$("#plakvak").hidden) $("#plaktekst").focus(); }
    else if ("verwerk" in t.dataset){
      const l = K.leesLijst($("#plaktekst").value.split(/\n/).map(s => s.trim()).filter(Boolean));
      if (!l.length) return toast("Geen ingrediënten herkend");
      voegToe(l); $("#plaktekst").value = ""; $("#plakvak").hidden = true; toast(`${l.length} ingrediënten toegevoegd, kijk ze even na`);
    }
    else if ("web" in t.dataset){
      const url = $("#g-url").value.trim(); if (!/^https?:\/\//.test(url)) return toast("Vul eerst een link in");
      run(async () => {
        t.disabled = true; t.textContent = "Bezig…";
        try {
          const r = await db.receptVanWebsite(url);
          if (r.naam && !$("#g-naam").value.trim()) $("#g-naam").value = r.naam;
          if (r.porties) $("#g-porties").value = r.porties;
          if (r.bereidingstijd_min) $("#g-tijd").value = r.bereidingstijd_min;
          if (r.bereiding && !$("#g-bereiding").value.trim()) $("#g-bereiding").value = r.bereiding;
          if (r.omschrijving && !$("#g-omschr").value.trim()) $("#g-omschr").value = r.omschrijving;
          voegToe(K.leesLijst(r.ingredienten || [])); toast("Recept opgehaald, kijk het even na");
        } catch(err){ $("#plakvak").hidden = false; throw err; }
        finally { t.disabled = false; t.textContent = "Ophalen"; }
      });
    }
    else if ("wis" in t.dataset){
      if (!zeker){ zeker = true; t.textContent = "Zeker? Tik nogmaals"; t.classList.add("zeker"); return; }
      run(async () => { await db.deleteGerecht(id); await herlaadAlles(); sluitPaneel(); render(); toast("Gerecht verwijderd"); });
    }
  };
  p.onsubmit = e => {
    e.preventDefault();
    const naam = $("#g-naam").value.trim();
    if (!naam){ $("#g-naam").focus(); return toast("Geef het gerecht een naam"); }
    const ingredienten = [...p.querySelectorAll(".irow")].map(r => {
      const [n, notitie] = splitNotitie(r.querySelector(".i-naam").value);
      return { naam: n, notitie, hoeveelheid: num(r.querySelector(".i-qty").value), eenheid: r.querySelector(".i-eenh").value, afdeling: r.querySelector(".i-afd").value };
    }).filter(i => i.naam);
    const nieuw = {...g, naam, categorie: $("#g-cat").value, porties: Math.max(1, Math.min(40, parseInt($("#g-porties").value) || 4)),
      bereidingstijd_min: num($("#g-tijd").value), omschrijving: $("#g-omschr").value.trim(), bereiding: $("#g-bereiding").value.trim(), bron_url: $("#g-url").value.trim(), ingredienten};
    run(async () => { await db.saveGerecht(nieuw); await herlaadAlles(); sluitPaneel(); render(); toast("Bewaard"); });
  };
}

/* Product koppelen: één ingrediënt of alle open items na elkaar */
function openKoppel(sleutels, start = 0){
  const sl = sleutels[start];
  if (sl == null){ sluitPaneel(); render(); return toast("Klaar met koppelen"); }
  const it = lijstItems().find(i => i.sleutel === sl) || {naam: sl, q: null, eenheid: ""};
  const huidig = S.koppeling[sl];
  const voorstel = K.stelVoor(it.naam, S.producten, 4);
  let zoek = "";
  const regel = p => { const v = K.verpakkingen(it.q, it.eenheid, p);
    return `<button class="keuze ${huidig && String(huidig.product_id) === String(p.id) ? "sel" : ""}" data-pid="${p.id}"><span>${esc(p.naam)}${!p.beschikbaar ? "<small>tijdelijk onbeschikbaar</small>" : ""}</span><span>${v && v.aantal ? v.aantal + "× · " : ""}${p.prijs != null ? eur(p.prijs) + (p.prijs_per === "kg" ? "/kg" : "") : ""}</span></button>`; };
  const zoeklijst = () => {
    const z = norm(zoek);
    $("#kp-zoek-lijst").innerHTML = z.length < 2 ? "" : S.producten.filter(p => norm(p.naam).includes(z)).slice(0, 20).map(regel).join("") || `<div class="muted">Niets gevonden in jullie eerder gekochte producten.</div>`;
  };
  openPaneel(`
    <div class="paneel-kop"><h2>${esc(it.naam)} <span class="muted" style="font-family:var(--font-body);font-weight:400;font-size:.9rem">${esc(fmtQty(it.q, it.eenheid))}</span></h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    ${sleutels.length > 1 ? `<p class="muted" style="margin:-8px 0 10px">${start + 1} van ${sleutels.length} · geldt voor alle recepten met dit ingrediënt</p>` : `<p class="muted" style="margin:-8px 0 10px">Geldt voor alle recepten met dit ingrediënt</p>`}
    <div class="lbl-klein">Voorstel uit jullie eerdere aankopen</div>
    <div class="keuzes">${voorstel.map(regel).join("") || `<div class="muted">Geen voorstel gevonden.</div>`}</div>
    <div class="veld" style="margin-top:14px"><label for="kp-zoek">Zelf zoeken</label><input class="in" id="kp-zoek" type="search" placeholder="bv. gehakt, room, passata"></div>
    <div class="keuzes" id="kp-zoek-lijst"></div>
    <p class="muted" style="font-size:.85rem">Staat het product er niet tussen? <a href="${K.zoekLink(it.naam)}" target="_blank" rel="noopener">Zoek in Collect&amp;Go</a>. Producten toevoegen kan in de echte versie.</p>
    <div class="voet"><button class="knop sec links" data-geen>Geen product</button>${sleutels.length > 1 ? `<button class="knop sec" data-over>Overslaan</button>` : `<button class="knop sec" data-sluit>Sluiten</button>`}</div>`);
  const p = $("#paneel");
  p.oninput = e => { if (e.target.id === "kp-zoek"){ zoek = e.target.value; zoeklijst(); } };
  p.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.pid || "geen" in t.dataset) run(async () => { await db.setKoppeling(sl, t.dataset.pid || null); await herlaadProducten(); if (sleutels.length > 1) openKoppel(sleutels, start + 1); else { sluitPaneel(); render(); toast("Gekoppeld"); } });
    else if ("over" in t.dataset) openKoppel(sleutels, start + 1);
  };
}

function openInstellingen(){
  openPaneel(`
    <div class="paneel-kop"><h2>Instellingen</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div>
    <div class="stack">
      <div class="lbl-klein">Maaltijdmomenten in het weekmenu</div>
      <div class="chips" style="margin:0">${MOMENTEN.map(([k, l]) => `<label class="toggle chip"><input type="checkbox" data-moment="${k}" ${S.momenten.includes(k) ? "checked" : ""}> ${l}</label>`).join("")}</div>
      ${instellingenAgendaHtml()}
      ${db.demo ? `<p class="muted">Testversie: gegevens staan enkel in deze browser.</p><div><button class="knop gevaar" data-reset>Testdata herstellen</button></div>`
        : `<p><b>${esc(db.huis.naam)}</b><br><span class="muted">Uitnodigcode voor je partner:</span> <b style="font-family:ui-monospace,monospace;letter-spacing:.08em">${esc(db.huis.uitnodigcode)}</b></p>
           <div><button class="knop sec" data-import>Recepten en producten importeren (kring-seed.json)</button></div>
           <div><button class="knop sec" data-afmelden>Afmelden</button></div>`}
    </div>`);
  const p = $("#paneel");
  instellingenAgendaBind(p);
  p.onchange = e => { const k = e.target.dataset.moment; if (!k) return;
    S.momenten = MOMENTEN.map(x => x[0]).filter(m => m === k ? e.target.checked : S.momenten.includes(m));
    if (!S.momenten.length){ S.momenten = ["avond"]; e.target.checked = k === "avond"; }
    pref.set("momenten", S.momenten); render(); };
  p.onclick = e => {
    const t = e.target.closest("button"); if (!t) return;
    if ("reset" in t.dataset) run(async () => { await db.reset(); await herlaadAlles(); sluitPaneel(); render(); toast("Testdata hersteld"); });
    if ("import" in t.dataset) run(async () => { t.disabled = true; const n = await db.importeerFamilyWall(); await herlaadAlles(); sluitPaneel(); render(); toast(`${n} recepten geïmporteerd`); });
    if ("afmelden" in t.dataset) run(() => db.afmelden());
  };
}

/* ================= Login en start (Supabase) ================= */
function verbergApp(){ $("#weeknav").hidden = true; $("#meer").hidden = true; $("#tabs").hidden = true; }
function toonLogin(st){
  verbergApp();
  $("#view").innerHTML = `<div class="login"><h1>Aanmelden</h1>
    <p class="muted">Je krijgt een link per mail. Geen wachtwoord nodig.</p>
    <form class="stack" id="login-form"><div class="veld"><label for="l-mail">E-mailadres</label><input class="in" id="l-mail" type="email" autocomplete="email" required></div>
    <button class="knop">Stuur aanmeldlink</button><p id="l-msg" class="muted"></p></form></div>`;
  $("#login-form").onsubmit = e => { e.preventDefault(); run(async () => {
    const {error} = await st.sb.auth.signInWithOtp({email: $("#l-mail").value.trim(), options: {emailRedirectTo: location.origin + location.pathname}});
    if (error) throw new Error(error.message);
    $("#l-msg").textContent = "Check je mailbox en open de link op dit toestel.";
  }); };
}
function toonStart(st){
  verbergApp();
  $("#view").innerHTML = `<div class="login"><h1>Welkom</h1>
    <p class="muted">Maak jullie gezin aan, of sluit aan met de code die je partner kreeg.</p>
    <div class="veld" style="margin-top:16px"><label for="s-wie">Jouw naam</label><input class="in" id="s-wie" required></div>
    <form class="stack" id="f-nieuw"><h2 style="font-size:1.1rem;margin-top:12px">Nieuw gezin</h2><input class="in" id="s-huis" placeholder="Naam gezin" aria-label="Naam gezin" required><button class="knop">Gezin aanmaken</button></form>
    <form class="stack" id="f-code"><h2 style="font-size:1.1rem;margin-top:12px">Aansluiten</h2><input class="in" id="s-code" placeholder="Uitnodigcode" aria-label="Uitnodigcode" required><button class="knop sec">Aansluiten</button></form></div>`;
  const wie = () => { const v = $("#s-wie").value.trim(); if (!v){ $("#s-wie").focus(); throw new Error("vul je naam in"); } return v; };
  $("#f-nieuw").onsubmit = e => { e.preventDefault(); run(async () => { await st.maakHuis($("#s-huis").value.trim(), wie()); location.reload(); }); };
  $("#f-code").onsubmit = e => { e.preventDefault(); run(async () => { await st.aansluiten($("#s-code").value.trim(), wie()); location.reload(); }); };
}

/* ================= Gebeurtenissen ================= */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.closest("#paneel")) { if (t && "sluit" in t.dataset) sluitPaneel(); return; }
  if (t.dataset.tab){ S.tab = t.dataset.tab; if (S.tab === "lijsten") S.lijstOpen = null; if (location.hash !== "#" + S.tab) history.replaceState(null, "", "#" + S.tab); render(); window.scrollTo(0, 0); }
  else if (t.dataset.goto){ S.tab = t.dataset.goto; history.replaceState(null, "", "#" + S.tab); render(); window.scrollTo(0, 0); }
  else if (t.dataset.slot){ const [d, m] = t.dataset.slot.split("|"); openKiezer(d, m); }
  else if (t.dataset.open) openRecept(t.dataset.open);
  else if ("nieuw" in t.dataset) openEditor(null);
  else if ("onvolledig" in t.dataset){ S.onvolledig = !S.onvolledig; S.cat = ""; viewGerechten(); }
  else if ("cat" in t.dataset){ S.cat = t.dataset.cat; S.onvolledig = false; viewGerechten(); }
  else if (t.dataset.koppel) openKoppel([t.dataset.koppel]);
  else if ("koppelalles" in t.dataset){
    const sl = [...new Set(lijstItems().filter(i => !i.af && !i.voorraad && !(i.koppeling && i.koppeling.bevestigd)).map(i => i.sleutel))];
    openKoppel(sl);
  }
  else if (t.dataset.delextra) run(async () => { await db.deleteExtra(t.dataset.delextra); await herlaadWeek(); render(); });
  else if ("kopieer" in t.dataset) kopieer();
  else if ((t.id === "w-prev" || t.id === "w-next" || t.id === "w-nu") && S.tab === "budget" && S.budget){
    S.bmaand = t.id === "w-nu" ? S.budget.huidig : t.id === "w-prev" ? vorigeMnd(S.bmaand) : KB.volgende(S.bmaand);
    if (!budgetBerekening().per[S.bmaand]) S.bmaand = t.id === "w-prev" ? budgetBerekening().maanden[0] : budgetBerekening().maanden.slice(-1)[0];
    render(); }
  else if (t.dataset.bview){ S.budgetView = t.dataset.bview; pref.set("budgetView", S.budgetView); render(); }
  else if (t.dataset.bfilter){ S.bfilter = t.dataset.bfilter; budgetPlan(); }
  else if (t.dataset.bcat) openInspector(t.dataset.bcat);
  else if (t.dataset.brek){ S.brek = t.dataset.brek; budgetRekeningen(); }
  else if ("lijst" in t.dataset){ S.lijstOpen = t.dataset.lijst || null; render(); window.scrollTo(0, 0); }
  else if ("nieuwelijst" in t.dataset) openLijstInst(null);
  else if (t.dataset.lijstinst) openLijstInst(t.dataset.lijstinst);
  else if (t.dataset.litembewerk){ const [a, b] = t.dataset.litembewerk.split("|"); openItemDetails(a, b); }
  else if (t.id === "snel") openSnel();
  else if ((t.id === "w-prev" || t.id === "w-next" || t.id === "w-nu") && S.tab === "agenda" && S.agendaView === "maand"){
    S.maand = t.id === "w-nu" ? new Date() : new Date(S.maand.getFullYear(), S.maand.getMonth() + (t.id === "w-prev" ? -1 : 1), 1); render(); }
  else if (t.id === "w-prev" || t.id === "w-next" || t.id === "w-nu") run(async () => {
    S.week = t.id === "w-nu" ? maandag(new Date()) : plus(S.week, t.id === "w-prev" ? -7 : 7); S.maand = new Date(S.week); await herlaadWeek(); render(); });
  else if (t.dataset.agview){ S.agendaView = t.dataset.agview; pref.set("agendaView", S.agendaView); if (S.agendaView === "maand") S.maand = new Date(S.week); render(); }
  else if (t.dataset.kal){ const k = t.dataset.kal; S.verborgen = S.verborgen.includes(k) ? S.verborgen.filter(x => x !== k) : [...S.verborgen, k]; pref.set("verborgen", S.verborgen); render(); }
  else if ("nieuwitem" in t.dataset) openNieuwKeuze(iso(new Date()) >= iso(S.week) && iso(new Date()) <= iso(plus(S.week, 6)) ? iso(new Date()) : iso(S.week));
  else if (t.dataset.nieuwop) openNieuwKeuze(t.dataset.nieuwop);
  else if (t.dataset.dag) openDag(t.dataset.dag);
  else if (t.dataset.item) openItem(t.dataset.item);
  else if (t.id === "meer") openInstellingen();
});
document.addEventListener("click", e => { const tr = e.target.closest("tr[data-bcat]"); if (tr && !e.target.closest("button")) openInspector(tr.dataset.bcat); });
document.addEventListener("keydown", e => { const tr = e.target.closest && e.target.closest("tr[data-bcat]"); if (tr && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openInspector(tr.dataset.bcat); } });
document.addEventListener("input", e => {
  if (e.target.id === "zoek"){ S.zoek = e.target.value; lijstGerechten(); }
  if (e.target.id === "zijzoek"){ S.zijzoek = e.target.value; zijlijst(); }
  if (e.target.id === "bzoek"){ S.bzoek = e.target.value; const pos = e.target.selectionStart; budgetRekeningen(); const z = $("#bzoek"); z.focus(); z.setSelectionRange(pos, pos); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.closest("#paneel")) return;
  if (t.dataset && t.dataset.taak){ agendaVinkWijzig(e); return; }
  if (t.dataset && t.dataset.litem){ const [a, b] = t.dataset.litem.split("|"); const it = t.closest(".item,.ag-item"); if (it) it.classList.toggle(it.classList.contains("item") ? "af" : "klaar", t.checked);
    run(async () => { await db.vinkItem(a, b, t.checked); await herlaadGezin(); if (S.tab !== "lijsten" || S.verberg) render(); }); return; }
  if (t.dataset && t.dataset.check){
    const key = t.dataset.check, val = t.checked, wk = iso(S.week);
    t.closest(".item").classList.toggle("af", val);
    run(async () => {
      if (key.startsWith("x:")) await db.toggleExtra(key.slice(2), val); else await db.setCheck(wk, key, val);
      await herlaadWeek(); if (S.verberg) render(); else { const o = lijstItems().filter(i => !i.af && !i.voorraad).length; const g = $("#view .samenvatting .getal"); if (g) g.textContent = o; }
    });
  } else if (t.id === "verberg"){ S.verberg = t.checked; pref.set("verberg", S.verberg); render(); }
});
document.addEventListener("submit", e => {
  if (e.target.id === "item-form"){ e.preventDefault(); const v = $("#item-tekst").value.trim(); if (!v) return; const l = S.lijsten.find(x => x.id === S.lijstOpen);
    const p = leesSnel(v); run(async () => { await db.bewaarItem(l.id, {tekst: p.datum ? p.titel : v, klaar: false, lid_id: null, deadline: p.datum}); await db.log(`zette '${p.datum ? p.titel : v}' op ${l.naam}`); await herlaadGezin(); render(); }); return; }
  if (e.target.id !== "extra-form") return;
  e.preventDefault();
  const naam = $("#x-naam").value.trim(); if (!naam) return;
  run(async () => { await db.addExtra(iso(S.week), {naam, afdeling: $("#x-afd").value}); await herlaadWeek(); render(); $("#x-naam").focus(); });
});
// Slepen: recept uit zijpaneel → dag, of dag → andere dag (verplaatsen)
document.addEventListener("dragstart", e => {
  const s = e.target.closest("[data-sleep],[data-slot]"); if (!s) return;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", s.dataset.sleep ? "g:" + s.dataset.sleep : "s:" + s.dataset.slot);
});
document.addEventListener("dragover", e => { const s = e.target.closest(".slot"); if (s){ e.preventDefault(); s.classList.add("over"); } });
document.addEventListener("dragleave", e => { const s = e.target.closest(".slot"); if (s && !s.contains(e.relatedTarget)) s.classList.remove("over"); });
document.addEventListener("drop", e => {
  const s = e.target.closest(".slot"); if (!s) return;
  e.preventDefault(); s.classList.remove("over");
  const v = e.dataTransfer.getData("text/plain"), [ds, mo] = s.dataset.slot.split("|");
  run(async () => {
    if (v.startsWith("g:")) await db.setSlot(ds, mo, {gerecht_id: v.slice(2), porties: S.porties});
    else if (v.startsWith("s:")){
      const [vd, vm] = v.slice(2).split("|"); if (vd === ds && vm === mo) return;
      const van = slot(vd, vm), naar = slot(ds, mo);
      await db.setSlot(ds, mo, van);
      if (naar) await db.setSlot(vd, vm, naar); else await db.clearSlot(vd, vm);
    }
    await herlaadWeek(); render();
  });
});
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") sluitPaneel(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) sluitPaneel(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["vandaag","agenda","menu","gerechten","lijst","lijsten","budget"].includes(h) && h !== S.tab){ S.tab = h; render(); } });
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (db && ["menu", "budget", "vandaag", "agenda"].includes(S.tab) && $("#sheet").hidden) render(); }, 200); });

async function kopieer(){
  const items = lijstItems().filter(i => !i.af && !i.voorraad);
  const txt = `Boodschappen week ${weeknr(S.week)}\n` + AFD.map(a => {
    const l = items.filter(i => i.afdeling === a); if (!l.length) return "";
    return `\n${a}\n` + l.map(i => `- ${fmtQty(i.q, i.eenheid) ? fmtQty(i.q, i.eenheid) + " " : ""}${i.naam}${i.product ? ` → ${i.pak && i.pak.aantal ? i.pak.aantal + "× " : ""}${i.product.naam}` : ""}`).join("\n");
  }).join("") + "\n";
  try { await navigator.clipboard.writeText(txt); toast("Lijst gekopieerd"); }
  catch(e){ openPaneel(`<div class="paneel-kop"><h2>Lijst</h2><button class="ib" data-sluit aria-label="Sluiten">✕</button></div><textarea class="in" id="kopie" style="min-height:300px">${esc(txt)}</textarea>`, () => $("#kopie").select()); }
}

/* ================= Start ================= */
function laadScript(src){ return new Promise((ok, nok) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => nok(new Error("Kon " + src + " niet laden")); document.head.appendChild(s); }); }
(async function start(){
  const cfg = window.KRING_CONFIG || {};
  const h = location.hash.slice(1); if (["vandaag","agenda","menu","gerechten","lijst","lijsten","budget"].includes(h)) S.tab = h;
  try {
    if (cfg.supabaseUrl && cfg.supabaseKey){
      await laadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js");
      db = new SupaStore(cfg);
    } else if (window.KRING_SEED) db = new LocalStore();
    else { $("#view").innerHTML = `<div class="login"><h1>Kring</h1><p class="muted">Deze site is nog niet gekoppeld aan de database. Vul <code>config.js</code> in met de Supabase-URL en de publishable key.</p></div>`; verbergApp(); $("#snel").hidden = true; return; }
    if (!(await db.init())) return;
    await herlaadAlles();
    render();
  } catch(e){ console.error(e); $("#view").innerHTML = `<div class="leegstaat">De app kon niet starten: ${esc(e.message)}</div>`; }
})();
</script>
